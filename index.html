<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник — Петя и Федя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#f7f2e6;
    --paper-line:#ded2b4;
    --margin:#b6483f;
    --ink:#26313d;
    --ink-soft:#647184;
    --card:#fffdf8;
    --petya:#2e5a88;
    --petya-soft:#e4edf6;
    --fedya:#3f7a4c;
    --fedya-soft:#e8f2e9;
    --warn:#b6483f;
    --warn-soft:#f7e6e3;
    --done:#4b8b5b;
    --done-soft:#e6f1e8;
    --gold:#a9761e;
    --gold-soft:#f6ecd8;
    --radius:10px;
    --shadow:0 1px 2px rgba(38,49,61,.08), 0 4px 14px rgba(38,49,61,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 30px, var(--paper-line) 30px 31px);
    color:var(--ink);
    font-family:'PT Sans', system-ui, sans-serif;
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
    padding-left:26px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    top:0; bottom:0; left:22px;
    width:2px;
    background:var(--margin);
    opacity:.55;
  }
  h1,h2,h3,.kid-name,.day-name{font-family:'PT Serif', Georgia, serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  header.top h1{font-size:26px;margin:0;font-weight:700;color:var(--ink);}
  header.top .subtitle{color:var(--ink-soft);font-size:13.5px;}

  nav.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--paper-line);}
  nav.tabs button{
    font-family:'PT Serif', serif;
    font-size:15px;
    background:transparent;
    border:none;
    padding:9px 18px 10px;
    cursor:pointer;
    color:var(--ink-soft);
    border-radius:8px 8px 0 0;
    position:relative;
    top:2px;
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    font-weight:700;
    border:2px solid var(--paper-line);
    border-bottom:2px solid var(--card);
  }

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .seg{display:flex;background:var(--card);border:1px solid var(--paper-line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .seg button{border:none;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--ink-soft);font-family:inherit;}
  .seg button.active{background:var(--ink);color:var(--paper);}
  .navbtns{display:flex;align-items:center;gap:4px;}
  .navbtns button{border:1px solid var(--paper-line);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--ink);box-shadow:var(--shadow);}
  .navbtns .today{width:auto;padding:0 14px;font-family:'PT Sans';font-size:13.5px;}
  .range-label{font-family:'PT Serif',serif;font-size:17px;font-weight:700;margin-left:4px;}
  .spacer{flex:1;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;padding:8px 12px;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;}
  .legend .litem{display:flex;align-items:center;gap:5px;}
  .kid-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;flex:none;}
  .kid-badge.petya{background:var(--petya);}
  .kid-badge.fedya{background:var(--fedya);}

  .olympiad-banner{background:var(--gold-soft);border:1px solid var(--gold);color:#7a5613;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;}
  .olympiad-banner .ob-row{display:flex;gap:8px;align-items:center;}

  .banner{background:var(--warn-soft);color:var(--margin);border:1px dashed var(--margin);border-radius:8px;padding:7px 11px;font-size:13px;margin-bottom:8px;}
  .banner.holiday{background:#eef2e4;color:#5c6b3f;border-color:#8a9a5b;}
  .banner.olympiad{background:var(--gold-soft);color:#7a5613;border-color:var(--gold);}

  /* day table (merged Petya/Fedya by period) */
  .day-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;}
  .day-card .dc-head{font-size:17px;font-weight:700;margin-bottom:2px;}
  .day-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .day-table th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--paper-line);}
  .day-table th.col-petya{color:var(--petya);}
  .day-table th.col-fedya{color:var(--fedya);}
  .day-table td{padding:5px 8px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  .day-table td.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;width:88px;}
  .cell-lesson{cursor:pointer;border-radius:7px;padding:6px 9px;border:1px solid transparent;}
  .cell-lesson:hover{background:rgba(0,0,0,.035);}
  .cell-lesson.petya{border-left:3px solid var(--petya);}
  .cell-lesson.fedya{border-left:3px solid var(--fedya);}
  .cell-empty{color:var(--paper-line);font-size:12px;padding-left:9px;}
  .cell-subject{font-size:13.5px;}
  .cell-hw{float:right;font-size:13px;}

  /* week view: 5 mini day-cards in a row */
  .week-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .week-daycard{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;flex:0 0 230px;min-width:230px;}
  .week-daycard .wd-head{font-size:13px;font-weight:700;text-align:center;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--paper-line);}
  .week-daycard .wd-head.today{color:var(--margin);}
  .wd-period{display:flex;gap:6px;align-items:stretch;padding:5px 0;border-bottom:1px dotted var(--paper-line);}
  .wd-period:last-of-type{border-bottom:none;}
  .wd-ptime{flex:0 0 32px;font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:4px;}
  .wd-pair{display:flex;gap:5px;flex:1;min-width:0;}
  .wd-cell{flex:1;min-width:0;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:11.5px;line-height:1.28;white-space:normal;word-break:break-word;box-sizing:border-box;}
  .wd-cell:last-child{margin-bottom:0;}
  .wd-cell.petya{background:var(--petya-soft);color:var(--petya);}
  .wd-cell.fedya{background:var(--fedya-soft);color:var(--fedya);}
  .wd-cell.empty{background:transparent;color:var(--paper-line);cursor:default;font-size:12px;padding:4px 6px;}
  .wd-flags{font-size:11px;margin-top:4px;color:var(--gold);word-break:break-word;}
  .wd-add{display:block;width:100%;text-align:center;background:none;border:1px dashed var(--paper-line);color:var(--ink-soft);border-radius:6px;font-size:11px;padding:5px 0;margin-top:8px;cursor:pointer;font-family:inherit;}
  .wd-add:hover{border-color:var(--ink-soft);color:var(--ink);}

  /* month grid (merged) */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-dow{font-size:11px;text-align:center;color:var(--ink-soft);padding-bottom:4px;}
  .month-cell{min-height:72px;border:1px solid var(--paper-line);border-radius:7px;padding:6px 7px;cursor:pointer;background:#fff;position:relative;}
  .month-cell.other{opacity:.35;}
  .month-cell.today{border-color:var(--margin);border-width:2px;}
  .month-cell.holiday{background:#eef2e4;}
  .month-cell .mc-date{font-size:12px;font-weight:700;}
  .month-cell .mc-line{font-size:10.5px;margin-top:3px;display:flex;align-items:center;gap:3px;}
  .month-cell .mc-line.petya{color:var(--petya);}
  .month-cell .mc-line.fedya{color:var(--fedya);}
  .month-cell .mc-flags{position:absolute;top:4px;right:5px;font-size:11px;display:flex;gap:2px;}

  /* homework tab */
  .filters{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .hw-list{display:flex;flex-direction:column;gap:8px;}
  .hw-item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow);}
  .hw-item.overdue{border-left:4px solid var(--warn);}
  .hw-item.done{opacity:.6;}
  .hw-check{width:20px;height:20px;flex:none;margin-top:2px;cursor:pointer;accent-color:var(--done);}
  .hw-main{flex:1;cursor:pointer;}
  .hw-top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:3px;}
  .kid-tag{font-weight:700;padding:1px 8px;border-radius:999px;font-size:11.5px;}
  .hw-subject{font-weight:700;color:var(--ink);}
  .hw-text{font-size:13.5px;white-space:pre-wrap;}
  .hw-text.done-text{text-decoration:line-through;}
  .empty-state{color:var(--ink-soft);font-style:italic;padding:30px 10px;text-align:center;}

  /* reminders / olympiads tab */
  .section-title{font-size:18px;font-weight:700;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .reminder-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-soft);}
  .field input, .field select{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;background:#fff;color:var(--ink);}
  .field input[type=text]{min-width:220px;}
  .btn{font-family:'PT Sans';font-size:13.5px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);}
  .btn.secondary{background:transparent;border:1px solid var(--paper-line);color:var(--ink);}
  .btn.danger{background:var(--warn);color:#fff;}
  .btn.gold{background:var(--gold);color:#fff;}

  .reminder-list{display:flex;flex-direction:column;gap:8px;}
  .reminder-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);}
  .reminder-item.past{opacity:.5;}
  .reminder-item.olympiad{border-left:4px solid var(--gold);}
  .reminder-date{font-family:'PT Serif',serif;font-weight:700;font-size:14px;width:110px;flex:none;}
  .reminder-item .rtext{flex:1;font-size:13.5px;}
  .reminder-item .rdel{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:2px 6px;}
  .flag-icon{color:var(--margin);}
  .countdown{font-size:11.5px;color:var(--gold);font-weight:700;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(38,49,61,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--card);border-radius:14px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 2px;font-size:19px;}
  .modal .m-sub{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}
  .modal label.m-label{font-size:12px;color:var(--ink-soft);display:block;margin:10px 0 4px;}
  .modal input[type=text].m-subject{width:100%;font-family:inherit;font-size:15px;font-weight:700;padding:9px 10px;border:1px solid var(--paper-line);border-radius:8px;color:var(--ink);}
  .modal textarea{width:100%;min-height:80px;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--paper-line);border-radius:8px;resize:vertical;color:var(--ink);}
  .modal .m-check{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:14px;}
  .modal .m-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px;}
  .modal .m-actions .right{display:flex;gap:8px;}

  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-style:italic;}

  /* print */
  #print-area{display:none;}
  #print-area{font-family:'PT Sans', Arial, sans-serif; color:#1a1a1a;}
  #print-area h1{font-size:21px;margin:0 0 4px;font-family:'PT Serif',Georgia,serif;border-bottom:2px solid #333;padding-bottom:7px;}
  #print-area .p-sub{font-size:11.5px;color:#555;margin:6px 0 4px;}
  #print-area .p-legend{font-size:10.5px;color:#666;margin-bottom:12px;}
  #print-area table{width:100%;border-collapse:collapse;margin-bottom:6px;table-layout:fixed;}
  #print-area th,#print-area td{border:1px solid #999;padding:4px 6px;font-size:11.5px;text-align:left;vertical-align:top;word-wrap:break-word;}
  #print-area th{background:#f0ede2;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:'PT Serif',serif;}
  #print-area .p-banner{font-size:10.5px;margin:2px 0 5px;}
  #print-area .p-daytitle{font-weight:700;font-size:12px;margin:0 0 3px;font-family:'PT Serif',serif;}
  /* week: one outer table, 5 day-cells, no border on the wrapper itself */
  #print-area table.p-week-outer{table-layout:fixed;}
  #print-area table.p-week-outer > tbody > tr > td{border:none;padding:0 3px;vertical-align:top;width:14.28%;}
  #print-area table.p-week-outer table{margin-bottom:0;}

  @media print{
    @page{ size: landscape; margin: 12mm; }
    body > *:not(#print-area){display:none !important;}
    body{background:none;padding:0;margin:0;}
    body::before{display:none;}
    #print-area{display:block !important;}
    #print-area table, #print-area tr{page-break-inside:avoid;}
  }

  @media (max-width:820px){
    .week-daycard{flex:0 0 200px;min-width:200px;}
  }
  @media (max-width:640px){
    body{padding-left:16px;}
    body::before{left:12px;}
    header.top h1{font-size:21px;}
    .day-table td.time{width:64px;}
  }
</style>
</head>

<div class="wrap" id="app">
  <div class="loading">Загрузка дневника…</div>
</div>
<div id="print-area"></div>

6-11-16","2026-11-23","Каникулы"],["2026-12-28","2027-01-11","Каникулы"],["2027-02-22","2027-03-01","Каникулы"],["2027-04-05","2027-04-12","Каникулы"]]}}</script>
<script>
(function(){
  "use strict";
  const RAW = JSON.parse(document.getElementById('schedule-data').textContent);
  const KIDS = [
    {id:'petya', name:'Петя', initial:'П', hex:'#2e5a88', soft:'#e4edf6'},
    {id:'fedya', name:'Федя', initial:'Ф', hex:'#3f7a4c', soft:'#e8f2e9'}
  ];
  const OLYMPIAD_LEAD_DAYS = 14;

  // ---------- index data ----------
  const lessonsByKidDate = {petya:{}, fedya:{}};
  const alldayByKid = {petya:[], fedya:[]};
  KIDS.forEach(k=>{
    RAW[k.id].lessons.forEach(([date,start,end,subject])=>{
      (lessonsByKidDate[k.id][date] = lessonsByKidDate[k.id][date] || []).push({start,end,subject});
    });
    RAW[k.id].allday.forEach(([start,end,summary])=>{
      alldayByKid[k.id].push({start,end,summary});
    });
  });

  // ---------- state ----------
  let state = {tab:'schedule', view:'week', date: startOfDay(new Date())};
  let homeworkData = {};
  let remindersData = []; // {id,type:'reminder'|'olympiad', date, kid:'both'|'petya'|'fedya', text}
  let overridesData = {}; // key -> {subject}  (a single date only)
  let recurringOverridesData = []; // {id, kid, weekday(0-6), start, subject, fromDate} — applies from fromDate onward, every week
  let vacationsData = []; // {id, start, end (inclusive), kid:'both'|'petya'|'fedya', text}
  let customLessonsData = []; // {id, kid, date, start, end, subject}
  let storageReady = false;

  // ---------- helpers ----------
  function startOfDay(d){const n=new Date(d);n.setHours(0,0,0,0);return n;}
  function pad2(n){return String(n).padStart(2,'0');}
  function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
  function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
  function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}
  function mondayOf(d){const r=new Date(d);const day=r.getDay();const diff=(day===0?-6:1-day);r.setDate(r.getDate()+diff);return r;}
  function daysBetween(a,b){return Math.round((startOfDay(new Date(b)) - startOfDay(new Date(a)))/86400000);}
  const DOW = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const DOW_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  function keyOf(kid,date,start){return kid+'|'+date+'|'+start;}
  function customLessonsFor(kid,date){
    return customLessonsData.filter(c=>c.kid===kid && c.date===date);
  }
  function findCustomLesson(kid,date,start){
    return customLessonsData.find(c=>c.kid===kid && c.date===date && c.start===start);
  }
  function origSubject(kid,date,start){
    const l = (lessonsByKidDate[kid][date]||[]).find(x=>x.start===start);
    return l ? l.subject : null;
  }
  function dowOf(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y,m-1,d).getDay();
  }
  function recurringOverrideFor(kid,dateStr,start){
    const dow = dowOf(dateStr);
    const candidates = recurringOverridesData.filter(r=> r.kid===kid && r.weekday===dow && r.start===start && r.fromDate<=dateStr);
    if(candidates.length===0) return null;
    candidates.sort((a,b)=> b.fromDate.localeCompare(a.fromDate));
    return candidates[0];
  }
  function resolvedSubject(kid,date,start){
    const c = findCustomLesson(kid,date,start);
    if(c) return c.subject;
    const ov = overridesData[keyOf(kid,date,start)];
    if(ov && ov.subject) return ov.subject;
    const rec = recurringOverrideFor(kid,date,start);
    if(rec) return rec.subject;
    return origSubject(kid,date,start) || '';
  }
  function isRealHolidaySummary(s){ return /каникул/i.test(s||''); }
  function icsHolidayFor(kid, dateStr){
    return alldayByKid[kid].find(a=> isRealHolidaySummary(a.summary) && dateStr>=a.start && dateStr<a.end);
  }
  function icsInfoEventsFor(kid, dateStr){
    return alldayByKid[kid].filter(a=> !isRealHolidaySummary(a.summary) && dateStr>=a.start && dateStr<a.end);
  }
  function customVacationFor(kid, dateStr){
    const v = vacationsData.find(v=> (v.kid==='both'||v.kid===kid) && dateStr>=v.start && dateStr<=v.end);
    return v ? {summary: v.text || 'Каникулы'} : null;
  }
  function isInHoliday(kid, dateStr){
    return icsHolidayFor(kid,dateStr) || customVacationFor(kid,dateStr);
  }
  function remindersFor(kid, dateStr, type){
    return remindersData.filter(r=> r.date===dateStr && (type?r.type===type:true) && (r.kid==='both'||r.kid===kid));
  }
  function upcomingOlympiads(){
    const todayStr = iso(startOfDay(new Date()));
    return remindersData
      .filter(r=>r.type==='olympiad' && r.date>=todayStr && daysBetween(todayStr,r.date)<=OLYMPIAD_LEAD_DAYS)
      .sort((a,b)=>a.date.localeCompare(b.date));
  }
  function dayHasPendingHw(kid, dateStr){
    const lessons = (lessonsByKidDate[kid][dateStr]||[]).concat(customLessonsFor(kid,dateStr));
    return lessons.some(l=>{
      const hw = homeworkData[keyOf(kid,dateStr,l.start)];
      return hw && hw.text && !hw.done;
    });
  }

  function dayRows(dateStr){
    const p = (lessonsByKidDate.petya[dateStr]||[]).concat(customLessonsFor('petya',dateStr));
    const f = (lessonsByKidDate.fedya[dateStr]||[]).concat(customLessonsFor('fedya',dateStr));
    const times = Array.from(new Set([...p.map(l=>l.start), ...f.map(l=>l.start)])).sort();
    return times.map(t=>({
      time:t,
      petya: p.find(l=>l.start===t)||null,
      fedya: f.find(l=>l.start===t)||null
    }));
  }

  // ---------- storage (Supabase) ----------
  const SUPABASE_URL = 'https://kwldvtadmnbkifqtggnb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3bGR2dGFkbW5ia2lmcXRnZ25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDIxNjksImV4cCI6MjEwNDA3ODE2OX0.O3rYcWt_D-I2NfzChyswpnRaUZWFdhLmFp0G12KqbOU';

  const sb = (window.supabase && typeof window.supabase.createClient === 'function')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;
  let storageBackend = sb ? 'supabase' : 'local';

  async function loadStorage(){
    try {
      if (!sb) throw new Error('Supabase клиент недоступен');

      const { data, error } = await sb
        .from('app_state')
        .select('data')
        .eq('key', 'diary_state')
        .single();

      if (error && error.code !== 'PGRST116') {
        console.error('Ошибка Supabase:', error);
      }

      if (data && data.data) {
        const parsed = data.data;
        homeworkData = parsed.homework || {};
        overridesData = parsed.overrides || {};
        remindersData = parsed.reminders || [];
        vacationsData = parsed.vacations || [];
        customLessonsData = parsed.customLessons || [];
        recurringOverridesData = parsed.recurringOverrides || [];
      } else {
        const local = localStorage.getItem('diary:diary-data');
        if (local) {
          const parsed = JSON.parse(local);
          homeworkData = parsed.homework || {};
          overridesData = parsed.overrides || {};
          remindersData = parsed.reminders || [];
          vacationsData = parsed.vacations || [];
          customLessonsData = parsed.customLessons || [];
          recurringOverridesData = parsed.recurringOverrides || [];
          await persistAll();
        }
      }
    } catch(e) {
      console.warn('Работаем в режиме offline/localStorage:', e.message);
      storageBackend = 'local';
      try {
        const local = localStorage.getItem('diary:diary-data');
        if (local) {
          const parsed = JSON.parse(local);
          homeworkData = parsed.homework || {};
          overridesData = parsed.overrides || {};
          remindersData = parsed.reminders || [];
          vacationsData = parsed.vacations || [];
          customLessonsData = parsed.customLessons || [];
          recurringOverridesData = parsed.recurringOverrides || [];
        }
      } catch(err){}
    }
    storageReady = true;
    render();
  }

  let saveInFlight = null;
  let saveFailed = false;

  async function persistAll(){
    const payload = {
      homework: homeworkData,
      overrides: overridesData,
      reminders: remindersData,
      vacations: vacationsData,
      customLessons: customLessonsData,
      recurringOverrides: recurringOverridesData
    };

    try {
      localStorage.setItem('diary:diary-data', JSON.stringify(payload));
    } catch(e) {}

    if (saveInFlight) await saveInFlight;
    saveInFlight = (async ()=>{
      try {
        if (!sb) throw new Error('Supabase клиент недоступен');
        const { error } = await sb
          .from('app_state')
          .upsert({
            key: 'diary_state',
            data: payload,
            updated_at: new Date().toISOString()
          });

        if (error) throw error;
        saveFailed = false;
        storageBackend = 'supabase';
      } catch(e) {
        console.error('Ошибка сохранения в Supabase:', e);
        storageBackend = 'local';
        if (!saveFailed) {
          saveFailed = true;
          alert('Не удалось сохранить изменения в облаке Supabase. Изменения сохранены только в этом браузере.');
        }
      }
    })();
    await saveInFlight;
    saveInFlight = null;
  }

  // ---------- rendering ----------
  const app = document.getElementById('app');

  function render(){
    if(!storageReady){ app.innerHTML = '<div class="loading">Загрузка дневника…</div>'; return; }
    let html = renderHeader() + renderTabs();
    if(state.tab==='schedule') html += renderScheduleTab();
    else if(state.tab==='homework') html += renderHomeworkTab();
    else html += renderRemindersTab();
    app.innerHTML = html;
    attachHandlers();
    if(modalState) renderModal();
  }

  function renderHeader(){
    const note = storageBackend === 'supabase'
      ? ' · синхронизация с Supabase активна'
      : ' · сохраняется только в этом браузере';
    return `<header class="top">
      <div><h1>Дневник Пети и Феди</h1><div class="subtitle">Расписание, домашние задания и напоминания${note}</div></div>
    </header>`;
  }

  function renderTabs(){
    const tabs = [['schedule','Расписание'],['homework','Домашние задания'],['reminders','Напоминания и олимпиады']];
    return `<nav class="tabs">${tabs.map(([id,label])=>
      `<button data-tab="${id}" class="${state.tab===id?'active':''}">${label}</button>`).join('')}</nav>`;
  }

  function legendHtml(){
    return `<div class="legend">
      <span class="litem"><span class="kid-badge petya">П</span> Петя</span>
      <span class="litem"><span class="kid-badge fedya">Ф</span> Федя</span>
      <span class="litem">📝 задано ДЗ</span>
      <span class="litem">✅ ДЗ сделано</span>
      <span class="litem">🚩 напоминание</span>
      <span class="litem">🏆 олимпиада</span>
      <span class="litem">🏖 каникулы</span>
      <span class="litem" style="color:var(--ink-soft);">клик по уроку — изменить предмет / задать ДЗ</span>
    </div>`;
  }

  function olympiadBannerHtml(){
    const list = upcomingOlympiads();
    if(list.length===0) return '';
    const todayStr = iso(startOfDay(new Date()));
    return `<div class="olympiad-banner">${list.map(o=>{
      const kid = KIDS.find(k=>k.id===o.kid);
      const d = daysBetween(todayStr,o.date);
      const when = d===0?'сегодня':d===1?'завтра':'через '+d+' '+dayWord(d);
      return `<div class="ob-row">🏆 <b>${escapeHtml(o.text)}</b> — ${kid?kid.name:''}, ${when}</div>`;
    }).join('')}</div>`;
  }

  function dayWord(n){
    const n10=n%10, n100=n%100;
    if(n100>=11&&n100<=14) return 'дней';
    if(n10===1) return 'день';
    if(n10>=2&&n10<=4) return 'дня';
    return 'дней';
  }

  // ---- schedule tab ----
  function renderScheduleTab(){
    let out = `<div class="toolbar">
      <div class="seg">
        <button data-view="day" class="${state.view==='day'?'active':''}">День</button>
        <button data-view="week" class="${state.view==='week'?'active':''}">Неделя</button>
        <button data-view="month" class="${state.view==='month'?'active':''}">Месяц</button>
      </div>
      <div class="navbtns">
        <button data-nav="prev">‹</button>
        <button class="today" data-nav="today">Сегодня</button>
        <button data-nav="next">›</button>
      </div>
      <div class="range-label">${rangeLabel()}</div>
      <div class="spacer"></div>
      <button class="btn secondary" id="print-schedule">🖨 Печать</button>
    </div>`;
    out += legendHtml();
    out += olympiadBannerHtml();
    if(state.view==='day') out += renderDayView();
    else if(state.view==='week') out += renderWeekView();
    else out += renderMonthView();
    return out;
  }

  function rangeLabel(){
    if(state.view==='day'){
      return DOW_FULL[state.date.getDay()]+', '+state.date.getDate()+' '+MONTHS_GEN[state.date.getMonth()]+' '+state.date.getFullYear();
    }
    if(state.view==='week'){
      const mon = mondayOf(state.date), fri = addDays(mon,4);
      const sameMonth = mon.getMonth()===fri.getMonth();
      return mon.getDate()+(sameMonth?'':' '+MONTHS_GEN[mon.getMonth()])+' – '+fri.getDate()+' '+MONTHS_GEN[fri.getMonth()]+' '+fri.getFullYear();
    }
    return MONTHS[state.date.getMonth()]+' '+state.date.getFullYear();
  }

  function dayBannersHtml(dateStr){
    let out='';
    const holP = isInHoliday('petya',dateStr), holF = isInHoliday('fedya',dateStr);
    if(holP) out += `<div class="banner holiday">🏖 Петя — ${escapeHtml(holP.summary)}</div>`;
    if(holF) out += `<div class="banner holiday">🏖 Федя — ${escapeHtml(holF.summary)}</div>`;
    icsInfoEventsFor('petya',dateStr).forEach(a=> out += `<div class="banner">📋 Петя — ${escapeHtml(a.summary)}</div>`);
    icsInfoEventsFor('fedya',dateStr).forEach(a=> out += `<div class="banner">📋 Федя — ${escapeHtml(a.summary)}</div>`);
    remindersData.filter(r=>r.date===dateStr && r.type!=='olympiad').forEach(r=>{
      const kidLabel = r.kid==='both'?'обоим':(KIDS.find(k=>k.id===r.kid)||{}).name;
      out += `<div class="banner">🚩 ${escapeHtml(r.text)} <span style="opacity:.7">(${kidLabel})</span></div>`;
    });
    remindersData.filter(r=>r.date===dateStr && r.type==='olympiad').forEach(r=>{
      const kid = KIDS.find(k=>k.id===r.kid);
      out += `<div class="banner olympiad">🏆 ${escapeHtml(r.text)} — ${kid?kid.name:''}</div>`;
    });
    return out;
  }

  function dayBannersHtmlPlain(dateStr){
    let parts = [];
    const holP = isInHoliday('petya',dateStr), holF = isInHoliday('fedya',dateStr);
    if(holP) parts.push('🏖 Петя — '+holP.summary);
    if(holF) parts.push('🏖 Федя — '+holF.summary);
    icsInfoEventsFor('petya',dateStr).forEach(a=> parts.push('📋 Петя — '+a.summary));
    icsInfoEventsFor('fedya',dateStr).forEach(a=> parts.push('📋 Федя — '+a.summary));
    remindersData.filter(r=>r.date===dateStr && r.type!=='olympiad').forEach(r=>{
      const kidLabel = r.kid==='both'?'обоим':(KIDS.find(k=>k.id===r.kid)||{}).name;
      parts.push('🚩 '+r.text+' ('+kidLabel+')');
    });
    remindersData.filter(r=>r.date===dateStr && r.type==='olympiad').forEach(r=>{
      const kid = KIDS.find(k=>k.id===r.kid);
      parts.push('🏆 '+r.text+' — '+(kid?kid.name:''));
    });
    return parts.map(escapeHtml).join(' · ');
  }

  function lessonCellHtml(kid, dateStr, lesson){
    if(!lesson) return `<td class="cell-empty">—</td>`;
    const subj = resolvedSubject(kid, dateStr, lesson.start);
    const hw = homeworkData[keyOf(kid,dateStr,lesson.start)];
    const flag = hw && hw.text ? (hw.done?'✅':'📝') : '';
    return `<td>
      <div class="cell-lesson ${kid}" data-lesson="${kid}|${dateStr}|${lesson.start}|${lesson.end}">
        <span class="cell-subject">${escapeHtml(subj)}</span>
        ${flag?`<span class="cell-hw">${flag}</span>`:''}
      </div>
    </td>`;
  }

  function renderDayView(){
    const dateStr = iso(state.date);
    const rows = dayRows(dateStr);
    let body = dayBannersHtml(dateStr);
    if(rows.length===0){
      body += `<div class="empty-state">Уроков нет</div>`;
    } else {
      body += `<table class="day-table"><thead><tr>
        <th>Время</th><th class="col-petya">Петя</th><th class="col-fedya">Федя</th>
      </tr></thead><tbody>${rows.map(r=>{
        const end = (r.petya&&r.petya.end) || (r.fedya&&r.fedya.end) || '';
        return `<tr><td class="time">${r.time}${end?'–'+end:''}</td>
          ${lessonCellHtml('petya',dateStr,r.petya)}
          ${lessonCellHtml('fedya',dateStr,r.fedya)}
        </tr>`;
      }).join('')}</tbody></table>`;
    }
    body += `<button class="btn secondary" style="margin-top:10px;" data-addlesson="${dateStr}">+ Добавить занятие</button>`;
    return `<div class="day-card">${body}</div>`;

  function renderWeekView(){
    const mon = mondayOf(state.date);
    const days = [0,1,2,3,4,5,6].map(i=>addDays(mon,i));
    const todayStr = iso(startOfDay(new Date()));
    return `<div class="week-row">${days.map(d=>{
      const dateStr = iso(d);
      const rows = dayRows(dateStr);
      const holP = isInHoliday('petya',dateStr), holF = isInHoliday('fedya',dateStr);

      let inner = '';
      if(holP||holF) inner += `<div class="wd-flags">🏖 каникулы</div>`;
      rems.forEach(r=>{
        const icon = r.type==='olympiad'?'🏆':'🚩';
        inner += `<div class="wd-flags">${icon} ${escapeHtml(r.text)}</div>`;
      });
      if(rows.length===0){
        inner += `<div class="wd-period"><span class="wd-cell empty">нет уроков</span></div>`;
      } else {
        inner += rows.map(r=>{
          const pSubj = r.petya ? resolvedSubject('petya',dateStr,r.petya.start) : null;
          const fSubj = r.fedya ? resolvedSubject('fedya',dateStr,r.fedya.start) : null;
          const pHw = r.petya && homeworkData[keyOf('petya',dateStr,r.petya.start)];

          const pFlag = pHw&&pHw.text?(pHw.done?' ✅':' 📝'):'';

          const pCell = r.petya
            ? `<span class="wd-cell petya" data-lesson="petya|${dateStr}|${r.petya.start}|${r.petya.end}">${escapeHtml(pSubj)}${pFlag}</span>`
            : `<span class="wd-cell empty">—</span>`;
          const fCell = r.fedya

  function renderMonthView(){
    const first = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
    const gridStart = mondayOf(first);
    const todayStr = iso(startOfDay(new Date()));
    const cells = [];
    for(let i=0;i<42;i++) cells.push(addDays(gridStart,i));
    while(cells.length>35 && cells[cells.length-7].getMonth()!==state.date.getMonth()){
      cells.splice(cells.length-7,7);
    }
    const dow = DOW.slice(1).concat(DOW[0]).map(d=>`<div class="month-dow">${d}</div>`).join('');
    const body = cells.map(d=>{
      const dateStr = iso(d);
      const inMonth = d.getMonth()===state.date.getMonth();
      const pCount = (lessonsByKidDate.petya[dateStr]||[]).length + customLessonsFor('petya',dateStr).length;
      const fCount = (lessonsByKidDate.fedya[dateStr]||[]).length + customLessonsFor('fedya',dateStr).length;
      const hol = isInHoliday('petya',dateStr) || isInHoliday('fedya',dateStr);
      const rems = remindersData.filter(r=>r.date===dateStr);
      const olymp = rems.some(r=>r.type==='olympiad');
      const remind = rems.some(r=>r.type!=='olympiad');
      const pendP = dayHasPendingHw('petya',dateStr), pendF = dayHasPendingHw('fedya',dateStr);
      let cls='month-cell';
      if(!inMonth) cls+=' other';
      if(dateStr===todayStr) cls+=' today';
      if(hol) cls+=' holiday';
      return `<div class="${cls}" data-day="${dateStr}">
        <div class="mc-flags">${olymp?'🏆':''}${remind?'🚩':''}</div>
        <div class="mc-date">${d.getDate()}</div>
        ${pCount?`<div class="mc-line petya"><span class="kid-badge petya" style="width:13px;height:13px;font-size:8px;">П</span>${pCount}${pendP?' 📝':''}</div>`:''}
        ${fCount?`<div class="mc-line fedya"><span class="kid-badge fedya" style="width:13px;height:13px;font-size:8px;">Ф</span>${fCount}${pendF?' 📝':''}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="day-card"><div class="month-grid">${dow}${body}</div></div>`;
  }

      return `<div class="hw-item ${overdue?'overdue':''} ${e.done?'done':''}">

  function collectHomework(){
    let entries = [];
    Object.keys(homeworkData).forEach(key=>{
      const hw = homeworkData[key];
      if(!hw || !hw.text) return;
      const [kid,date,start] = key.split('|');
      entries.push({kid,date,start,text:hw.text,done:!!hw.done,subject:resolvedSubject(kid,date,start)});
    });
    return entries;
  }

  // ---- modal (edit subject + homework) ----
  let modalState = null; // {kid,date,start,end,isNew}

  function renderModal(){
    const {isNew} = modalState;
    if(isNew) return renderNewLessonModal();
    const {kid,date,start,end} = modalState;
    const kidObj = KIDS.find(k=>k.id===kid);

    const hw = homeworkData[key] || {text:'',done:false};
    const custom = findCustomLesson(kid,date,start);
    const subj = resolvedSubject(kid,date,start);
    const [y,m,d] = date.split('-');
    const dateLabel = d+' '+MONTHS_GEN[parseInt(m,10)-1]+' '+y;
    const div = document.createElement('div');
    div.className = 'modal-backdrop';
    div.id = 'modal-backdrop';
    div.innerHTML = `<div class="modal">
      <h3 style="color:${kidObj.hex}">${kidObj.name}${custom?' · доп. занятие':''}</h3>

        <input type="time" id="m-end" value="${custom.end}" max="21:00" style="flex:1;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;">
      </div>`:''}

      <label class="m-check"><input type="checkbox" id="m-done" ${hw.done?'checked':''}> Выполнено</label>
      ${(!custom)?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:10px;">Если поменяли предмет — выберите, применить изменение только к этому дню или ко всем таким же урокам начиная с этой недели.</div>`:''}
      <div class="m-actions">
        <button class="btn secondary" id="m-close">Закрыть</button>
        <div class="right">
          ${custom?`<button class="btn danger" id="m-delete-lesson">Удалить занятие</button>`:(hw.text?`<button class="btn danger" id="m-delete">Удалить ДЗ</button>`:'')}
          ${custom
            ? `<button class="btn" id="m-save">Сохранить</button>`
            : `<button class="btn secondary" id="m-save-week">Только эта неделя</button><button class="btn" id="m-save-all">На все недели вперёд</button>`}
        </div>
      </div>
    </div>`;
    document.body.appendChild(div);
    document.getElementById('m-close').onclick = closeModal;
    div.onclick = (e)=>{ if(e.target===div) closeModal(); };

    function readForm(){
      return {
        newSubject: document.getElementById('m-subject').value.trim(),
        text: document.getElementById('m-text').value.trim(),
        done: document.getElementById('m-done').checked
      };
    }
    async function saveCustom(){
      const {newSubject, text, done} = readForm();
      const newStart = document.getElementById('m-start').value || custom.start;
      const newEnd = document.getElementById('m-end').value || custom.end;
      const movedKey = keyOf(kid,date,newStart);
      custom.subject = newSubject || custom.subject;
      custom.start = newStart;
      custom.end = newEnd;
      if(movedKey!==key){
        if(homeworkData[key]) { homeworkData[movedKey]=homeworkData[key]; delete homeworkData[key]; }
      }
      if(text){ homeworkData[movedKey] = {text, done, subject:custom.subject}; }
      else { delete homeworkData[movedKey]; }
      await persistAll();
      closeModal();
      render();
    }
    async function saveIcsLesson(applyToAllWeeks){
      const {newSubject, text, done} = readForm();
      const orig = origSubject(kid,date,start) || '';
      if(applyToAllWeeks){
        recurringOverridesData = recurringOverridesData.filter(r=>!(r.kid===kid && r.weekday===dowOf(date) && r.start===start));
        if(newSubject && newSubject!==orig){
          recurringOverridesData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), kid, weekday:dowOf(date), start, subject:newSubject, fromDate:date});
        }
        delete overridesData[key];
      } else {
        if(newSubject && newSubject!==resolvedSubjectIgnoringDateOverride()){
          overridesData[key] = {subject:newSubject};
        } else if(newSubject===orig){
          delete overridesData[key];
        }
      }
      if(text){ homeworkData[key] = {text, done, subject:newSubject||orig}; }
      else { delete homeworkData[key]; }
      await persistAll();
      closeModal();
      render();
    }
    function resolvedSubjectIgnoringDateOverride(){
      const rec = recurringOverrideFor(kid,date,start);
      return rec ? rec.subject : (origSubject(kid,date,start)||'');
    }

    if(custom){
      document.getElementById('m-save').onclick = saveCustom;
    } else {
      document.getElementById('m-save-week').onclick = ()=>saveIcsLesson(false);
      document.getElementById('m-save-all').onclick = ()=>saveIcsLesson(true);
    }
    const delBtn = document.getElementById('m-delete');
    if(delBtn) delBtn.onclick = async ()=>{
      delete homeworkData[key];
      await persistAll();
      closeModal();
      render();
    };
    const delLessonBtn = document.getElementById('m-delete-lesson');
    if(delLessonBtn) delLessonBtn.onclick = async ()=>{
      customLessonsData = customLessonsData.filter(c=>c.id!==custom.id);
      delete homeworkData[key];
      await persistAll();
      closeModal();
      render();
    };
  }

  function renderNewLessonModal(){
    const {kid, date} = modalState;
    const div = document.createElement('div');
    div.className = 'modal-backdrop';
    div.id = 'modal-backdrop';
    div.innerHTML = `<div class="modal">
      <h3>Добавить занятие</h3>
      <div class="m-sub">Дополнительные занятия, кружки, репетиторы и т.п.</div>
      <label class="m-label">Кому</label>
      <select id="m-kid" style="width:100%;padding:8px 9px;border:1px solid var(--paper-line);border-radius:7px;font-family:inherit;font-size:14px;">
        ${KIDS.map(k=>`<option value="${k.id}" ${k.id===kid?'selected':''}>${k.name}</option>`).join('')}
      </select>
      <label class="m-label">Дата</label>
      <input type="date" id="m-date" value="${date}" style="width:100%;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;">
      <label class="m-label">Время</label>
      <div style="display:flex;gap:8px;">
        <input type="time" id="m-start" value="16:00" style="flex:1;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;">
        <input type="time" id="m-end" value="17:00" max="21:00" style="flex:1;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;">
      </div>
      <label class="m-label">Название</label>
      <input type="text" id="m-subject" class="m-subject" placeholder="Например: Английский с репетитором" value="">
      <label class="m-label">Домашнее задание (необязательно)</label>
      <textarea id="m-text" placeholder="Домашнее задание…"></textarea>
      <div class="m-actions">
        <button class="btn secondary" id="m-close">Отмена</button>
        <div class="right"><button class="btn" id="m-save">Добавить</button></div>
      </div>
    </div>`;
    document.body.appendChild(div);
    document.getElementById('m-close').onclick = closeModal;
    div.onclick = (e)=>{ if(e.target===div) closeModal(); };
    document.getElementById('m-save').onclick = async ()=>{
      const newKid = document.getElementById('m-kid').value;
      const newDate = document.getElementById('m-date').value;
      const start = document.getElementById('m-start').value;
      const end = document.getElementById('m-end').value;
      const subject = document.getElementById('m-subject').value.trim();
      const text = document.getElementById('m-text').value.trim();
      if(!newDate || !start || !subject){ alert('Укажите хотя бы дату, время начала и название.'); return; }
      const id = Date.now()+'-'+Math.random().toString(36).slice(2,7);
      customLessonsData.push({id, kid:newKid, date:newDate, start, end: end||start, subject});
      if(text){ homeworkData[keyOf(newKid,newDate,start)] = {text, done:false, subject}; }
      await persistAll();
      closeModal();
      render();
    };
  }

  function closeModal(){
    modalState = null;
    const b = document.getElementById('modal-backdrop');
    if(b) b.remove();
  }

  // ---- utils ----
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escAttr(s){ return escapeHtml(s); }

  // ---------- print ----------
  function doPrint(html, title){
    const area = document.getElementById('print-area');
    area.innerHTML = html;
    const oldTitle = document.title;
    document.title = title;
    window.print();
    setTimeout(()=>{ document.title = oldTitle; }, 500);
  }

  function printSchedule(){
    const genDate = new Date().toLocaleDateString('ru-RU');
    let html = `<h1>Расписание — ${escapeHtml(rangeLabel())}</h1>
      <div class="p-sub">Петя и Федя · сформировано ${genDate}</div>
      <div class="p-legend">П — Петя, Ф — Федя. 📝 задано ДЗ, ✅ ДЗ сделано, 🚩 напоминание, 🏆 олимпиада, 🏖 каникулы.</div>`;

    if(state.view==='day'){
      const dateStr = iso(state.date);
      const dayBanners = dayBannersHtmlPlain(dateStr);
      if(dayBanners) html += `<div class="p-banner">${dayBanners}</div>`;
      const rows = dayRows(dateStr);
      html += `<table><thead><tr><th>Время</th><th>Петя</th><th>Федя</th></tr></thead><tbody>${rows.map(r=>{
        const end=(r.petya&&r.petya.end)||(r.fedya&&r.fedya.end)||'';
        const pC = r.petya ? printCellText('petya',dateStr,r.petya) : '—';
        const fC = r.fedya ? printCellText('fedya',dateStr,r.fedya) : '—';
        return `<tr><td>${r.time}${end?'–'+end:''}</td><td>${pC}</td><td>${fC}</td></tr>`;
      }).join('')}</tbody></table>`;
    } else if(state.view==='week'){
      const mon = mondayOf(state.date);
      const days = [0,1,2,3,4,5,6].map(i=>addDays(mon,i));
      let weekNotes = [];
      days.forEach(d=>{
        const dateStr = iso(d);
        const t = dayBannersHtmlPlain(dateStr);
        if(t) weekNotes.push(`<b>${d.getDate()} ${MONTHS_GEN[d.getMonth()]}:</b> ${t}`);
      });
      if(weekNotes.length){
        html += `<div class="p-banner"><b>На этой неделе:</b><br>${weekNotes.join('<br>')}</div>`;
      }
      html += `<table class="p-week-outer"><tbody><tr>${days.map(d=>{
        const dateStr = iso(d);
        const rows = dayRows(dateStr);
        let block = `<div class="p-daytitle">${DOW_FULL[d.getDay()]}<br>${d.getDate()} ${MONTHS_GEN[d.getMonth()]}</div>`;
        if(rows.length===0){
          block += `<div class="p-banner">—</div>`;
        } else {
          block += `<table><thead><tr><th>Вр</th><th>П</th><th>Ф</th></tr></thead><tbody>${rows.map(r=>{
            const pC = r.petya ? printCellText('petya',dateStr,r.petya) : '—';
            const fC = r.fedya ? printCellText('fedya',dateStr,r.fedya) : '—';
            return `<tr><td>${r.time}</td><td>${pC}</td><td>${fC}</td></tr>`;
          }).join('')}</tbody></table>`;
        }
        return `<td>${block}</td>`;
      }).join('')}</tr></tbody></table>`;
    } else {
      const first = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
      const gridStart = mondayOf(first);
      const cells = [];
      for(let i=0;i<42;i++) cells.push(addDays(gridStart,i));
      while(cells.length>35 && cells[cells.length-7].getMonth()!==state.date.getMonth()){ cells.splice(cells.length-7,7); }
      html += `<table><thead><tr>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>`;
      for(let w=0; w<cells.length/7; w++){
        html += '<tr>';
        for(let i=0;i<7;i++){
          const d = cells[w*7+i];
          const dateStr = iso(d);
          const inMonth = d.getMonth()===state.date.getMonth();
          const pCount=(lessonsByKidDate.petya[dateStr]||[]).length + customLessonsFor('petya',dateStr).length;
          const fCount=(lessonsByKidDate.fedya[dateStr]||[]).length + customLessonsFor('fedya',dateStr).length;
          const rems = remindersData.filter(r=>r.date===dateStr);
          const flags = rems.map(r=>r.type==='olympiad'?'🏆':'🚩').join('');
          html += `<td style="${inMonth?'':'color:#bbb;'}"><b>${d.getDate()}</b> ${flags}<br>П:${pCount} Ф:${fCount}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
    }
    doPrint(html, 'Расписание');
  }

  function printCellText(kid,dateStr,lesson){
    const subj = resolvedSubject(kid,dateStr,lesson.start);
    const hw = homeworkData[keyOf(kid,dateStr,lesson.start)];
    const flag = hw&&hw.text ? (hw.done?' ✅':' 📝') : '';
    return escapeHtml(subj)+flag;
  }

  function printHomework(kidId){
    const kid = KIDS.find(k=>k.id===kidId);
    const genDate = new Date().toLocaleDateString('ru-RU');
    let entries = collectHomework().filter(e=>e.kid===kidId);
    entries.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
    let html = `<h1>Домашние задания — ${kid.name}</h1>
      <div class="p-sub">сформировано ${genDate}</div>`;
    if(entries.length===0){
      html += `<p>Домашних заданий нет.</p>`;
    } else {
      html += `<table><thead><tr><th>Дата</th><th>Предмет</th><th>Задание</th><th>Статус</th></tr></thead><tbody>${entries.map(e=>{
        const [y,m,d]=e.date.split('-');
        return `<tr><td>${d}.${m}.${y}</td><td>${escapeHtml(e.subject)}</td><td>${escapeHtml(e.text)}</td><td>${e.done?'выполнено':'☐'}</td></tr>`;
      }).join('')}</tbody></table>`;
    }
    doPrint(html, 'Домашние задания — '+kid.name);
  }

  // ---------- event handling ----------
  function attachHandlers(){
    app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab; render();});
    app.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view; render();});
    app.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{
      const dir = el.dataset.nav;
      if(dir==='today') state.date = startOfDay(new Date());
      else {
        const mult = dir==='prev' ? -1 : 1;
        if(state.view==='day') state.date = addDays(state.date, mult*1);
        else if(state.view==='week') state.date = addDays(state.date, mult*7);
        else state.date = addMonths(state.date, mult*1);
      }
      render();
    });
    app.querySelectorAll('[data-lesson]').forEach(el=>el.onclick=()=>{
      const [kid,date,start,end] = el.dataset.lesson.split('|');
      modalState = {kid,date,start,end,isNew:false};
      render();
    });
    app.querySelectorAll('[data-addlesson]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      modalState = {kid:'petya', date:el.dataset.addlesson, isNew:true};
      render();
    });
    app.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{
      state.view='day';
      const [y,m,d] = el.dataset.day.split('-').map(Number);
      state.date = new Date(y,m-1,d);
      render();
    });
    app.querySelectorAll('[data-hwkid]').forEach(el=>el.onclick=()=>{hwFilterKid=el.dataset.hwkid; render();});
    app.querySelectorAll('[data-hwstatus]').forEach(el=>el.onclick=()=>{hwFilterStatus=el.dataset.hwstatus; render();});
    app.querySelectorAll('[data-hwtoggle]').forEach(el=>el.onclick=async (e)=>{
      e.stopPropagation();
      const [kid,date,start] = el.dataset.hwtoggle.split('|');
      const key = keyOf(kid,date,start);
      if(homeworkData[key]){
        homeworkData[key].done = !homeworkData[key].done;
        await persistAll();
        render();
      }
    });
    app.querySelectorAll('[data-hwedit]').forEach(el=>el.onclick=()=>{
      const [kid,date,start] = el.dataset.hwedit.split('|');
      const lesson = (lessonsByKidDate[kid][date]||[]).find(l=>l.start===start);
      modalState = {kid,date,start,end: lesson?lesson.end:''};
      render();
    });
    const remAdd = document.getElementById('rem-add');
    if(remAdd) remAdd.onclick = async ()=>{
      const date = document.getElementById('rem-date').value;
      const kid = document.getElementById('rem-kid').value;
      const text = document.getElementById('rem-text').value.trim();
      if(!date || !text) return;
      remindersData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type:'reminder', date, kid, text});
      await persistAll();
      render();
    };
    const olAdd = document.getElementById('ol-add');
    if(olAdd) olAdd.onclick = async ()=>{
      const date = document.getElementById('ol-date').value;
      const kid = document.getElementById('ol-kid').value;
      const text = document.getElementById('ol-text').value.trim();
      if(!date || !text) return;
      remindersData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type:'olympiad', date, kid, text});
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-remdel]').forEach(el=>el.onclick=async ()=>{
      remindersData = remindersData.filter(r=>r.id!==el.dataset.remdel);
      await persistAll();
      render();
    });
    const vacAdd = document.getElementById('vac-add');
    if(vacAdd) vacAdd.onclick = async ()=>{
      const start = document.getElementById('vac-start').value;
      let end = document.getElementById('vac-end').value;
      const kid = document.getElementById('vac-kid').value;
      const text = document.getElementById('vac-text').value.trim();
      if(!start) return;
      if(!end || end<start) end = start;
      vacationsData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), start, end, kid, text});
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-vacdel]').forEach(el=>el.onclick=async ()=>{
      vacationsData = vacationsData.filter(v=>v.id!==el.dataset.vacdel);
      await persistAll();
      render();
    });
    const ps = document.getElementById('print-schedule');
    if(ps) ps.onclick = printSchedule;
    const phP = document.getElementById('print-hw-petya');
    if(phP) phP.onclick = ()=>printHomework('petya');
    const phF = document.getElementById('print-hw-fedya');
    if(phF) phF.onclick = ()=>printHomework('fedya');
  }

  loadStorage();
})();
</script>
</body>
</html>
