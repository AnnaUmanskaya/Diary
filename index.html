      out += `<div class="empty-state">Предметов не найдено. Оценки собираются только из календарей «Лицей_Имя» — добавьте туда уроки на вкладке «Настройка расписания».</div>`;

      out += `<div class="table-scroll"><table class="grades-table"><thead><tr>

      </tr></thead><tbody>${subjects.map(subject=>{

          needHtml = `<span class="gs-need ok">уже 5</span>`;

            <span class="gs-add-inline" title="Добавить оценку">
              <input type="text" inputmode="numeric" maxlength="7" class="gs-add-val" placeholder="•" title="Оценка, например 5 или 5/4" id="ga-val-${es}-${gradesTri}">
              <span class="gs-add-x">×</span>

  function pluralFive(n){
    const n10 = n%10, n100 = n%100;
    if(n100>=11 && n100<=14) return 'пятёрок';
    if(n10===1) return 'пятёрку';
    if(n10>=2 && n10<=4) return 'пятёрки';
    return 'пятёрок';
  }

  // homework was saved — they no longer belong to any currently-scheduled lesson,
  // so they're kept visible here instead of silently vanishing or leaking into
  // whatever new lesson now occupies that date/time slot.
  function renderOrphanedHomeworkSection(){
    const orphaned = collectHomework().filter(e=>e.orphaned);
    if(orphaned.length===0) return '';
    orphaned.sort((a,b)=> (b.date+b.start).localeCompare(a.date+a.start));
    return `<div class="section-title" style="margin-top:26px;">Сохранённые записи вне расписания (${orphaned.length})</div>
    <div class="hw-list">${orphaned.map(e=>{
      const [y,m,d] = e.date.split('-');
      const dateLabel = d+' '+MONTHS_GEN[parseInt(m,10)-1]+' '+y;
      const owner = e.kid==='both' ? {name:'Оба', soft:'#eee', hex:'#555'} : KIDS.find(k=>k.id===e.kid);
      return `<div class="hw-item ${e.done?'done':''}" style="opacity:.8;">
        <div class="hw-main" style="cursor:default;">
          <div class="hw-top-row">
            ${owner?`<span class="kid-tag" style="background:${owner.soft};color:${owner.hex};">${escapeHtml(owner.name)}</span>`:''}

  function hwFilesPreviewHtml(files){
    const valid = (files||[]).filter(f=>!f.uploading && fileUrl(f));
    if(!valid.length) return '';
    return `<div class="m-files-list" style="margin-top:6px;" onclick="event.stopPropagation()">${valid.map(f=>{
      const isImg = f.type && f.type.startsWith('image/');
      return `<a href="${fileUrl(f)}" download="${escAttr(f.name)}" target="_blank" rel="noopener" class="m-file-chip" style="text-decoration:none;color:inherit;">
        ${isImg?`<img src="${fileUrl(f)}">`:'<span class="m-file-icon">📄</span>'}
        <span class="m-file-name">${escapeHtml(f.name)}</span>
      </a>`;
    }).join('')}</div>`;
  }

  function collectHomework(){
    let entries = [];
    Object.keys(homeworkData).forEach(key=>{
      const hw = homeworkData[key];
      if(!hwHasContent(hw)) return;
      const parts = key.split('|');
      if(parts[0]==='cal'){
        let calendarId, ruleId, date, start;
        if(parts.length>=5){
          [, calendarId, ruleId, date, start] = parts;
        } else {
          // legacy key format (pre rule-id fix) — best effort, will self-migrate to the new format on next save
          [, calendarId, date, start] = parts;
          ruleId = null;
        }
        const cal = calendarsData.find(c=>c.id===calendarId);
        const rule = ruleId
          ? calRulesData.find(r=>r.id===ruleId)
          : calRulesData.find(r=>r.calendarId===calendarId && r.start===start && calRuleMatchesDate(r,date));
        const active = !!(cal && !cal.hidden && rule && calRuleMatchesDate(rule, date));
        const kid = cal ? (cal.kid || 'both') : 'both';
        entries.push({isCal:true, calendarId, ruleId: rule?rule.id:ruleId, calName: cal?cal.name:'Календарь (удалён)', kid, date, start, text:hw.text||'', done:!!hw.done, subject: hw.subject || (rule?rule.subject:'') || 'Без предмета', files: hw.files||[], orphaned: !active});
      } else {
        const [kid,date,start] = parts;
        entries.push({kid,date,start,text:hw.text||'',done:!!hw.done,subject:resolvedSubject(kid,date,start),files:hw.files||[],orphaned:false});
      }
    });
    return entries;
  }

  // ---- olympiads tab (results: date, score, place, diploma) ----
  // Uses the same records as the reminders tab (type:'olympiad'), extended with
  // score / place / diplomas — so an olympiad added in either tab shows up in both.
  function olDateLabel(r){
    const f = s=>{ const [y,m,d]=s.split('-'); return parseInt(d,10)+' '+MONTHS_GEN[parseInt(m,10)-1]+' '+y; };
    return (r.dateEnd && r.dateEnd!==r.date) ? f(r.date)+' – '+f(r.dateEnd) : f(r.date);
  }

  function olDiplomasHtml(r){
    const files = r.diplomas || [];
    if(!files.length) return `<div style="font-size:11.5px;color:var(--ink-soft);">Диплома нет</div>`;
    return `<div class="m-files-list">${files.map(f=>{
      const url = fileUrl(f);
      const isImg = f.type && f.type.startsWith('image/');
      const preview = `${isImg?`<img src="${url}">`:'<span class="m-file-icon">📄</span>'}<span class="m-file-name" title="${escAttr(f.name)}">${escapeHtml(f.name)}</span>`;
      const body = url
        ? `<a href="${url}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:5px;min-width:0;">${preview}</a>`
        : `<span style="display:flex;align-items:center;gap:5px;min-width:0;color:var(--ink-soft);">${preview}</span>`;
      return `<div class="m-file-chip">${body}<button type="button" class="m-file-del" data-oldipdel="${r.id}|${f.id}">✕</button></div>`;
    }).join('')}</div>`;
  }

  function olCardHtml(r, todayStr){
    const kid = KIDS.find(k=>k.id===r.kid);
    const end = r.dateEnd || r.date;
    const past = end < todayStr;
    const ongoing = todayStr>=r.date && todayStr<=end;
    const dleft = daysBetween(todayStr, r.date);
    const status = ongoing ? 'идёт' : past ? 'прошла' : (dleft===0 ? 'сегодня' : 'через '+dleft+' '+dayWord(dleft));
    return `<div class="ol-card ${past?'past':''}">
      <div class="ol-head">
        ${kid?`<span class="kid-tag" style="background:${kid.soft};color:${kid.hex};">${kid.name}</span>`:`<span class="kid-tag" style="background:#eee;color:#555;">Оба</span>`}
        <div class="ol-title">🏆 ${escapeHtml(r.text)}</div>
        <span class="ol-date">📅 ${olDateLabel(r)}</span>
        <span class="countdown" ${past?'style="color:var(--ink-soft);font-weight:400;"':''}>${status}</span>
        <button class="rdel" title="Удалить олимпиаду" data-oltdel="${r.id}">✕</button>
      </div>
      <div class="ol-fields">
        <div class="field"><label>Баллы</label><input type="text" data-oltid="${r.id}" data-oltfield="score" value="${escAttr(r.score||'')}" placeholder="например: 85 из 100"></div>
        <div class="field"><label>Место</label><input type="text" data-oltid="${r.id}" data-oltfield="place" value="${escAttr(r.place||'')}" placeholder="например: 2 место"></div>
        <div class="field ol-diploma"><label>Диплом</label>
          ${olDiplomasHtml(r)}
          <label class="m-file-attach-label">📎 Прикрепить диплом<input type="file" data-oldipinput="${r.id}" multiple style="display:none;"></label>
        </div>
      </div>
    </div>`;
  }

  function renderOlympiadsTab(){
    const todayStr = iso(startOfDay(new Date()));
    const all = remindersData.filter(r=>r.type==='olympiad');
    const list = all.filter(r=> olKidFilter==='all' || r.kid===olKidFilter);
    const upcoming = list.filter(r=>(r.dateEnd||r.date)>=todayStr).sort((a,b)=>a.date.localeCompare(b.date));
    const past = list.filter(r=>(r.dateEnd||r.date)<todayStr).sort((a,b)=>b.date.localeCompare(a.date));

    <div class="reminder-form">
      <div class="field"><label>Дата</label><input type="date" id="olt-date" value="${todayStr}"></div>

      <div class="field" id="olt-end-field" style="display:none;"><label>По</label><input type="date" id="olt-end" value="${todayStr}"></div>
      <div class="field"><label>Кто участвует</label><select id="olt-kid">
        ${KIDS.map(k=>`<option value="${k.id}">${k.name}</option>`).join('')}

      <div class="field" style="flex:1 1 220px;"><label>Название олимпиады</label><input type="text" id="olt-text" placeholder="Например: Олимпиада по математике"></div>
      <div class="field"><label>Баллы (необязательно)</label><input type="text" id="olt-score" style="min-width:0;width:130px;"></div>

      <button class="btn gold" id="olt-add">Добавить</button>

      return out;

    if(upcoming.length){
      out += `<div class="section-title">Предстоящие</div><div class="reminder-list">${upcoming.map(r=>olCardHtml(r,todayStr)).join('')}</div>`;

  function normalizeUrl(u){
    u = (u||'').trim();
    if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u = 'https://'+u;
    return u;
  }

    return `<div class="reminder-item">
      <div class="rtext">

  function docFilesListHtml(d){

    return `<div class="m-files-list">${d.files.map(f=>{
      const url = fileUrl(f);
      const isImg = f.type && f.type.startsWith('image/');
      const preview = `${isImg?`<img src="${url}">`:'<span class="m-file-icon">📄</span>'}<span class="m-file-name" title="${escAttr(f.name)}">${escapeHtml(f.name)}</span>`;

        : `<span style="display:flex;align-items:center;gap:5px;min-width:0;color:var(--ink-soft);">${preview}</span>`;
      return `<div class="m-file-chip">${body}<button type="button" class="m-file-del" data-docfiledel="${d.id}|${f.id}">✕</button></div>`;
    }).join('')}</div>`;

  function wireDocFileAttach(){
    const listEl = document.getElementById('doc-files-list');
    const inputEl = document.getElementById('doc-file-input');
    if(!listEl || !inputEl) return;
    function refresh(){
      listEl.innerHTML = filesListInnerHtml(docDraft.files);
      listEl.querySelectorAll('.m-file-del').forEach(btn=>{
        btn.onclick = ()=>{
          const removed = docDraft.files.find(f=>f.id===btn.dataset.fid);
          docDraft.files = docDraft.files.filter(f=>f.id!==btn.dataset.fid);
          refresh();
          if(removed) removeFileFromStorage(removed);
        };
      });
    }
    refresh();
    inputEl.onchange = async ()=>{
      const chosen = Array.from(inputEl.files||[]);
      if(chosen.length===0) return;
      inputEl.disabled = true;
      for(const file of chosen){
        if(file.size > MAX_FILE_SIZE){ alert('Файл «'+file.name+'» слишком большой (макс. 100 МБ).'); continue; }
        const tempId = 'up-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        docDraft.files.push({id:tempId, name:file.name, type:file.type||'', size:file.size, uploading:true});
        refresh();
        try{
          const meta = await uploadFileToStorage(file);
          const idx = docDraft.files.findIndex(f=>f.id===tempId);
          if(idx>-1) docDraft.files[idx] = meta;
        } catch(err){
          const idx = docDraft.files.findIndex(f=>f.id===tempId);
          if(idx>-1) docDraft.files.splice(idx,1);
          alert('Не удалось загрузить файл «'+file.name+'»: '+(err&&err.message?err.message:'ошибка загрузки'));
        }
        refresh();
      }
      inputEl.disabled = false;
      inputEl.value = '';
    };
  }

  // ---- homework file attachments (Supabase Storage) ----
  const MAX_FILE_SIZE = 100*1024*1024; // 100MB per file
  const INLINE_FALLBACK_MAX = 8*1024*1024; // 8MB cap when no Supabase Storage is available

  function fileUrl(f){ return f.url || f.dataUrl || ''; }

  function fileAttachSectionHtml(files, kidHint){

  function filesListInnerHtml(files){
    if(!files || !files.length) return `<div style="font-size:11.5px;color:var(--ink-soft);">Файлов нет</div>`;
    return files.map(f=>{

      }

      const body = url
        ? `<a href="${url}" download="${escAttr(f.name)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:5px;min-width:0;">${preview}</a>`
        : `<span style="display:flex;align-items:center;gap:5px;min-width:0;color:var(--ink-soft);" title="Файл повреждён, удалите и загрузите заново">${preview}</span>`;
      return `<div class="m-file-chip">
        ${body}
        <button type="button" class="m-file-del" data-fid="${f.id}">✕</button>

  async function uploadFileToStorage(file){
    if(sb && storageBackend==='supabase'){
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80);
      const path = Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safeName;
      const {error} = await sb.storage.from(FILES_BUCKET).upload(path, file, {cacheControl:'3600', upsert:false});
      if(error) throw error;
      const {data} = sb.storage.from(FILES_BUCKET).getPublicUrl(path);
      return {id: Date.now()+'-'+Math.random().toString(36).slice(2,7), name:file.name, type:file.type||'', size:file.size, url:data.publicUrl, path, storage:'supabase'};
    }
    // no Supabase configured — fall back to embedding small files directly in the saved JSON
    if(file.size > INLINE_FALLBACK_MAX){
      throw new Error('Без облачного хранилища можно прикладывать файлы не больше 8 МБ.');
    }
    return await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), name:file.name, type:file.type||'', size:file.size, dataUrl:reader.result, storage:'inline'});
      reader.onerror = ()=> reject(new Error('Не удалось прочитать файл'));
      reader.readAsDataURL(file);
    });
  }

  function removeFileFromStorage(f){
    if(f && f.storage==='supabase' && f.path && sb){
      sb.storage.from(FILES_BUCKET).remove([f.path]).catch(()=>{});
    }
  }

  // permanent, independent record of every uploaded homework file — kept even after
  // the homework entry that first attached it is edited, moved, or deleted, so files
  // stay available in the Library and can be re-attached to another (e.g. rescheduled) lesson
  function registerFileInLibrary(f, meta){
    if(!f || f.uploading || !fileUrl(f)) return;
    if(fileLibraryData.some(x=>x.id===f.id)) return;
    fileLibraryData.push({
      id:f.id, name:f.name, type:f.type||'', size:f.size,
      url:f.url||null, path:f.path||null, dataUrl:f.dataUrl||null, storage:f.storage||'',
      kid: (meta&&meta.kid)||'', subject: (meta&&meta.subject)||'', calName: (meta&&meta.calName)||null,
      date: (meta&&meta.date)||'', start: (meta&&meta.start)||'', addedAt: Date.now()
    });
  }
  function registerFilesInLibrary(files, meta){
    (files||[]).forEach(f=>registerFileInLibrary(f, meta));
  }

  function dataUrlToBlob(dataUrl){
    const [header, base64] = dataUrl.split(',');
    const mimeMatch = header.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    const binary = atob(base64);
    const arr = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) arr[i] = binary.charCodeAt(i);
    return new Blob([arr], {type: mime});
  }

  function countInlineFiles(){
    let n = 0;
    Object.values(homeworkData).forEach(hw=>{
      if(hw && hw.files) hw.files.forEach(f=>{ if(f.dataUrl && !f.url) n++; });
    });
    return n;
  }

  async function migrateInlineFilesToCloud(){
    if(!(sb && storageBackend==='supabase')){
      alert('Supabase не настроен — перенос недоступен.');
      return;
    }
    const keys = Object.keys(homeworkData).filter(k=> homeworkData[k] && homeworkData[k].files && homeworkData[k].files.some(f=>f.dataUrl && !f.url));
    if(keys.length===0){ alert('Файлов для переноса не найдено.'); return; }
    if(!confirm('Перенести файлы ('+keys.length+' запис(ей) с ДЗ) в облачное хранилище? Это ускорит работу приложения. Может занять некоторое время.')) return;
    let migrated = 0, failed = 0;
    for(const key of keys){
      const hw = homeworkData[key];
      const newFiles = [];
      for(const f of hw.files){
        if(f.url || !f.dataUrl){ newFiles.push(f); continue; }
        try{
          const blob = dataUrlToBlob(f.dataUrl);
          const safeName = (f.name||'file').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80);
          const path = Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safeName;
          const {error} = await sb.storage.from(FILES_BUCKET).upload(path, blob, {cacheControl:'3600', upsert:false, contentType: f.type||undefined});
          if(error) throw error;
          const {data} = sb.storage.from(FILES_BUCKET).getPublicUrl(path);
          newFiles.push({id:f.id, name:f.name, type:f.type||'', size:f.size, url:data.publicUrl, path, storage:'supabase'});
          migrated++;
        } catch(err){
          newFiles.push(f);
          failed++;
        }
      }
      hw.files = newFiles;
    }
    await persistAll();
    render();
    alert('Готово. Перенесено файлов: '+migrated+(failed?('. Не удалось перенести: '+failed+' (оставлены как были).'):'.'));
  }

  function migrationBannerHtml(){
    const n = countInlineFiles();
    if(n===0) return '';
    return `<div class="warn-banner">⚠️ Найдено файлов (${n}), сохранённых старым способом внутри общего состояния — это может замедлять работу.
      <button class="btn secondary" id="migrate-files-btn">☁️ Перенести в облако</button>
    </div>`;
  }

  function wireFileAttach(fileState){
    const listEl = document.getElementById('m-files-list');
    const inputEl = document.getElementById('m-file-input');
    if(!listEl || !inputEl) return;
    function refresh(){
      listEl.innerHTML = filesListInnerHtml(fileState.files);
      listEl.querySelectorAll('.m-file-del').forEach(btn=>{
        btn.onclick = ()=>{
          const removed = fileState.files.find(f=>f.id===btn.dataset.fid);
          fileState.files = fileState.files.filter(f=>f.id!==btn.dataset.fid);
          refresh();
          // a file already registered in the permanent Library is only detached from
          // this homework entry (it stays available in the Library / other lessons);
          // only a brand-new upload from this same editing session (never saved anywhere
          // yet) is actually deleted from storage when removed.
          if(removed && !fileLibraryData.some(x=>x.id===removed.id)) removeFileFromStorage(removed);
        };
      });
      const libAddBtn = document.getElementById('m-lib-add');
      const libSelect = document.getElementById('m-lib-select');
      if(libAddBtn && libSelect){
        libAddBtn.onclick = ()=>{
          const id = libSelect.value;
          if(!id) return;
          const entry = fileLibraryData.find(f=>f.id===id);
          if(!entry || fileState.files.some(f=>f.id===id)) return;
          fileState.files.push({id:entry.id, name:entry.name, type:entry.type, size:entry.size, url:entry.url, path:entry.path, dataUrl:entry.dataUrl, storage:entry.storage});
          refresh();
        };
      }
    }
    refresh();
    inputEl.onchange = async ()=>{
      const chosen = Array.from(inputEl.files||[]);
      if(chosen.length===0) return;
      inputEl.disabled = true;
      const modalEl = inputEl.closest('.modal');
      const saveButtons = modalEl ? Array.from(modalEl.querySelectorAll('button[id^="m-save"]')) : [];
      saveButtons.forEach(b=>b.disabled = true);
      for(const file of chosen){
        if(file.size > MAX_FILE_SIZE){
          alert('Файл «'+file.name+'» слишком большой (макс. 100 МБ).');
          continue;
        }
        const tempId = 'up-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        fileState.files.push({id:tempId, name:file.name, type:file.type||'', size:file.size, uploading:true});
        refresh();
        try{
          const meta = await uploadFileToStorage(file);
          const idx = fileState.files.findIndex(f=>f.id===tempId);
          if(idx>-1) fileState.files[idx] = meta;
        } catch(err){
          const idx = fileState.files.findIndex(f=>f.id===tempId);
          if(idx>-1) fileState.files.splice(idx,1);
          alert('Не удалось загрузить файл «'+file.name+'»: '+(err&&err.message?err.message:'ошибка загрузки'));
        }
        refresh();
      }
      inputEl.disabled = false;
      saveButtons.forEach(b=>b.disabled = false);
      inputEl.value = '';
    };
  }

  // closes a modal and cleans up any files that were uploaded to Storage during
  // this modal session but never actually got saved (user hit "Закрыть"/cancel)
  function closeModalCleaningUpFiles(fileState, originalFiles){
    const originalIds = new Set((originalFiles||[]).map(f=>f.id));
    const orphaned = (fileState.files||[]).filter(f=> f.storage==='supabase' && !originalIds.has(f.id) && !fileLibraryData.some(x=>x.id===f.id));
    closeModal();
    orphaned.forEach(removeFileFromStorage);
  }

        date:ctx.date, start:ctx.start, src:'schedule',

      });
      addBtn.disabled = true;
      await persistAll();
      addBtn.disabled = false;
      valEl.value = '';

      lessonGradesDirty = true;

    async function saveIcsLesson(applyToAllWeeks){
      const {newSubject, text, done} = readForm();
      const orig = origSubject(kid,date,start) || '';
      if(applyToAllWeeks){
        recurringOverridesData = recurringOverridesData.filter(r=>!(r.kid===kid && r.weekday===dowOf(date) && r.start===start));
        if(newSubject && newSubject!==orig){
          recurringOverridesData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), kid, weekday:dowOf(date), start, subject:newSubject, fromDate:date});
        }
        delete overridesData[key];
      } else {
        if(newSubject && newSubject!==resolvedSubjectIgnoringDateOverride()){
          overridesData[key] = {subject:newSubject};
        } else if(newSubject===orig){
          delete overridesData[key];
        }
      }
      const cleanFiles = fileState.files.filter(f=>!f.uploading);
      registerFilesInLibrary(cleanFiles, {kid, subject:newSubject||orig, date, start});
      if(text || cleanFiles.length){ homeworkData[key] = {text, done, subject:newSubject||orig, files:cleanFiles}; }
      else { delete homeworkData[key]; }
      await persistAll();
      closeModal();
      render();
    }
    function resolvedSubjectIgnoringDateOverride(){
      const rec = recurringOverrideFor(kid,date,start);
      return rec ? rec.subject : (origSubject(kid,date,start)||'');
    }

    if(custom){
      document.getElementById('m-save').onclick = saveCustom;
    } else {
      document.getElementById('m-save-week').onclick = ()=>saveIcsLesson(false);
      document.getElementById('m-save-all').onclick = ()=>saveIcsLesson(true);
    }

    if(delBtn) delBtn.onclick = async ()=>{

      await persistAll();
      closeModal();
      render();
    };
    const delLessonBtn = document.getElementById('m-delete-lesson');
    if(delLessonBtn) delLessonBtn.onclick = async ()=>{
      if(!confirm('Удалить этот урок вместе с домашним заданием? (файлы останутся в библиотеке)')) return;
      customLessonsData = customLessonsData.filter(c=>c.id!==custom.id);
      delete homeworkData[key];
      await persistAll();
      closeModal();
      render();
    };
  }

  // ============================================================
  // Excel export of the weekly schedule template — three sheets:
  // "Расписание" (combined, colour-coded per kid), "Петя", "Федя".
  // Only PERIODIC (recurring) lessons/activities are shown — no
  // dates, no reminders/olympiads, no homework marks, no one-off
  // entries (custom one-off lessons or rules with repeat:'none').
  // ============================================================
  const EXTRA_BLOCKS = [
    {start:'16:00', end:'17:00'},
    {start:'17:00', end:'18:00'},
    {start:'18:00', end:'19:00'},
    {start:'19:00', end:'20:00'},
    {start:'20:00', end:'21:00'}
  ];
  function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
  function hexToARGB(hex){ return 'FF'+hex.replace('#','').toUpperCase(); }

  // 8-slot array (one per lyceum period) for a kid on a given date, keeping only
  // periodic sources: the standing ICS lyceum timetable, and lyceum-calendar rules
  // whose repeat is NOT 'none'. One-off custom lessons / one-off rule overrides are
  // intentionally skipped — they are not part of the recurring weekly template.
  function lyceumPeriodsForWeekdayFiltered(kid, dateStr){
    const arr = new Array(LESSON_TIMES.length).fill(null);
    (lessonsByKidDate[kid][dateStr]||[]).forEach(l=>{
      const idx = LESSON_TIMES.findIndex(p=>p.start===l.start);
      if(idx>=0) arr[idx] = {subject: resolvedSubject(kid,dateStr,l.start)};
    });
    calOccurrencesForDate(dateStr).forEach(o=>{
      if(!(o.kid===kid || o.kid==='both')) return;
      const cal = calendarsData.find(c=>c.id===o.calendarId);
      if(!isLyceumCalendarForKid(cal,kid)) return;
      const rule = calRulesData.find(r=>r.id===o.ruleId);
      if(rule && rule.repeat==='none') return;
      const idx = LESSON_TIMES.findIndex(p=>p.start===o.start);
      if(idx>=0) arr[idx] = {subject: o.subject};
    });
    return arr;
  }

  // extra ("доп.") activities for a kid on a given date, periodic sources only,
  // overlapping the 16:00–21:00 window
  function extraActivitiesForWeekdayFiltered(kid, dateStr){
    const list = [];
    calOccurrencesForDate(dateStr).forEach(o=>{
      if(!(o.kid===kid || o.kid==='both')) return;
      const cal = calendarsData.find(c=>c.id===o.calendarId);
      if(isLyceumCalendarForKid(cal,kid)) return;
      const rule = calRulesData.find(r=>r.id===o.ruleId);
      if(rule && rule.repeat==='none') return;
      list.push({start:o.start, end:o.end||o.start, subject:o.subject});
    });
    return list
      .filter(a=> a.start < '21:00' && (a.end||a.start) > '16:00')
      .sort((a,b)=> a.start.localeCompare(b.start));
  }

  // Computes the shared 16:00–21:00 row grid for the whole extra-activities section
  // of a sheet at once (across every day column and every kid column together),
  // since they all live in the same physical Excel rows. A row is only split where
  // some column's activity genuinely starts/ends off an hour boundary; an activity
  // cell then spans (merges) down through any further whole-hour rows it covers.
  function computeExtraSectionGrid(days, kidsToShow){
    const rangeStart = toMin('16:00'), rangeEnd = toMin('21:00');
    const actsByCol = {};
    days.forEach((d,dayIdx)=>{
      actsByCol[dayIdx] = {};
      kidsToShow.forEach(k=>{ actsByCol[dayIdx][k] = extraActivitiesForWeekdayFiltered(k, d.date); });
    });
    const bpSet = new Set([16,17,18,19,20,21].map(h=>h*60));
    days.forEach((d,dayIdx)=>{
      kidsToShow.forEach(k=>{
        actsByCol[dayIdx][k].forEach(a=>{
          const s = Math.max(rangeStart, toMin(a.start));
          const e = Math.min(rangeEnd, toMin(a.end||a.start));
          if(s>rangeStart && s<rangeEnd) bpSet.add(s);
          if(e>rangeStart && e<rangeEnd) bpSet.add(e);
        });
      });
    });
    const bps = Array.from(bpSet).sort((a,b)=>a-b);
    const segments = [];
    for(let i=0;i<bps.length-1;i++) segments.push({start:bps[i], end:bps[i+1], hour: Math.floor((bps[i]-rangeStart)/60)});
    const hourGroupSize = [0,0,0,0,0];
    segments.forEach(s=> hourGroupSize[s.hour]++);

    function activityForSegment(dayIdx,kid,seg){
      return actsByCol[dayIdx][kid].find(a=>{
        const s = Math.max(rangeStart, toMin(a.start)), e = Math.min(rangeEnd, toMin(a.end||a.start));
        return s<=seg.start && e>=seg.end;
      }) || null;
    }

    const colSeg = {}, colRowspan = {};
    days.forEach((d,dayIdx)=>{
      colSeg[dayIdx]={}; colRowspan[dayIdx]={};
      kidsToShow.forEach(k=>{
        const segArr = segments.map(seg=>activityForSegment(dayIdx,k,seg));
        colSeg[dayIdx][k] = segArr;
        const rs = new Array(segments.length).fill(1);
        let i=0;
        while(i<segments.length){
          const cur = segArr[i];
          let j=i+1;
          while(j<segments.length){
            const nxt = segArr[j];
            // same activity object merges across hour boundaries; two "empty" segments
            // only merge if they belong to the same hour block, so the 5 named
            // hour-rows stay visually distinct wherever nothing needs splitting
            const same = cur ? (nxt===cur) : (nxt===null && segments[j].hour===segments[i].hour);
            if(!same) break;
            j++;
          }
          rs[i]=j-i;
          for(let x=i+1;x<j;x++) rs[x]=0;
          i=j;
        }
        colRowspan[dayIdx][k]=rs;
      });
    });
    return {hourGroupSize, colSeg, colRowspan};
  }

  function writePeriodRows(ws, startRow, days, kidsToShow, colsPerDay){
    const cache = {};
    days.forEach((d,dayIdx)=>{ cache[dayIdx]={}; kidsToShow.forEach(k=> cache[dayIdx][k]=lyceumPeriodsForWeekdayFiltered(k,d.date)); });
    LESSON_TIMES.forEach((p,idx)=>{
      const r = startRow+idx;
      ws.getCell(r,1).value = p.n+' урок\n'+p.start+' - '+p.end;
      days.forEach((d,dayIdx)=>{
        kidsToShow.forEach((k,kIdx)=>{
          const col = 2+dayIdx*colsPerDay+kIdx;
          const cell = cache[dayIdx][k][idx];
          if(cell && cell.subject) ws.getCell(r,col).value = cell.subject;
        });
      });
    });
    return startRow+LESSON_TIMES.length;
  }

  function writeExtraSection(ws, startRow, days, kidsToShow, colsPerDay){
    const {hourGroupSize, colSeg, colRowspan} = computeExtraSectionGrid(days, kidsToShow);
    let rowNum = startRow, segIdx = 0;
    for(let h=0; h<5; h++){
      const size = hourGroupSize[h] || 0;
      for(let s=0; s<size; s++){
        const excelRow = rowNum;
        if(s===0){
          ws.getCell(excelRow,1).value = EXTRA_BLOCKS[h].start+' - '+EXTRA_BLOCKS[h].end;
          if(size>1) ws.mergeCells(excelRow,1,excelRow+size-1,1);
        }
        days.forEach((d,dayIdx)=>{
          kidsToShow.forEach((k,kIdx)=>{
            const col = 2+dayIdx*colsPerDay+kIdx;
            const rs = colRowspan[dayIdx][k][segIdx];
            if(rs>0){
              const act = colSeg[dayIdx][k][segIdx];
              if(act) ws.getCell(excelRow,col).value = act.subject+'\n'+act.start+' - '+act.end;
              if(rs>1) ws.mergeCells(excelRow,col,excelRow+rs-1,col);
            }
          });
        });
        segIdx++; rowNum++;
      }
    }
    return rowNum;
  }

  // builds one worksheet: fixed 1–8 lyceum-period rows + blank spacer + fixed
  // 16:00–21:00 extra-activity rows, one column block per weekday, for the given
  // kid(s). withFill colours each kid's column with their soft theme colour.
  function buildScheduleSheet(wb, sheetName, days, kidsToShow, withFill){
    const ws = wb.addWorksheet(sheetName, {
      pageSetup: {orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:1, paperSize:9, margins:{left:0.3,right:0.3,top:0.3,bottom:0.3,header:0,footer:0}}
    });
    const colsPerDay = kidsToShow.length;
    const totalCols = 1 + 7*colsPerDay;
    ws.getColumn(1).width = 13;
    for(let c=2;c<=totalCols;c++) ws.getColumn(c).width = colsPerDay>1 ? 13 : 15;

    let headerRows;
    if(colsPerDay>1){
      ws.mergeCells(1,1,2,1);
      days.forEach((d,dayIdx)=>{
        const c0 = 2+dayIdx*2;
        ws.mergeCells(1,c0,1,c0+1);
        ws.getCell(1,c0).value = DOW_FULL[d.weekday];
        kidsToShow.forEach((k,kIdx)=>{ ws.getCell(2,c0+kIdx).value = KIDS.find(x=>x.id===k).name; });
      });
      headerRows = 2;
    } else {
      days.forEach((d,dayIdx)=>{ ws.getCell(1,2+dayIdx).value = DOW_FULL[d.weekday]; });
      headerRows = 1;
    }

    let nextRow = headerRows+1;
    nextRow = writePeriodRows(ws, nextRow, days, kidsToShow, colsPerDay);
    const gapRow = nextRow; nextRow++; // left completely blank as a visual spacer
    ws.getRow(gapRow).height = 6;
    nextRow = writeExtraSection(ws, nextRow, days, kidsToShow, colsPerDay);
    const lastRow = nextRow-1;

    for(let r=1;r<=lastRow;r++){
      if(r===gapRow) continue;
      for(let c=1;c<=totalCols;c++){
        const cell = ws.getCell(r,c);
        cell.border = {top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
        cell.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
        if(r<=headerRows) cell.font = {bold:true};
      }
    }
    if(withFill){
      for(let dayIdx=0; dayIdx<7; dayIdx++){
        kidsToShow.forEach((k,kIdx)=>{
          const col = 2+dayIdx*colsPerDay+kIdx;
          const argb = hexToARGB(KIDS.find(x=>x.id===k).soft);
          for(let r=2;r<=lastRow;r++){
            if(r===gapRow) continue;
            ws.getCell(r,col).fill = {type:'pattern', pattern:'solid', fgColor:{argb}};
          }
        });
      }
    }
    ws.views = [{state:'frozen', ySplit: headerRows}];
  }

  async function exportScheduleExcel(){
    if(typeof ExcelJS==='undefined'){
      alert('Не удалось загрузить библиотеку для Excel — проверьте подключение к интернету и попробуйте ещё раз.');
      return;
    }
    const mon = mondayOf(state.date);
    const days = [0,1,2,3,4,5,6].map(i=>{ const d=addDays(mon,i); return {date: iso(d), weekday: d.getDay()}; });
    const wb = new ExcelJS.Workbook();
    buildScheduleSheet(wb, 'Расписание', days, KIDS.map(k=>k.id), true);
    KIDS.forEach(k=>buildScheduleSheet(wb, k.name.slice(0,31), days, [k.id], false));
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Расписание.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }

  function printHomework(kidId){
    const kid = KIDS.find(k=>k.id===kidId);
    const genDate = new Date().toLocaleDateString('ru-RU');
    let entries = collectHomework().filter(e=> (e.kid===kidId || e.kid==='both') && !e.done && !e.orphaned);
    entries.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
    let html = `<h1>Домашние задания — ${kid.name}</h1>
      <div class="p-sub">сформировано ${genDate} · только невыполненные</div>`;
    if(entries.length===0){
      html += `<p>Невыполненных домашних заданий нет.</p>`;
    } else {
      html += `<table><thead><tr><th>Дата</th><th>Предмет</th><th>Задание</th></tr></thead><tbody>${entries.map(e=>{
        const [y,m,d]=e.date.split('-');
        const subjLabel = e.isCal ? escapeHtml(e.subject)+' <span style="opacity:.6;">('+escapeHtml(e.calName)+')</span>' : escapeHtml(e.subject);
        return `<tr><td>${d}.${m}.${y}</td><td>${subjLabel}</td><td>${escapeHtml(e.text)}</td></tr>`;
      }).join('')}</tbody></table>`;
    }
    doPrint(html, 'Домашние задания — '+kid.name);
  }

  // ---------- event handling ----------
  function attachHandlers(){
    app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab; render();});
    app.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view; render();});
    app.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{
      const dir = el.dataset.nav;
      if(dir==='today') state.date = startOfDay(new Date());
      else {
        const mult = dir==='prev' ? -1 : 1;
        if(state.view==='day') state.date = addDays(state.date, mult*1);
        else if(state.view==='week') state.date = addDays(state.date, mult*7);
        else state.date = addMonths(state.date, mult*1);
      }
      render();

      const title = (document.getElementById('doc-title').value||'').trim();
      const category = document.getElementById('doc-category').value || 'other';
      const note = (document.getElementById('doc-note').value||'').trim();
      const files = docDraft.files.filter(f=>!f.uploading);
      if(!title && files.length===0){ alert('Укажите название или прикрепите файл.'); return; }
      documentsData.push({id:'doc'+Date.now()+'-'+Math.random().toString(36).slice(2,7), title, category, note, files, createdAt:Date.now()});
      docDraft.files = [];
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-docdel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить документ вместе с прикреплёнными файлами?')) return;
      const id = el.dataset.docdel;
      const doc = documentsData.find(d=>d.id===id);
      documentsData = documentsData.filter(d=>d.id!==id);
      await persistAll();
      render();
      if(doc) (doc.files||[]).forEach(removeFileFromStorage);
    });
    app.querySelectorAll('[data-docfiledel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить этот файл?')) return;
      const [docId, fileId] = el.dataset.docfiledel.split('|');
      const doc = documentsData.find(d=>d.id===docId);
      if(doc){
        const removed = (doc.files||[]).find(f=>f.id===fileId);
        doc.files = (doc.files||[]).filter(f=>f.id!==fileId);
        await persistAll();
        render();
        if(removed) removeFileFromStorage(removed);
      }
    });
    const linkAdd = document.getElementById('link-add');
    if(linkAdd) linkAdd.onclick = async ()=>{
      const title = (document.getElementById('link-title').value||'').trim();
      const url = normalizeUrl(document.getElementById('link-url').value);
      const note = (document.getElementById('link-note').value||'').trim();
      if(!url){ alert('Укажите ссылку.'); return; }
      linksData.push({id:'lnk'+Date.now()+'-'+Math.random().toString(36).slice(2,7), title, url, note, createdAt:Date.now()});
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-linkdel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить эту ссылку?')) return;
      linksData = linksData.filter(l=>l.id!==el.dataset.linkdel);
      await persistAll();
      render();
    });

    const ps = document.getElementById('print-schedule');
    if(ps) ps.onclick = exportScheduleExcel;
    app.querySelectorAll('[data-printhw]').forEach(el=>el.onclick=()=>printHomework(el.dataset.printhw));
    if(typeof bindProfile==='function') bindProfile();
  }

  loadStorage();
})();
</script>
</body>
</html>
