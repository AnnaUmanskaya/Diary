<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#f7f2e6;
    --paper-line:#ded2b4;
    --margin:#b6483f;
    --ink:#26313d;
    --ink-soft:#647184;
    --card:#fffdf8;
    --petya:#2e5a88;
    --petya-soft:#e4edf6;
    --fedya:#3f7a4c;
    --fedya-soft:#e8f2e9;
    --warn:#b6483f;
    --warn-soft:#f7e6e3;
    --done:#4b8b5b;
    --done-soft:#e6f1e8;
    --gold:#a9761e;
    --gold-soft:#f6ecd8;
    --radius:10px;
    --shadow:0 1px 2px rgba(38,49,61,.08), 0 4px 14px rgba(38,49,61,.06);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 30px, var(--paper-line) 30px 31px);
    color:var(--ink);
    font-family:'PT Sans', system-ui, sans-serif;
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
    overflow-x:hidden;
    padding-left:26px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    top:0; bottom:0; left:22px;
    width:2px;
    background:var(--margin);
    opacity:.55;
  }
  h1,h2,h3,.kid-name,.day-name{font-family:'PT Serif', Georgia, serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  header.top h1{font-size:26px;margin:0;font-weight:700;color:var(--ink);}
  header.top .subtitle{color:var(--ink-soft);font-size:13.5px;}

  nav.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--paper-line);}
  nav.tabs button{
    font-family:'PT Serif', serif;
    font-size:15px;
    background:transparent;
    border:none;
    padding:9px 18px 10px;
    cursor:pointer;
    color:var(--ink-soft);
    border-radius:8px 8px 0 0;
    position:relative;
    top:2px;
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    font-weight:700;
    border:2px solid var(--paper-line);
    border-bottom:2px solid var(--card);
  }

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .seg{display:flex;background:var(--card);border:1px solid var(--paper-line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .seg button{border:none;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--ink-soft);font-family:inherit;}
  .seg button.active{background:var(--ink);color:var(--paper);}
  .navbtns{display:flex;align-items:center;gap:4px;}
  .navbtns button{border:1px solid var(--paper-line);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--ink);box-shadow:var(--shadow);}
  .navbtns .today{width:auto;padding:0 14px;font-family:'PT Sans';font-size:13.5px;}
  .range-label{font-family:'PT Serif',serif;font-size:17px;font-weight:700;margin-left:4px;}
  .spacer{flex:1;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;padding:8px 12px;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;}
  .legend .litem{display:flex;align-items:center;gap:5px;}
  .kid-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;flex:none;}
  .kid-badge.petya{background:var(--petya);}
  .kid-badge.fedya{background:var(--fedya);}

  .banners-row{display:flex;gap:14px;align-items:stretch;margin-bottom:14px;}
  .banners-row .olympiad-banner, .banners-row .reminder-banner{flex:1;min-width:0;margin-bottom:0;}
  .olympiad-banner{background:var(--gold-soft);border:1px solid var(--gold);color:#7a5613;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;}
  .olympiad-banner .ob-row{display:flex;gap:8px;align-items:center;}
  .reminder-banner{background:#fdece4;border:1px solid #e08a5e;color:#8a3f14;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;}
  .reminder-banner .rb-row{display:flex;gap:8px;align-items:center;}
  .warn-banner{background:#fff3cd;border:1px solid #e0c46c;color:#6b5215;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  /* homework file attachments */
  .m-files-list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px;}
  .m-file-chip{display:flex;align-items:center;gap:5px;background:#f3f3ec;border:1px solid var(--paper-line);border-radius:6px;padding:3px 6px;font-size:11px;max-width:170px;}
  .m-file-chip img{width:20px;height:20px;object-fit:cover;border-radius:3px;flex:none;}
  .m-file-chip .m-file-icon{font-size:14px;}
  .m-file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px;}
  .m-file-del{border:none;background:none;cursor:pointer;color:#a33;font-size:12px;padding:0;line-height:1;}
  .m-file-attach-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--paper-line);border-radius:7px;padding:6px 10px;margin-bottom:8px;}
  .m-lib-pick{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
  .m-lib-pick select{flex:1;min-width:0;font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--paper-line);border-radius:7px;background:#fff;color:var(--ink);}

  /* library tab */
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:8px;}
  .lib-card{position:relative;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;padding:8px;box-shadow:var(--shadow);}
  .lib-preview{display:block;text-decoration:none;color:inherit;}
  .lib-preview img{width:100%;height:90px;object-fit:cover;border-radius:6px;display:block;}
  .lib-file-icon{width:100%;height:90px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#f3f3ec;border-radius:6px;}
  .lib-name{font-size:11.5px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-sub{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .lib-card .rdel{position:absolute;top:4px;right:4px;}

  .banner{background:var(--warn-soft);color:var(--margin);border:1px dashed var(--margin);border-radius:8px;padding:7px 11px;font-size:13px;margin-bottom:8px;}
  .banner.holiday{background:#eef2e4;color:#5c6b3f;border-color:#8a9a5b;}
  .banner.olympiad{background:var(--gold-soft);color:#7a5613;border-color:var(--gold);}

  /* day table (merged Petya/Fedya by period) */
  .day-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;}
  .day-card .dc-head{font-size:17px;font-weight:700;margin-bottom:2px;}
  .day-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .day-table th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--paper-line);}
  .day-table th.col-petya{color:var(--petya);}
  .day-table th.col-fedya{color:var(--fedya);}
  .day-table td{padding:5px 8px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  .day-table td.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;width:88px;}
  .cell-lesson{cursor:pointer;border-radius:7px;padding:6px 9px;border:1px solid transparent;display:flex;align-items:center;gap:8px;}
  .cell-lesson:hover{background:rgba(0,0,0,.035);}
  .cell-lesson.petya{border-left:3px solid var(--petya);}
  .cell-lesson.fedya{border-left:3px solid var(--fedya);}
  .cell-empty{color:var(--paper-line);font-size:12px;padding-left:9px;}
  .cell-subject{font-size:13.5px;flex:1;min-width:0;}
  .cell-grades{display:flex;gap:4px;flex:none;align-items:center;}
  .cell-lesson .cell-hw{float:none;flex:none;}
  .cell-hw{float:right;font-size:13px;}

  /* week view: 5 mini day-cards in a row */
  .week-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .week-daycard{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;flex:0 0 230px;min-width:230px;}
  .week-daycard .wd-head{font-size:13px;font-weight:700;text-align:center;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--paper-line);}
  .week-daycard .wd-head.today{color:var(--margin);}
  .wd-period{display:flex;gap:6px;align-items:stretch;padding:5px 0;border-bottom:1px dotted var(--paper-line);}
  .wd-period:last-of-type{border-bottom:none;}
  .wd-ptime{flex:0 0 32px;font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:4px;}
  .wd-pair{display:flex;gap:5px;flex:1;min-width:0;}
  .wd-cell{flex:1;min-width:0;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:11.5px;line-height:1.28;white-space:normal;word-break:break-word;box-sizing:border-box;}
  .wd-cell:last-child{margin-bottom:0;}
  .wd-cell{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;}
  .wd-name{flex:1;min-width:0;}
  .wd-grades{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;flex:none;}
  .wd-cell.petya{background:var(--petya-soft);color:var(--petya);}
  .wd-cell.fedya{background:var(--fedya-soft);color:var(--fedya);}
  .wd-cell.empty{background:transparent;color:var(--paper-line);cursor:default;font-size:12px;padding:4px 6px;}
  .wd-flags{font-size:11px;margin-top:4px;color:var(--gold);word-break:break-word;}
  .wd-add{display:block;width:100%;text-align:center;background:none;border:1px dashed var(--paper-line);color:var(--ink-soft);border-radius:6px;font-size:11px;padding:5px 0;margin-top:8px;cursor:pointer;font-family:inherit;}
  .wd-add:hover{border-color:var(--ink-soft);color:var(--ink);}

  /* month grid (merged) */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-dow{font-size:11px;text-align:center;color:var(--ink-soft);padding-bottom:4px;}
  .month-cell{min-height:72px;border:1px solid var(--paper-line);border-radius:7px;padding:6px 7px;cursor:pointer;background:#fff;position:relative;}
  .month-cell.other{opacity:.35;}
  .month-cell.today{border-color:var(--margin);border-width:2px;}
  .month-cell.holiday{background:#eef2e4;}
  .month-cell .mc-date{font-size:12px;font-weight:700;}
  .month-cell .mc-line{font-size:10.5px;margin-top:3px;display:flex;align-items:center;gap:3px;}
  .month-cell .mc-line.petya{color:var(--petya);}
  .month-cell .mc-line.fedya{color:var(--fedya);}
  .month-cell .mc-flags{position:absolute;top:4px;right:5px;font-size:11px;display:flex;gap:2px;}

  /* homework tab */
  .filters{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .hw-list{display:flex;flex-direction:column;gap:8px;}
  .hw-item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow);}
  .hw-item.overdue{border-left:4px solid var(--warn);}
  .hw-item.done{opacity:.6;}
  .hw-check{width:20px;height:20px;flex:none;margin-top:2px;cursor:pointer;accent-color:var(--done);}
  .hw-main{flex:1;cursor:pointer;}
  .hw-top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:3px;}
  .kid-tag{font-weight:700;padding:1px 8px;border-radius:999px;font-size:11.5px;}
  .hw-subject{font-weight:700;color:var(--ink);}
  .hw-text{font-size:13.5px;white-space:pre-wrap;}
  .hw-text.done-text{text-decoration:line-through;}
  .empty-state{color:var(--ink-soft);font-style:italic;padding:30px 10px;text-align:center;}

  /* reminders / olympiads tab */
  .section-title{font-size:18px;font-weight:700;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .reminder-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-soft);}
  .field input, .field select{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;background:#fff;color:var(--ink);}
  .field input[type=text]{min-width:220px;}
  .btn{font-family:'PT Sans';font-size:13.5px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);}
  .btn.secondary{background:transparent;border:1px solid var(--paper-line);color:var(--ink);}
  .btn.danger{background:var(--warn);color:#fff;}
  .btn.gold{background:var(--gold);color:#fff;}

  .reminder-list{display:flex;flex-direction:column;gap:8px;}
  .reminder-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);}
  .reminder-item.past{opacity:.5;}
  .reminder-item.olympiad{border-left:4px solid var(--gold);}
  .reminder-date{font-family:'PT Serif',serif;font-weight:700;font-size:14px;width:110px;flex:none;}
  .reminder-item .rtext{flex:1;font-size:13.5px;}
  .reminder-item .rdel{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:2px 6px;}

  /* olympiads tab */
  .ol-summary{font-size:13px;color:var(--ink-soft);margin:0 0 12px;}
  .ol-card{background:var(--card);border:1px solid var(--paper-line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;}
  .ol-card.past{border-left-color:var(--paper-line);}
  .ol-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ol-title{flex:1 1 200px;font-family:'PT Serif',serif;font-weight:700;font-size:15px;}
  .ol-date{font-size:13px;color:var(--ink-soft);}
  .ol-fields{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .ol-fields .field input[type=text]{min-width:0;width:170px;max-width:100%;}
  .ol-diploma{display:flex;flex-direction:column;gap:2px;}
  .ol-diploma .m-files-list{margin:0 0 4px;}
  .ol-diploma .m-file-attach-label{margin-bottom:0;}

  /* grades tab */
  .grades-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .grades-table{width:100%;border-collapse:collapse;}
  .grades-table th{text-align:left;font-family:'PT Serif',serif;font-weight:700;font-size:12.5px;color:var(--ink-soft);padding:0 10px 8px;border-bottom:2px solid var(--paper-line);}
  .grades-table td{padding:9px 10px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  .grades-table tr:last-child td{border-bottom:none;}
  .gt-subject{font-family:'PT Serif',serif;font-weight:700;font-size:14px;white-space:nowrap;}
  .gt-grades{width:100%;}
  .gt-avg{text-align:center;white-space:nowrap;}
  .gt-avg b{font-family:'PT Serif',serif;font-size:16px;color:var(--ink);}
  .gt-need{white-space:nowrap;}
  .gs-need{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:#7a5613;}
  .gs-need.ok{background:var(--done-soft);color:var(--done);}
  .gs-need.none{background:transparent;color:var(--ink-soft);padding:2px 0;}
  .gs-grades{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;}
  /* a single grade shown as "value" with weight as a small superscript exponent, e.g. 4² */
  .gs-grade{position:relative;display:inline-flex;align-items:flex-start;padding:2px 9px 2px 4px;border-radius:6px;}
  .gs-grade:hover{background:var(--paper);}
  .gs-grade input[type=number]{font-family:inherit;border:none;background:transparent;color:var(--ink);padding:0;text-align:center;-moz-appearance:textfield;}
  .gs-grade input[type=number]::-webkit-outer-spin-button,
  .gs-grade input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .gs-grade .gs-val{width:16px;font-weight:700;font-size:16px;border-bottom:1px dotted var(--paper-line);}
  .gs-grade .gs-val:focus{outline:none;border-bottom:1px solid var(--ink);}
  .gs-grade .gs-weight{width:15px;font-size:10px;color:var(--ink-soft);position:relative;top:-5px;margin-left:1px;}
  .gs-grade .gs-weight:focus{outline:none;color:var(--ink);}
  .gs-grade .gs-del{position:absolute;top:-6px;right:-2px;background:var(--ink);color:var(--paper);border:none;border-radius:50%;width:13px;height:13px;line-height:13px;font-size:9px;cursor:pointer;padding:0;opacity:0;transition:opacity .15s;}
  .gs-grade:hover .gs-del{opacity:1;}
  .gs-add-inline{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--paper-line);border-radius:6px;padding:2px 6px;margin-left:2px;}
  .gs-add-inline input[type=number]{font-family:inherit;font-size:13px;border:none;background:transparent;color:var(--ink);padding:0;text-align:center;-moz-appearance:textfield;}
  .gs-add-inline input[type=number]::-webkit-outer-spin-button,
  .gs-add-inline input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .gs-add-inline .gs-add-val{width:18px;font-weight:700;}
  .gs-add-inline .gs-add-x{color:var(--ink-soft);font-size:11px;}
  .gs-add-inline .gs-add-w{width:14px;font-size:11px;color:var(--ink-soft);}
  .gs-add-inline button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;}
  .gs-add-inline button:hover{color:var(--ink);}
  .gs-add-inline input[type=text]{font-family:inherit;font-size:13px;border:none;background:transparent;color:var(--ink);padding:0;text-align:center;}
  .gs-add-inline .gs-add-val{width:34px;font-weight:700;}
  /* a grade is a clickable chip: "5/4" with weight as a small superscript */
  .gs-chip{display:inline-flex;align-items:flex-start;font-family:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 7px 2px 5px;cursor:pointer;color:var(--ink);}
  .gs-chip:hover{background:var(--paper);border-color:var(--paper-line);}
  .gs-chip .gs-chip-val{font-weight:700;font-size:16px;}
  .gs-chip sup{font-size:10px;color:var(--ink-soft);margin-left:1px;line-height:1;position:relative;top:-1px;}
  .gs-chip.nodate .gs-chip-val::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-left:3px;vertical-align:super;}
  /* grade that is shown but not counted in the trimester average */
  .gs-chip.nocount{background:#e9edf3;border:1px dashed #7d8ca3;color:#4a5a73;}
  .gs-chip.nocount .gs-chip-val{font-weight:400;font-style:italic;}
  .gs-chip.nocount:hover{background:#dde3ec;}
  .lg-item.nocount{background:#e9edf3;border:1px dashed #7d8ca3;color:#4a5a73;}
  .gs-nc{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .gs-nc input{margin:0;}
  .gs-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-soft);margin:0 0 12px;}
  .gs-legend .gs-chip{cursor:default;pointer-events:none;padding:1px 7px;}
  .m-check-nc{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:10px;}
  /* grade badge shown on a lesson in the schedule */
  .sg{display:inline-block;font-family:'PT Serif',Georgia,serif;font-weight:700;font-size:.95em;line-height:1.25;background:var(--gold-soft);color:#7a5613;border:1px solid var(--gold);border-radius:5px;padding:0 4px;margin-left:0;white-space:nowrap;vertical-align:baseline;}
  .sg sup{font-size:.65em;font-weight:400;margin-left:1px;}
  .sg.nocount{background:#e9edf3;color:#4a5a73;border:1px dashed #7d8ca3;font-weight:400;font-style:italic;}
  .gs-grade{padding:0 10px 0 0;}
  .gs-grade:hover{background:transparent;}
  .gs-add-inline .gs-add-date{font-family:inherit;font-size:11.5px;border:none;background:transparent;color:var(--ink-soft);padding:0;width:104px;}
  /* schedule laid out on a real-clock scale: hour grid underneath, lessons stretched to their real duration */
  .ts-body{position:relative;display:flex;gap:6px;
    background-image:
      repeating-linear-gradient(to bottom, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent var(--pph)),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--pph) / 2), rgba(222,210,180,.55) calc(var(--pph) / 2), rgba(222,210,180,.55) calc(var(--pph) / 2 + 1px), transparent calc(var(--pph) / 2 + 1px), transparent var(--pph));}
  .ts-gutter{flex:0 0 32px;position:relative;}
  .ts-body.day .ts-gutter{flex-basis:46px;}
  .wd-flagbox{display:flow-root;}
  .ts-hlabel{position:absolute;left:0;font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums;transform:translateY(-50%);background:var(--card);padding:0 2px 0 0;line-height:1.2;}
  .ts-body.day .ts-hlabel{font-size:11.5px;}
  .ts-lanes{flex:1;min-width:0;display:flex;gap:5px;}
  .ts-lane{flex:1;position:relative;min-width:0;height:100%;}
  .ts-ev{position:absolute;box-sizing:border-box;overflow:hidden;}
  .wd-cell.ts-ev{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:1px;line-height:1.2;padding:3px 5px;}
  .wd-cell.ts-ev .wd-name{flex:none;max-width:100%;}
  .cell-lesson.ts-ev{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:1px;padding:3px 9px;border-left-width:3px;border-left-style:solid;}
  .ts-top{display:flex;gap:8px;align-items:flex-start;}
  .ts-top .cell-subject{flex:1;min-width:0;}
  .ts-grades{display:flex;flex-wrap:wrap;gap:3px;}
  .ts-hw{display:block;font-size:12px;line-height:1.2;}
  .ts-ev:hover{z-index:3;box-shadow:0 2px 10px rgba(38,49,61,.25);}
  .ts-t{display:block;font-size:10px;opacity:.75;font-weight:400;font-variant-numeric:tabular-nums;}
  .ts-body.day .ts-t{font-size:11.5px;}
  .ts-now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--margin);z-index:4;pointer-events:none;}
  .ts-now::before{content:'';position:absolute;left:-3px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--margin);}
  .ts-head{display:flex;gap:6px;margin-bottom:6px;font-family:'PT Serif',serif;font-weight:700;font-size:13px;}
  .ts-head .g{flex:0 0 46px;}
  .ts-head span.k{flex:1;text-align:center;}
  .gm-row{display:flex;gap:8px;}
  .gm-row .field{flex:1;}
  .gm-row input{width:100%;font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;background:#fff;color:var(--ink);}
  .lg-box{margin-top:14px;border-top:1px dashed var(--paper-line);padding-top:6px;}
  .lg-list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;}
  .lg-item{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:3px 8px;font-size:12.5px;color:#7a5613;}
  .lg-item b{font-family:'PT Serif',serif;font-size:15px;}
  .lg-item button{border:none;background:none;cursor:pointer;color:#a33;font-size:12px;padding:0;}
  .lg-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

  .gt-subdel:hover{opacity:1;color:var(--warn);}
  .gs-hidden-subjects{margin-top:14px;padding-top:10px;border-top:1px dashed var(--paper-line);font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .gs-hidden-label{margin-right:2px;}

  .bulk-bar input[type=date]{font-family:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--paper-line);border-radius:6px;}
  .bulk-count{font-weight:700;}

  .dup-option-text{font-size:13px;}

  /* calendars (schedule settings) */
  .cal-swatch{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;vertical-align:middle;}

  .cal-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);flex-wrap:wrap;}
  .weekday-picker{display:flex;gap:6px;flex-wrap:wrap;}
  .weekday-picker label{font-size:12px;display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--paper-line);border-radius:6px;padding:3px 7px;cursor:pointer;}
  .cal-toggle-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;margin-bottom:14px;padding:8px 12px;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;}
  .cal-toggle-row label{display:flex;align-items:center;gap:6px;cursor:pointer;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(38,49,61,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--card);border-radius:14px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 2px;font-size:19px;}
  .modal .m-sub{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}
  .modal label.m-label{font-size:12px;color:var(--ink-soft);display:block;margin:10px 0 4px;}
  .modal input[type=text].m-subject{width:100%;font-family:inherit;font-size:15px;font-weight:700;padding:9px 10px;border:1px solid var(--paper-line);border-radius:8px;color:var(--ink);}
  .modal textarea{width:100%;min-height:80px;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--paper-line);border-radius:8px;resize:vertical;color:var(--ink);}
  .modal .m-check{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:14px;}
  .modal .m-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px;}
  .modal .m-actions .right{display:flex;gap:8px;}

  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-style:italic;}

  /* print */
  #print-area{display:none;}
  #print-area{font-family:'PT Sans', Arial, sans-serif; color:#1a1a1a;}
  #print-area h1{font-size:21px;margin:0 0 4px;font-family:'PT Serif',Georgia,serif;border-bottom:2px solid #333;padding-bottom:7px;}
  #print-area .p-sub{font-size:11.5px;color:#555;margin:6px 0 4px;}
  #print-area .p-legend{font-size:10.5px;color:#666;margin-bottom:12px;}
  #print-area table{width:100%;border-collapse:collapse;margin-bottom:6px;table-layout:fixed;}
  #print-area th,#print-area td{border:1px solid #999;padding:4px 6px;font-size:11.5px;text-align:left;vertical-align:top;word-wrap:break-word;}
  #print-area th{background:#f0ede2;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:'PT Serif',serif;}
  #print-area .p-banner{font-size:10.5px;margin:2px 0 5px;}
  #print-area .p-daytitle{font-weight:700;font-size:12px;margin:0 0 3px;font-family:'PT Serif',serif;}
  /* week: one outer table, 7 day-cells, no border on the wrapper itself */
  #print-area table.p-week-outer{table-layout:fixed;}
  #print-area table.p-week-outer > tbody > tr > td{border:none;padding:0 3px;vertical-align:top;width:14.28%;}
  #print-area table.p-week-outer table{margin-bottom:0;}
  #print-area table.p-week-outer table th,
  #print-area table.p-week-outer table td{font-size:8.7px;padding:2px 3px;}

  /* unified schedule table: fixed 1–8 lyceum rows + gap + fixed 16:00–21:00 rows,
     identical structure for every day and kid so nothing ends up lopsided */
  #print-area table.p-unified td{vertical-align:middle;}
  #print-area table.p-unified td.p-time{white-space:nowrap;font-variant-numeric:tabular-nums;color:#444;}
  #print-area table.p-unified td.p-empty{color:#bbb;text-align:center;}
  #print-area table.p-unified tr.p-gap td{border:none;padding:3px 0;}
  #print-area .p-subj{font-weight:600;}
  #print-area .p-time-sub{display:block;font-size:9px;color:#777;font-weight:400;}

  @media print{
    @page{ size: landscape; margin: 12mm; }
    body > *:not(#print-area){display:none !important;}
    body{background:none;padding:0;margin:0;}
    body::before{display:none;}
    #print-area{display:block !important;}
    #print-area table, #print-area tr{page-break-inside:avoid;}
  }

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:480px;}

  @media (max-width:820px){
    .week-daycard{flex:0 0 200px;min-width:200px;}
  }

  /* ---------------- mobile phones ---------------- */
  @media (max-width:640px){
    body{padding-left:14px;font-size:14px;}
    body::before{left:10px;}
    .wrap{padding:14px 10px 40px;}

    header.top{margin-bottom:12px;}
    header.top h1{font-size:19px;}
    header.top .subtitle{font-size:12px;}

    /* tabs: horizontal swipe strip instead of wrapping/overflowing off-screen */
    nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -10px 14px;padding:0 10px 4px;}
    nav.tabs::-webkit-scrollbar{height:0;}
    nav.tabs button{flex:0 0 auto;font-size:13px;padding:8px 12px 9px;white-space:nowrap;}

    .toolbar{gap:8px;margin-bottom:10px;}
    .seg button{padding:6px 11px;font-size:12.5px;}
    .navbtns button{width:36px;height:36px;font-size:16px;}
    .navbtns .today{padding:0 12px;}
    .range-label{font-size:14.5px;width:100%;order:3;margin:2px 0 0;}
    #print-schedule{width:100%;order:4;}

    .legend{font-size:11.5px;gap:10px;padding:7px 10px;}
    .banners-row{flex-direction:column;}

    .day-card{padding:11px;}
    .day-table td.time{width:56px;font-size:11px;}
    .day-table th,.day-table td{padding:5px 5px;}
    .cell-subject{font-size:12.5px;}

    .week-daycard{flex:0 0 82vw;min-width:82vw;}

    /* month grid: keep 7 columns but tighten everything and truncate long lines */
    .month-grid{gap:3px;}
    .month-cell{min-height:56px;padding:3px 4px;border-radius:5px;}
    .month-cell .mc-date{font-size:11px;}
    .month-cell .mc-line{font-size:8.5px;gap:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .month-cell .mc-flags{font-size:9px;top:2px;right:3px;}
    .month-dow{font-size:9.5px;}
    .kid-badge{width:11px !important;height:11px !important;font-size:7px !important;}

    /* forms: one field per row, full width inputs */
    .reminder-form{padding:12px;gap:8px;}
    .field{width:100%;}
    .field input[type=text],.field input[type=date],.field select,.field input[type=number]{width:100%;min-width:0;}
    .m-lib-pick{flex-wrap:wrap;}

    .reminder-item{flex-wrap:wrap;gap:8px 12px;padding:10px 12px;}
    .reminder-date{width:auto;}
    .hw-item{padding:10px 11px;gap:8px;}
    .cal-row{padding:9px 11px;gap:8px;}

    /* grades: table scrolls sideways instead of squeezing illegibly */
    .grades-toolbar{gap:8px;}
    .table-scroll table.grades-table{min-width:560px;}
    .gs-grade .gs-del{opacity:.6;}

    .modal{padding:16px;max-width:100%;}
    .modal-backdrop{padding:10px;}
    .m-actions{flex-wrap:wrap;}

    .lib-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
  }

  /* ===== theme: cream paper, black accents, pastel blocks ===== */
  :root{
    --paper:#f6f0e1; --paper-line:#ddd4bf; --margin:#e46aa6;
    --ink:#141414; --ink-soft:#6f6a5e; --card:#ece6d8;
    --petya:#5b6fc7; --petya-soft:#c9d3f4; --fedya:#b88a00; --fedya-soft:#f4e08a;
    --warn:#cf5038; --warn-soft:#f8e4de; --done:#3f8f6b; --done-soft:#dcefe5;
    --gold:#b88a00; --gold-soft:#f6e7a6; --radius:18px;
    --shadow:none;
  }
  body{background-image:none;padding-left:0;}
  body::before{display:none;}
  nav.tabs{border-bottom:none;gap:6px;flex-wrap:wrap;}
  nav.tabs button{top:0;border-radius:999px;padding:8px 16px;background:transparent;}
  nav.tabs button.active{background:#141414;color:#f6f0e1;border:none;}
  .seg{background:var(--card);border:none;} .seg button.active{background:#141414;color:#f6f0e1;}
  .navbtns button{background:var(--card);border:none;border-radius:50%;}
  .navbtns .today{border-radius:999px;}
  .btn{border-radius:999px;padding:8px 18px;background:#141414;color:#f6f0e1;}
  .btn.secondary{background:transparent;border:1.5px solid #141414;color:#141414;}
  .btn.danger{background:var(--warn);color:#fff;border:none;}
  .btn.gold{background:var(--fedya-soft);color:#141414;}
  .day-card,.reminder-form,.reminder-item,.legend,.week-daycard,.modal,.cal-row{border:none;}
  .week-daycard{background:transparent;padding:0;}
  .week-daycard .wd-head{background:#fbf8ee;border:none;border-radius:14px;padding:9px 0;margin-bottom:10px;}
  .week-daycard .wd-head.today{background:#141414;color:#f6f0e1;}
  .month-cell{background:var(--card);border:none;border-radius:14px;}
  .month-cell.today{background:#141414;color:#f6f0e1;border:none;} .month-cell.today .mc-date{color:#f6f0e1;}
  .month-cell.holiday{background:#f4e08a;}
  .month-cell.other{opacity:.5;}
  .cell-lesson,.wd-cell{border-radius:12px;} .ts-ev{border-radius:12px;}
  .field input,.field select,.m-lib-pick select,.gm-row input,.lg-add input,.lg-add select{background:#fbf8ee;border:1px solid var(--paper-line);border-radius:10px;}
  .banner{border-radius:12px;} .banner.holiday{background:#f4e08a;color:#141414;border:none;}
  .banner.olympiad,.olympiad-banner{background:#f4e08a;border:none;color:#141414;border-radius:14px;}
  .reminder-banner{background:#f6c9df;border:none;color:#141414;border-radius:14px;}
  .warn-banner{background:#f4e08a;border:none;color:#141414;}

  .modal-backdrop{background:rgba(20,20,20,.5);}
  .empty-state{font-style:normal;}
  .week-daycard .ts-hlabel{background:var(--paper);}
  .ts-t{opacity:.65;}
</style>

<body>
<div class="wrap" id="app">
  <div class="loading">Загрузка дневника…</div>
</div>
<div id="print-area"></div>

<script id="schedule-data" type="application/json">{"petya":{"lessons":[],"allday":[]},"fedya":{"lessons":[],"allday":[]}}</script>
<script>
(function(){
  "use strict";
  const RAW = JSON.parse(document.getElementById('schedule-data').textContent);
  const KIDS = []; // active children (+ «Я» when personal calendars exist); rebuilt by rebuildKids()
  const OLYMPIAD_LEAD_DAYS = 14;
  const REMINDER_LEAD_DAYS = 7;

  // ---------- index data ----------
  const lessonsByKidDate = new Proxy({}, {get:(t,k)=> t[k]||(t[k]={})});
  const alldayByKid = new Proxy({}, {get:(t,k)=> t[k]||(t[k]=[])});
  Object.keys(RAW).forEach(id=>{ const k={id};
    RAW[k.id].lessons.forEach(([date,start,end,subject])=>{
      (lessonsByKidDate[k.id][date] = lessonsByKidDate[k.id][date] || []).push({start,end,subject});
    });
    RAW[k.id].allday.forEach(([start,end,summary])=>{
      alldayByKid[k.id].push({start,end,summary});
    });
  });

  // ---------- state ----------
  let state = {tab:'schedule', view:'week', date: startOfDay(new Date())};
  let homeworkData = {};
  let remindersData = []; // {id,type:'reminder'|'olympiad', date, kid:'both'|'petya'|'fedya', text}
  let overridesData = {}; // key -> {subject}  (a single date only)
  let recurringOverridesData = []; // {id, kid, weekday(0-6), start, subject, fromDate} — applies from fromDate onward, every week
  let vacationsData = []; // {id, start, end (inclusive), kid:'both'|'petya'|'fedya', text}
  let customLessonsData = []; // {id, kid, date, start, end, subject}
  let calendarsData = []; // {id, name, color, hidden}
  let calRulesData = []; // {id, calendarId, subject, date, start, end, repeat:'none'|'daily'|'weekly'|'weekdays', weekdays:[0-6], until}
  let calSelectedId = null; // which calendar is expanded in settings tab
  let calRuleEditId = null; // rule currently being edited in settings tab
  let gradesData = {}; // gradesData[kid][subject][trimester] = [{id,value,weight}]
  let gradesKid = 'petya';
  let gradesTri = 1;
  let documentsData = []; // {id,title,category,note,files:[],createdAt}
  let docFilterCat = 'all';
  let olKidFilter = 'all'; // filter on the "Олимпиады" tab
  let docDraft = {files:[]}; // staged files for the "add document" form
  let linksData = []; // {id,title,url,note,createdAt}
  let excludedSubjectsData = {petya:[], fedya:[]}; // subjects hidden from grading per kid
  let fileLibraryData = []; // persistent registry of every uploaded homework file, independent of which homework entry currently references it
  let selectedRuleIds = new Set(); // multi-selected calendar rule ids in "Настройка расписания" for bulk edits
  let storageReady = false;
  let wizStep = 0; // 0 = main app; 1 = choose calendars; 2 = choose children
  let childrenData = []; // {id,name,hex, archive?:{...snapshot of that child's data}}
  let groupsData = [];   // {id,kind:'kids'|'study'|'personal'|'work'|'custom',name}
  let currentUser = null, authMode = 'login', authMsg = '';
  const GROUP_KINDS = [['kids','Учебный (дети)'],['study','Учебный (личный)'],['personal','Личный'],['work','Рабочий']];
  const KID_COLORS = ['#5b6fc7','#c99a00','#d4609f','#3f8f6b','#e07a4f','#141414'];
  const AUTO_CALS = [['lyceum','Лицей'],['extra','Доп.занятия'],['events','Мероприятия']];
  const newId = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  function softOf(hex){ const n=parseInt(hex.slice(1),16); return '#'+[n>>16&255,n>>8&255,n&255].map(c=>Math.round(c+(255-c)*0.88).toString(16).padStart(2,'0')).join(''); }
  function rebuildKids(){
    KIDS.length = 0;

  // ---------- helpers ----------

    // hides once its date has passed, and a reminder hides only once it's both

    const todayStr = iso(startOfDay(new Date()));
    if(r.type==='olympiad') return (r.dateEnd||r.date) >= todayStr;

  // ---------- calendars / recurring rules ----------
  function calRuleMatchesDate(rule, dateStr){
    if(dateStr < rule.date) return false;
    if(rule.until && dateStr > rule.until) return false;
    const dow = dowOf(dateStr);
    if(rule.repeat==='none') return dateStr===rule.date;
    if(rule.repeat==='daily') return true;
    if(rule.repeat==='weekly') return dow===dowOf(rule.date);
    if(rule.repeat==='weekdays') return (rule.weekdays||[]).includes(dow);
    return false;
  }
  function addDaysStr(dateStr, n){ return iso(addDays(new Date(dateStr+'T00:00:00'), n)); }
  // two rules "overlap" if there is at least one real calendar date where BOTH of them
  // would generate a lesson at the same time — this is how a subject ends up saved
  // under two different homework records that look like duplicates of each other.
  function rulesOverlap(r1, r2){
    if(r1.id===r2.id || r1.calendarId!==r2.calendarId || r1.start!==r2.start) return false;
    const FAR = '9999-12-31';
    const r1End = r1.until || FAR, r2End = r2.until || FAR;
    if(r1.date > r2End || r2.date > r1End) return false;
    const rangeStart = r1.date > r2.date ? r1.date : r2.date;
    let rangeEnd = r1End < r2End ? r1End : r2End;
    if(rangeEnd===FAR) rangeEnd = addDaysStr(rangeStart, 60); // bounded scan for open-ended rules
    let d = rangeStart, guard = 0;
    while(d <= rangeEnd && guard < 400){
      if(calRuleMatchesDate(r1,d) && calRuleMatchesDate(r2,d)) return true;
      d = addDaysStr(d,1);
      guard++;
    }
    return false;
  }
  function overlappingRuleIdsForCalendar(calendarId){
    const rules = calRulesData.filter(r=>r.calendarId===calendarId);
    const bad = new Set();
    for(let i=0;i<rules.length;i++){
      for(let j=i+1;j<rules.length;j++){
        if(rulesOverlap(rules[i], rules[j])){ bad.add(rules[i].id); bad.add(rules[j].id); }
      }
    }
    return bad;
  }
  function calOccurrencesForDate(dateStr){
    const out = [];

  function calHwKey(calendarId, ruleId, dateStr, start){
    // include the specific rule id so a truncated/replaced rule can never leak its old
    // homework into a different rule that later reuses the same calendar/day/time slot.
    // falls back to the legacy (pre-fix) key shape when no rule id is known, so existing
    // saved data keeps resolving correctly until it's next edited and re-saved.
    return ruleId ? ('cal|'+calendarId+'|'+ruleId+'|'+dateStr+'|'+start) : ('cal|'+calendarId+'|'+dateStr+'|'+start);
  }
  // resolves the actual homeworkData key for an existing entry, checking the modern
  // (rule-id-aware) key first and falling back to the legacy key shape — needed because
  // data saved before the rule-id fix has no rule id in its key, but a rule may still be
  // found for it by other means (e.g. it currently matches the date), which would
  // otherwise cause toggle/delete actions to silently miss the entry.
  function resolveHwKey(calendarId, ruleId, dateStr, start){
    const preferred = calHwKey(calendarId, ruleId, dateStr, start);
    if(homeworkData[preferred] !== undefined) return preferred;
    const legacy = calHwKey(calendarId, null, dateStr, start);
    if(homeworkData[legacy] !== undefined) return legacy;
    return preferred;
  }
  // finds leftover duplicate pairs from BEFORE the rule-id key fix: a legacy-format key
  // (cal|calendarId|date|start) and a modern-format key (cal|calendarId|ruleId|date|start)
  // that both exist for the exact same calendar/date/time. These are true duplicates —
  // same lesson, split into two separate stored homework entries — and won't merge
  // themselves; they need a one-time manual resolution.
  function findDuplicateHomeworkPairs(){
    const keys = Object.keys(homeworkData);
    const pairs = [];
    keys.forEach(k=>{
      const parts = k.split('|');
      if(parts[0]!=='cal' || parts.length!==4) return; // legacy shape only
      const [, calendarId, date, start] = parts;
      const modernSuffix = '|'+date+'|'+start;
      const modernMatch = keys.find(k2=> k2!==k && k2.startsWith('cal|'+calendarId+'|') && k2.split('|').length===5 && k2.endsWith(modernSuffix));
      if(modernMatch) pairs.push({legacyKey:k, modernKey:modernMatch, calendarId, date, start});
    });
    return pairs;
  }

  // ---- grade helpers ----
  // A grade is {id, value, value2?, weight, date?, start?, src?}. "5/4" is stored as
  // value=5, value2=4 and counts as TWO grades, each with the grade's weight.
  const TRI2_START_MONTH = 12; // 2-й триместр: с 1 декабря
  const TRI3_START_MONTH = 3;  // 3-й триместр: с 1 марта
  function triOfDate(dateStr){
    const m = parseInt((dateStr||'').slice(5,7),10);
    if(!m) return 1;
    if(m>=9 && m<TRI2_START_MONTH) return 1;
    if(m>=TRI2_START_MONTH || m<TRI3_START_MONTH) return 2;
    return 3;
  }
  function parseGradeInput(str){
    const m = String(str||'').trim().match(/^([1-5](?:[.,]\d+)?)\s*(?:[\/\\]\s*([1-5](?:[.,]\d+)?))?$/);
    if(!m) return null;
    const num = x=>parseFloat(String(x).replace(',','.'));
    return {value:num(m[1]), value2: m[2]!=null ? num(m[2]) : null};
  }
  function gradeLabel(g){

  }
  function gradeValues(g){

  }
  function trimesterStats(kid,subject,tri){
    const list = gradesFor(kid,subject,tri);
    let sumW=0, sumWV=0;
    list.forEach(g=>{
      if(g.noCount) return; // shown on the tab, but not part of the trimester average
      const w = Number(g.weight)||1;
      gradeValues(g).forEach(v=>{ sumW += w; sumWV += v*w; });
    });
    if(sumW<=0) return {avg:null, sumW:0, sumWV:0, neededFives:null};
    const avg = sumWV/sumW;
    // how many more grades of "5" (weight 1) are needed so the average is STRICTLY
    // greater than 4.5 (matches the school's rounding rule: 4.5 itself still rounds to 4)
    let neededFives;
    if(avg>4.5+1e-9) neededFives = 0;
    else neededFives = Math.max(0, Math.floor(9*sumW - 2*sumWV + 1e-9) + 1);
    return {avg, sumW, sumWV, neededFives};
  }

          saveFailed = true;
          alert('Не удалось сохранить изменения в облаке Supabase. Изменения сохранены только в этом браузере.');
        }
      }
    })();
    await saveInFlight;
    saveInFlight = null;
  }

  function bindAuth(){
    const go = document.getElementById('au-go'); if(!go) return;
    const setMode = (m,msg)=>()=>{ authMode=m; authMsg=msg||''; render(); };
    const on = (id,fn)=>{ const e=document.getElementById(id); if(e) e.onclick=ev=>{ ev.preventDefault(); fn(); }; };
    on('au-reg', setMode('register')); on('au-back', setMode('login')); on('au-forgot', setMode('forgot'));
    const saveRemember = ()=>{ const r=document.getElementById('au-remember'); try{ if(r) localStorage.setItem('diary:remember', r.checked?'1':'0'); }catch(e){} };
    on('au-guest', async ()=>{
      saveRemember();
      const { data, error } = await sb.auth.signInAnonymously();
      if(error){ authMsg='Гостевой вход недоступен: '+error.message; return render(); }
      currentUser = data.user; await loadUserData();
    });
    const pw = document.getElementById('au-pass'); if(pw) pw.onkeydown = e=>{ if(e.key==='Enter') go.click(); };
    go.onclick = async ()=>{
      const em = document.getElementById('au-email'), ps = document.getElementById('au-pass');
      const email = em ? em.value.trim() : '', password = ps ? ps.value : '';
      authMsg = ''; saveRemember();
      if(authMode!=='recovery' && !email){ authMsg='Введите email.'; return render(); }
      if(authMode!=='forgot' && password.length<6){ authMsg='Пароль — не короче 6 символов.'; return render(); }
      if(authMode==='login'){
        const { data, error } = await sb.auth.signInWithPassword({email,password});
        if(error){ authMsg='Не удалось войти: '+error.message; return render(); }
        currentUser = data.user; await loadUserData();
      } else if(authMode==='register'){
        const { data, error } = await sb.auth.signUp({email,password});
        if(error){ authMsg='Не удалось зарегистрироваться: '+error.message; return render(); }
        if(data.session){ currentUser = data.user; await loadUserData(); }
        else { authMode='login'; authMsg='Мы отправили письмо — подтвердите email и затем войдите.'; render(); }
      } else if(authMode==='forgot'){
        const { error } = await sb.auth.resetPasswordForEmail(email,{redirectTo: location.origin+location.pathname});
        authMode='login'; authMsg = error ? 'Не удалось отправить письмо: '+error.message : 'Если такой аккаунт есть, мы отправили ссылку для смены пароля.'; render();
      } else { // recovery: user came from the e-mail link
        const { data, error } = await sb.auth.updateUser({password});
        if(error){ authMsg='Не удалось сменить пароль: '+error.message; return render(); }
        history.replaceState(null,'',location.pathname); authMode='login'; currentUser = data.user; await loadUserData();
      }
    };
  }

  // ---------- groups (calendar categories) and children ----------
  function createKidCalendars(c){
    AUTO_CALS.forEach(([t,p])=>calendarsData.push({id:newId('cal'),name:p+'_'+c.name,color:c.hex,kid:c.id,auto:t,groupId:'g-kids',hidden:false}));
  }
  function dropCalendars(ids){
    calendarsData = calendarsData.filter(c=>!ids.includes(c.id));
    calRulesData = calRulesData.filter(r=>!ids.includes(r.calendarId));
    Object.keys(homeworkData).forEach(k=>{ if(ids.some(i=>k.startsWith('cal|'+i+'|'))) delete homeworkData[k]; });
  }
  const KEEP = (arr,pred)=>{ const o={t:[],r:[]}; arr.forEach(x=>(pred(x)?o.t:o.r).push(x)); return o; };
  const PICK = (obj,pred)=>{ const t={}; Object.keys(obj).forEach(k=>{ if(pred(k)){ t[k]=obj[k]; delete obj[k]; } }); return t; };
  function archiveChild(id){
    const c = childrenData.find(x=>x.id===id); if(!c) return;
    const calIds = calendarsData.filter(x=>x.kid===id).map(x=>x.id), s = {};
    let o;
    o=KEEP(calendarsData,x=>x.kid===id); s.calendars=o.t; calendarsData=o.r;
    o=KEEP(calRulesData,x=>calIds.includes(x.calendarId)); s.calRules=o.t; calRulesData=o.r;
    o=KEEP(remindersData,x=>x.kid===id); s.reminders=o.t; remindersData=o.r;
    o=KEEP(vacationsData,x=>x.kid===id); s.vacations=o.t; vacationsData=o.r;
    o=KEEP(customLessonsData,x=>x.kid===id); s.customLessons=o.t; customLessonsData=o.r;
    o=KEEP(recurringOverridesData,x=>x.kid===id); s.recurringOverrides=o.t; recurringOverridesData=o.r;
    s.homework = PICK(homeworkData,k=>k.startsWith(id+'|') || calIds.some(i=>k.startsWith('cal|'+i+'|')));
    s.overrides = PICK(overridesData,k=>k.startsWith(id+'|'));
    s.grades = gradesData[id]||null; delete gradesData[id];
    s.excluded = excludedSubjectsData[id]||null; delete excludedSubjectsData[id];
    s.at = new Date().toISOString();
    c.archive = s;
  }
  function restoreChild(id){
    const c = childrenData.find(x=>x.id===id); if(!c||!c.archive) return;
    const s = c.archive;
    calendarsData.push(...s.calendars); calRulesData.push(...s.calRules); remindersData.push(...s.reminders);
    vacationsData.push(...s.vacations); customLessonsData.push(...s.customLessons); recurringOverridesData.push(...s.recurringOverrides);
    Object.assign(homeworkData,s.homework); Object.assign(overridesData,s.overrides);
    if(s.grades) gradesData[id]=s.grades; if(s.excluded) excludedSubjectsData[id]=s.excluded;
    delete c.archive;
  }
  async function commitProfile(){ rebuildKids(); await persistAll(); render(); }

      if(guest) o += `<div class="section-title">Аккаунт</div>

      o += `<div style="display:flex;gap:8px;margin-top:16px;">${childrenData.length||calendarsData.length?'<button class="btn secondary" id="wiz-done">Закрыть</button>':'<button class="btn secondary" id="au-logout">Выйти</button>'}<div class="spacer"></div><button class="btn" id="wiz-next">${hasKids?'Далее':'Готово'}</button></div>`;
    } else {
      o += `<div class="section-title" style="margin-top:0;">Дети</div>
        <div class="reminder-form"><div class="field" style="flex:1;"><label>Имя ребёнка</label><input type="text" id="kid-new-name" style="${inp}"></div>
        <div class="field"><label>Цвет</label><input type="color" id="kid-new-color" value="${KID_COLORS[active.length%KID_COLORS.length]}" style="width:52px;padding:2px;height:36px;"></div>
        <button class="btn" id="kid-add">Добавить ребёнка</button></div>`;
      o += active.length ? `<div class="cal-list">${active.map(c=>`<div class="cal-row"><input type="color" data-kidcolor="${c.id}" value="${c.hex}" style="width:34px;height:28px;padding:1px;"><input type="text" data-kidname="${c.id}" value="${escAttr(c.name)}" style="flex:1;font-weight:700;${inp}"><button class="btn secondary" data-kidarch="${c.id}">${c.id.length>0?'В архив':''}</button></div>`).join('')}</div>` : `<div class="empty-state">Детей пока нет.</div>`;
      if(archived.length) o += `<div class="section-title">Архив</div>
        <div class="cal-list">${archived.map(c=>`<div class="cal-row"><b style="flex:1;color:var(--ink-soft);">${escapeHtml(c.name)}</b><span style="font-size:12px;color:var(--ink-soft);">в архиве с ${c.archive.at.slice(0,10)}</span><button class="btn secondary" data-kidrestore="${c.id}">Восстановить</button><button class="btn danger" data-kiddel="${c.id}">Удалить навсегда</button></div>`).join('')}</div>`;
      o += `<div style="display:flex;gap:8px;margin-top:16px;"><button class="btn secondary" id="wiz-back">Назад</button><div class="spacer"></div><button class="btn" id="wiz-done">Готово</button></div>`;
    }

  function bindWiz(){
    const $ = id=>document.getElementById(id);
    const finish = async ()=>{ wizStep = 0; state.tab = 'schedule'; rebuildKids(); await persistAll(); render(); };
    if($('wiz-next')) $('wiz-next').onclick = ()=>{
      if(!groupsData.length) return alert('Выберите или добавьте хотя бы один календарь.');
      if(groupsData.some(g=>g.kind==='kids')){ wizStep = 2; render(); } else finish();
    };
    if($('wiz-back')) $('wiz-back').onclick = ()=>{ wizStep = 1; render(); };
    if($('wiz-done')) $('wiz-done').onclick = ()=>{ if(!groupsData.length) return alert('Выберите или добавьте хотя бы один календарь.'); finish(); };
  }
  function bindProfile(){
    const $ = s=>app.querySelectorAll(s), by = (id,l)=>l.find(x=>x.id===id);
    const lo = document.getElementById('au-logout'); if(lo) lo.onclick = async ()=>{
      if(currentUser.is_anonymous && !confirm('Вы гость: после выхода данные будут потеряны. Выйти?')) return;
      await sb.auth.signOut();
    };
    const hs = document.getElementById('hdr-settings'); if(hs) hs.onclick = ()=>{ wizStep = 1; render(); };
    const gu = document.getElementById('gu-up'); if(gu) gu.onclick = async ()=>{
      const email = document.getElementById('gu-email').value.trim(), password = document.getElementById('gu-pass').value;
      if(!email || password.length<6) return alert('Введите email и пароль (не короче 6 символов).');
      const { error } = await sb.auth.updateUser({email,password});
      alert(error ? 'Не удалось: '+error.message : 'Готово. Если включено подтверждение почты — перейдите по ссылке из письма.');
    };
    const addGroup = async (kind,name)=>{
      if(!name) return;
      const g = {id: kind==='kids'?'g-kids':newId('g'), kind, name}; groupsData.push(g);
      if(kind!=='kids') calendarsData.push({id:newId('cal'),name,color:'#6b4e9b',kid:'me',groupId:g.id,hidden:false});
      await commitProfile();
    };
    $('[data-grpadd]').forEach(el=>el.onclick=()=>addGroup(el.dataset.grpadd, (GROUP_KINDS.find(x=>x[0]===el.dataset.grpadd)||[])[1]));
    const ga = document.getElementById('grp-add'); if(ga) ga.onclick = ()=>addGroup('custom', document.getElementById('grp-new').value.trim());
    $('[data-grpname]').forEach(el=>el.onchange=async ()=>{
      const g = by(el.dataset.grpname,groupsData), v = el.value.trim(); if(!g||!v) return;
      calendarsData.forEach(c=>{ if(c.groupId===g.id && c.name===g.name) c.name=v; }); g.name=v; await commitProfile();
    });
    $('[data-grpdel]').forEach(el=>el.onclick=async ()=>{
      const g = by(el.dataset.grpdel,groupsData); if(!g) return;
      if(g.kind==='kids'){
        if(!confirm('Убрать календарь «'+g.name+'»? Все дети будут перенесены в архив (данные сохранятся, их можно восстановить).')) return;
        childrenData.filter(c=>!c.archive).forEach(c=>archiveChild(c.id));
      } else {
        if(!confirm('Удалить календарь «'+g.name+'» вместе со всеми его календарями, уроками и ДЗ?')) return;
        dropCalendars(calendarsData.filter(c=>c.groupId===g.id).map(c=>c.id));
      }
      groupsData = groupsData.filter(x=>x.id!==g.id); await commitProfile();
    });
    const ka = document.getElementById('kid-add'); if(ka) ka.onclick = async ()=>{
      const name = document.getElementById('kid-new-name').value.trim(); if(!name) return;
      const c = {id:newId('k'),name,hex:document.getElementById('kid-new-color').value}; childrenData.push(c); createKidCalendars(c); await commitProfile();
    };
    $('[data-kidname]').forEach(el=>el.onchange=async ()=>{
      const c = by(el.dataset.kidname,childrenData), v = el.value.trim(); if(!c||!v) return;
      c.name = v; calendarsData.forEach(x=>{ if(x.kid===c.id && x.auto) x.name = AUTO_CALS.find(a=>a[0]===x.auto)[1]+'_'+v; }); await commitProfile();
    });
    $('[data-kidcolor]').forEach(el=>el.onchange=async ()=>{ const c=by(el.dataset.kidcolor,childrenData); if(c){ c.hex=el.value; await commitProfile(); } });
    $('[data-kidarch]').forEach(el=>el.onclick=async ()=>{
      const c = by(el.dataset.kidarch,childrenData);
      if(c && confirm('Отправить «'+c.name+'» в архив? Расписание, оценки, олимпиады и напоминания будут скрыты, но их можно восстановить.')){ archiveChild(c.id); await commitProfile(); }
    });
    $('[data-kidrestore]').forEach(el=>el.onclick=async ()=>{ restoreChild(el.dataset.kidrestore); await commitProfile(); });
    $('[data-kiddel]').forEach(el=>el.onclick=async ()=>{
      const c = by(el.dataset.kiddel,childrenData);
      if(c && confirm('Удалить «'+c.name+'» и все его данные навсегда? Восстановить будет нельзя.')){ childrenData = childrenData.filter(x=>x.id!==c.id); await commitProfile(); }
    });
    $('[data-calname]').forEach(el=>el.onchange=async ()=>{ const c=by(el.dataset.calname,calendarsData), v=el.value.trim(); if(c&&v){ c.name=v; await persistAll(); render(); } });
  }

  // ---------- rendering ----------
  const app = document.getElementById('app');

  function render(){
    if(!storageReady){ app.innerHTML = '<div class="loading">Загрузка дневника…</div>'; return; }
    if(!currentUser || authMode==='recovery'){ app.innerHTML = authHtml(); bindAuth(); return; }
    if(wizStep){ app.innerHTML = renderWizard(); bindProfile(); bindWiz(); return; }
    let html = renderHeader() + renderTabs();
    if(state.tab==='schedule') html += renderScheduleTab();
    else if(state.tab==='calsettings') html += renderCalSettingsTab();
    else if(state.tab==='homework') html += renderHomeworkTab();
    else if(state.tab==='grades') html += renderGradesTab();
    else if(state.tab==='library') html += renderLibraryTab();
    else if(state.tab==='documents') html += renderDocumentsTab();
    else if(state.tab==='olympiads') html += renderOlympiadsTab();
    else html += renderRemindersTab();
    app.innerHTML = html;
    attachHandlers();
    if(state.tab==='schedule') fitTimeScale();
    if(modalState) renderModal();
  }

  function olympiadBannerHtml(){
    const list = upcomingOlympiads();

    return `<div class="olympiad-banner">${list.map(o=>{
      const kid = KIDS.find(k=>k.id===o.kid);
      const ongoing = todayStr>=o.date && todayStr<=(o.dateEnd||o.date);
      let when;
      if(ongoing){
        when = 'идёт';
      } else {
        const d = daysBetween(todayStr,o.date);
        when = d===0?'сегодня':d===1?'завтра':'через '+d+' '+dayWord(d);
      }
      return `<div class="ob-row">🏆 <b>${escapeHtml(o.text)}</b> — ${kid?kid.name:''}, ${when}</div>`;
    }).join('')}</div>`;
  }

  function reminderBannerHtml(){
    const list = upcomingReminders();
    if(list.length===0) return '';
    const todayStr = iso(startOfDay(new Date()));
    return `<div class="reminder-banner">${list.map(r=>{
      const kidLabel = r.kid==='both' ? 'обоим' : (KIDS.find(k=>k.id===r.kid)||{}).name;
      const ongoing = todayStr>=r.date && todayStr<=(r.dateEnd||r.date);
      let when;
      if(ongoing){
        when = 'идёт';
      } else {
        const d = daysBetween(todayStr,r.date);
        when = d===0?'сегодня':d===1?'завтра':'через '+d+' '+dayWord(d);
      }
      return `<div class="rb-row">🚩 <b>${escapeHtml(r.text)}</b> — ${kidLabel}, ${when}</div>`;
    }).join('')}</div>`;
  }

  function dayWord(n){
    const n10=n%10, n100=n%100;
    if(n100>=11&&n100<=14) return 'дней';
    if(n10===1) return 'день';
    if(n10>=2&&n10<=4) return 'дня';
    return 'дней';
  }

    const ol = olympiadBannerHtml();
    const rem = reminderBannerHtml();
    if(ol && rem) return `<div class="banners-row">${ol}${rem}</div>`;

  }

  function renderCalToggleRow(){
    if(calendarsData.length===0) return '';
    return `<div class="cal-toggle-row">${calendarsData.map(c=>`
      <label><input type="checkbox" data-caltoggle="${c.id}" ${c.hidden?'':'checked'}><span class="cal-swatch" style="background:${c.color}"></span>${escapeHtml(c.name)}</label>`).join('')}
    </div>`;
  }

  function rangeLabel(){
    if(state.view==='day'){
      return DOW_FULL[state.date.getDay()]+', '+state.date.getDate()+' '+MONTHS_GEN[state.date.getMonth()]+' '+state.date.getFullYear();
    }
    if(state.view==='week'){
      const mon = mondayOf(state.date), fri = addDays(mon,4);
      const sameMonth = mon.getMonth()===fri.getMonth();
      return mon.getDate()+(sameMonth?'':' '+MONTHS_GEN[mon.getMonth()])+' – '+fri.getDate()+' '+MONTHS_GEN[fri.getMonth()]+' '+fri.getFullYear();
    }
    return MONTHS[state.date.getMonth()]+' '+state.date.getFullYear();
  }

  function dayBannersHtml(dateStr){
    let out='';
    KIDS.forEach(k=>{ const h=isInHoliday(k.id,dateStr); if(h) out += `<div class="banner holiday">🏖 ${escapeHtml(k.name)} — ${escapeHtml(h.summary)}</div>`; icsInfoEventsFor(k.id,dateStr).forEach(a=> out += `<div class="banner">📋 ${escapeHtml(k.name)} — ${escapeHtml(a.summary)}</div>`); });
    remindersData.filter(r=>remOccursOn(r,dateStr) && r.type!=='olympiad').forEach(r=>{
      const kidLabel = r.kid==='both'?'обоим':(KIDS.find(k=>k.id===r.kid)||{}).name;
      out += `<div class="banner">🚩 ${escapeHtml(r.text)} <span style="opacity:.7">(${kidLabel})</span></div>`;
    });
    remindersData.filter(r=>remOccursOn(r,dateStr) && r.type==='olympiad').forEach(r=>{
      const kid = KIDS.find(k=>k.id===r.kid);
      out += `<div class="banner olympiad">🏆 ${escapeHtml(r.text)} — ${kid?kid.name:''}</div>`;
    });
    return out;
  }

  function dayBannersHtmlPlain(dateStr){
    let parts = [];
    KIDS.forEach(k=>{ const h=isInHoliday(k.id,dateStr); if(h) parts.push('🏖 '+k.name+' — '+h.summary); icsInfoEventsFor(k.id,dateStr).forEach(a=> parts.push('📋 '+k.name+' — '+a.summary)); });
    remindersData.filter(r=>remOccursOn(r,dateStr) && r.type!=='olympiad').forEach(r=>{
      const kidLabel = r.kid==='both'?'обоим':(KIDS.find(k=>k.id===r.kid)||{}).name;
      parts.push('🚩 '+r.text+' ('+kidLabel+')');
    });
    remindersData.filter(r=>remOccursOn(r,dateStr) && r.type==='olympiad').forEach(r=>{
      const kid = KIDS.find(k=>k.id===r.kid);
      parts.push('🏆 '+r.text+' — '+(kid?kid.name:''));
    });
    return parts.map(escapeHtml).join(' · ');
  }

  // first lesson of the given subject for a kid on a date (start time) — a grade that was
  // entered on the "Оценки" tab with just a date is shown on that lesson in the schedule
  function firstLessonStartFor(kid, subject, dateStr){
    const sj = (subject||'').trim();
    const starts = [];
    (lessonsByKidDate[kid][dateStr]||[]).forEach(l=>{ if((resolvedSubject(kid,dateStr,l.start)||'').trim()===sj) starts.push(l.start); });
    customLessonsFor(kid,dateStr).forEach(c=>{ if((c.subject||'').trim()===sj) starts.push(c.start); });
    calOccurrencesForDate(dateStr).forEach(o=>{
      if(o.kid!==kid || (o.subject||'').trim()!==sj) return;
      const cal = calendarsData.find(c=>c.id===o.calendarId);
      if(isLyceumCalendarForKid(cal, kid)) starts.push(o.start);
    });
    starts.sort();
    return starts.length ? starts[0] : null;
  }
  function gradeBelongsToLesson(g, kid, subject, dateStr, start){
    if(!g.date || g.date!==dateStr) return false;
    if(g.start) return g.start===start;
    return firstLessonStartFor(kid, subject, dateStr)===start;
  }

  // grades entered from the schedule for one lesson, as small badges, e.g. [5/4²]
  function lessonGradeBadgesHtml(kid, subject, dateStr, start){
    if(!KIDS.some(k=>k.id===kid)) return '';
    const sj = (subject||'').trim();
    if(!sj || !gradesData[kid] || !gradesData[kid][sj]) return '';
    let out = '';
    [1,2,3].forEach(tri=>{
      gradesFor(kid, sj, tri).forEach(g=>{
        if(!gradeBelongsToLesson(g, kid, sj, dateStr, start)) return;
        const w = Number(g.weight)||1;
        out += `<span class="sg ${g.noCount?'nocount':''}" title="Оценка: ${escAttr(gradeLabel(g))}, коэффициент ${w}${g.noCount?' · не учитывается в триместровой':''}">${escapeHtml(gradeLabel(g))}${w!==1?`<sup>${w}</sup>`:''}</span>`;
      });
    });
    return out;
  }

  function gradesWrapHtml(cls, badges){ return badges ? `<span class="${cls}">${badges}</span>` : ''; }

  function lessonCellHtml(kid, dateStr, lesson){
    if(!lesson) return `<td class="cell-empty">—</td>`;
    const subj = resolvedSubject(kid, dateStr, lesson.start);
    const hw = homeworkData[keyOf(kid,dateStr,lesson.start)];
    const flag = hwHasContent(hw) ? (hw.done?'✅':'📝') : '';
    return `<td>
      <div class="cell-lesson ${kid}" data-lesson="${kid}|${dateStr}|${lesson.start}|${lesson.end}">
        <span class="cell-subject">${escapeHtml(subj)}</span>
        ${gradesWrapHtml('cell-grades', lessonGradeBadgesHtml(kid,subj,dateStr,lesson.start))}
        ${flag?`<span class="cell-hw">${flag}</span>`:''}
      </div>
    </td>`;
  }

  function dayCombinedCellHtml(kid, dateStr, oldLesson, calList){
    if(oldLesson) return lessonCellHtml(kid, dateStr, oldLesson);
    if(calList && calList.length){
      return `<td>${calList.map(o=>{
        const hw = homeworkData[resolveHwKey(o.calendarId,o.ruleId,dateStr,o.start)];
        const flag = hwHasContent(hw) ? (hw.done?'✅':'📝') : '';
        return `<div class="cell-lesson" style="border-left:3px solid ${o.color};" data-callesson="${o.calendarId}|${dateStr}|${o.start}|${o.end}">
          <span class="cell-subject">${escapeHtml(o.subject)}</span>
          ${gradesWrapHtml('cell-grades', lessonGradeBadgesHtml(o.kid,o.subject,dateStr,o.start))}
          ${flag?`<span class="cell-hw">${flag}</span>`:''}
        </div>`;
      }).join('')}</td>`;
    }
    return `<td class="cell-empty">—</td>`;
  }

  function weekCombinedCellHtml(kid, dateStr, oldLesson, calList){
    if(oldLesson){
      const subj = resolvedSubject(kid, dateStr, oldLesson.start);
      const hw = homeworkData[keyOf(kid,dateStr,oldLesson.start)];
      const flag = hwHasContent(hw) ? (hw.done?' ✅':' 📝') : '';
      return `<span class="wd-cell ${kid}" data-lesson="${kid}|${dateStr}|${oldLesson.start}|${oldLesson.end}"><span class="wd-name">${escapeHtml(subj)}${flag}</span>${gradesWrapHtml('wd-grades', lessonGradeBadgesHtml(kid,subj,dateStr,oldLesson.start))}</span>`;
    }
    if(calList && calList.length){
      const items = calList.map(o=>{
        const hw = homeworkData[resolveHwKey(o.calendarId,o.ruleId,dateStr,o.start)];
        const flag = hwHasContent(hw) ? (hw.done?' ✅':' 📝') : '';
        return `<span class="wd-cell" style="background:${o.color}22;color:${o.color};" data-callesson="${o.calendarId}|${dateStr}|${o.start}|${o.end}"><span class="wd-name">${escapeHtml(o.subject)}${flag}</span>${gradesWrapHtml('wd-grades', lessonGradeBadgesHtml(o.kid,o.subject,dateStr,o.start))}</span>`;
      }).join('');
      return calList.length>1 ? `<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">${items}</div>` : items;
    }
    return `<span class="wd-cell empty">—</span>`;
  }

  // ---------- schedule on a real-clock scale ----------
  // The day/week views keep their usual look, but every lesson is placed by its start time and
  // stretched to its real duration over an hour grid (the "clock" underlay), so a two-hour
  // extra class visibly takes two hours.
  const TS_PPH = {week:48, day:58}; // pixels per hour
  function durLabel(mins){
    if(mins<60) return mins+' мин';
    const h = Math.floor(mins/60), m = mins%60;
    return h+' ч'+(m?' '+m+' мин':'');
  }
  // time is shown only for classes set to "Точное время"; lessons set "По номеру урока" show no time
  function isExactTime(timeMode, start, end){
    if(timeMode==='custom') return true;
    if(timeMode==='lesson') return false;
    return !LESSON_TIMES.some(l=>l.start===start && l.end===end); // older rules without a mode: guess by the time
  }
  function timelineEventsFor(kid, dateStr){
    const out = [];
    combinedRowsForDate(dateStr).forEach(r=>{
      const old = (r.old||{})[kid] || null;
      const cals = (r.cal||{})[kid] || [];
      if(old){
        out.push({kid, start:old.start, end:old.end||'', subject:resolvedSubject(kid, dateStr, old.start), color:null,
          exact: !!findCustomLesson(kid, dateStr, old.start), // one-off extra classes have a set time; school lessons go by number
          attr:`data-lesson="${kid}|${dateStr}|${old.start}|${old.end}"`,
          hw:homeworkData[keyOf(kid,dateStr,old.start)], gradeKid:kid});
      }
      cals.forEach(o=>{
        out.push({kid, start:o.start, end:o.end||'', subject:o.subject, color:o.color,
          exact: isExactTime(o.timeMode, o.start, o.end),
          attr:`data-callesson="${o.calendarId}|${dateStr}|${o.start}|${o.end}"`,
          hw:homeworkData[resolveHwKey(o.calendarId,o.ruleId,dateStr,o.start)], gradeKid:o.kid});
      });
    });
    out.forEach(ev=>{
      ev.s = toMin(ev.start);
      ev.num = ev.exact ? null : ((LESSON_TIMES.find(l=>l.start===ev.start)||{}).n || null);
      ev.e = (ev.end && toMin(ev.end)>ev.s) ? toMin(ev.end) : ev.s+60; // no end time -> drawn as one hour
    });
    return out;
  }
  // events that overlap in time sit side by side inside one lane
  function assignLanes(events){
    events.sort((a,b)=>a.s-b.s||b.e-a.e);
    const clusters = []; let cur = [], curEnd = -1;
    events.forEach(ev=>{
      if(cur.length && ev.s>=curEnd){ clusters.push(cur); cur = []; curEnd = -1; }
      cur.push(ev); curEnd = Math.max(curEnd, ev.e);
    });
    if(cur.length) clusters.push(cur);
    clusters.forEach(cl=>{
      const laneEnds = [];
      cl.forEach(ev=>{
        let l = laneEnds.findIndex(e=>e<=ev.s);
        if(l<0){ l = laneEnds.length; laneEnds.push(ev.e); } else laneEnds[l] = ev.e;
        ev.lane = l;
      });
      cl.forEach(ev=>{ ev.lanes = laneEnds.length; });
    });
  }
  // columns actually drawn: only people who have at least one visible event in the shown period,
  // so hiding a calendar (or having no lessons) lets the remaining columns take the freed width
  let shownKids = [];
  function pickShownKids(evList){
    const f = KIDS.filter(k=>evList.some(ev=>(ev[k.id]||[]).length));
    shownKids = f.length ? f : KIDS.slice();
  }
  function tsEventsFor(dateStr){
    const ev = {};
    KIDS.forEach(k=>{ ev[k.id] = timelineEventsFor(k.id,dateStr); assignLanes(ev[k.id]); });
    return ev;
  }
  // visible hours: at least 08:00–16:00, widened to fit every lesson shown
  function tsRange(evList){
    let minS = 8*60, maxE = 16*60;
    evList.forEach(ev=>KIDS.forEach(k=>(ev[k.id]||[]).forEach(e=>{ minS = Math.min(minS,e.s); maxE = Math.max(maxE,e.e); })));
    return {startH:Math.max(0,Math.floor(minS/60)), endH:Math.min(24,Math.ceil(maxE/60))};
  }
  function tsBlockHtml(ev, dateStr, startH, pph, mode){
    const dur = ev.e-ev.s;
    const timeTxt = ev.start + (ev.end?'–'+ev.end:'');
    const flag = hwHasContent(ev.hw) ? (ev.hw.done?'✅':'📝') : '';
    const badges = lessonGradeBadgesHtml(ev.gradeKid, ev.subject, dateStr, ev.start);
    const title = ev.exact
      ? `${ev.subject} · ${timeTxt}${ev.end?' ('+durLabel(dur)+')':''}`
      : `${ev.subject}${ev.num?' · '+ev.num+' урок':''}`;
    // geometry is expressed through --pph, so the whole scale can be stretched later to fit the text
    const pos = `top:calc(var(--pph) * ${(ev.s - startH*60)/60});height:max(20px, calc(var(--pph) * ${dur/60} - 2px));left:calc(${ev.lane}*100%/${ev.lanes});width:calc(100%/${ev.lanes} - 3px);`;
    const timeEl = (ev.exact && ev.end) ? `<span class="ts-t">${escapeHtml(timeTxt)}</span>` : '';
    const gradesEl = badges ? `<span class="ts-grades">${badges}</span>` : '';
    const hwEl = flag ? `<span class="ts-hw" title="${flag==='✅'?'Домашнее задание выполнено':'Есть домашнее задание'}">${flag}</span>` : '';
    // opaque base under the tint, so the hour lines never show through a lesson block
    const tint = ev.color ? `background:color-mix(in srgb, ${ev.color} 30%, #fbf8ee);` : '';
    if(mode==='day'){
      const colorStyle = ev.color ? `${tint}border-left-color:${ev.color};` : `background:var(--${ev.kid}-soft);`;
      return `<div class="cell-lesson ts-ev ${ev.color?'':ev.kid}" ${ev.attr} data-dur="${dur}" title="${escAttr(title)}" style="${pos}${colorStyle}">
        <div class="ts-top"><span class="cell-subject">${escapeHtml(ev.subject)}</span></div>
        ${hwEl}${gradesEl}${timeEl}
      </div>`;
    }
    const colorStyle = ev.color ? `${tint}color:#141414;` : '';
    return `<span class="wd-cell ts-ev ${ev.color?'':ev.kid}" ${ev.attr} data-dur="${dur}" title="${escAttr(title)}" style="${pos}${colorStyle}">
      <span class="wd-name">${escapeHtml(ev.subject)}</span>${hwEl}${gradesEl}${timeEl}
    </span>`;
  }
  function tsBodyHtml(ev, dateStr, startH, endH, pph, mode){
    const hours = Math.max(1, endH-startH);
    let labels = '';
    for(let h=0; h<=hours; h++){
      labels += `<div class="ts-hlabel" style="top:calc(var(--pph) * ${h});${h===0?'transform:none;':''}">${pad2(startH+h)}:00</div>`;
    }
    let now = '';
    if(dateStr===iso(startOfDay(new Date()))){
      const d = new Date(); const nm = d.getHours()*60+d.getMinutes();
      if(nm>=startH*60 && nm<=endH*60) now = `<div class="ts-now" style="top:calc(var(--pph) * ${(nm-startH*60)/60});"></div>`;
    }
    return `<div class="ts-body ${mode}" data-basepph="${pph}" style="--pph:${pph}px;height:calc(var(--pph) * ${hours});">
      <div class="ts-gutter">${labels}</div>
      <div class="ts-lanes">${shownKids.map(k=>`<div class="ts-lane">${(ev[k.id]||[]).map(e=>tsBlockHtml(e,dateStr,startH,pph,mode)).join('')}</div>`).join('')}</div>
      ${now}
    </div>`;
  }
  // after the schedule is drawn: (1) give every day the same height of the reminders strip so
  // the hour lines line up across all days of the week; (2) stretch the hour scale (the same
  // for every day) until every lesson block holds its full text, homework mark and grades
  function fitTimeScale(){
    const bodies = app.querySelectorAll('.ts-body');
    if(!bodies.length) return;
    const boxes = app.querySelectorAll('.wd-flagbox');
    if(boxes.length){
      boxes.forEach(b=>{ b.style.minHeight = ''; });
      let mh = 0; boxes.forEach(b=>{ mh = Math.max(mh, b.offsetHeight); });
      boxes.forEach(b=>{ b.style.minHeight = mh+'px'; });
    }
    const base = parseFloat(bodies[0].dataset.basepph) || 72;
    bodies.forEach(b=>b.style.setProperty('--pph', base+'px'));
    let need = base;
    app.querySelectorAll('.ts-ev').forEach(el=>{
      if(el.scrollHeight <= el.clientHeight+1) return;
      const dur = parseFloat(el.dataset.dur) || 60;
      need = Math.max(need, (el.scrollHeight+3)*60/dur);
    });
    need = Math.min(need, base*2.6);
    if(need > base+0.5) bodies.forEach(b=>b.style.setProperty('--pph', need+'px'));
  }
  window.addEventListener('resize', ()=>{ if(state.tab==='schedule') fitTimeScale(); });

  function renderDayView(){
    const dateStr = iso(state.date);
    const ev = tsEventsFor(dateStr);
    pickShownKids([ev]);
    let body = dayBannersHtml(dateStr);
    if(!KIDS.some(k=>(ev[k.id]||[]).length)){
      body += `<div class="empty-state">Уроков нет</div>`;
    } else {
      const {startH,endH} = tsRange([ev]);
      body += `<div class="ts-head"><span class="g"></span>${shownKids.map(k=>`<span class="k" style="color:${k.hex};">${escapeHtml(k.name)}</span>`).join('')}</div>`;
      body += tsBodyHtml(ev, dateStr, startH, endH, TS_PPH.day, 'day');
    }
    body += `<button class="btn secondary" style="margin-top:10px;" data-addlesson="${dateStr}">+ Добавить занятие</button>`;
    return `<div class="day-card">${body}</div>`;
  }

  function renderWeekView(){
    const mon = mondayOf(state.date);
    const days = [0,1,2,3,4,5,6].map(i=>addDays(mon,i));
    const todayStr = iso(startOfDay(new Date()));
    const dayBannerLines = days.map(d=>{
      const dateStr = iso(d);
      const holAny = KIDS.some(k=>isInHoliday(k.id,dateStr));
      const rems = remindersData.filter(r=>remOccursOn(r,dateStr));
      let lines = [];
      if(holAny) lines.push('🏖 каникулы');
      rems.forEach(r=> lines.push((r.type==='olympiad'?'🏆 ':'🚩 ')+r.text));
      return lines;
    });
    const evs = days.map(d=>tsEventsFor(iso(d)));
    pickShownKids(evs);
    const {startH,endH} = tsRange(evs);
    return `<div class="week-row">${days.map((d,idx)=>{
      const dateStr = iso(d);
      const lines = dayBannerLines[idx];
      let inner = `<div class="wd-flagbox">${lines.map(text=>`<div class="wd-flags">${escapeHtml(text)}</div>`).join('')}</div>`;
      inner += tsBodyHtml(evs[idx], dateStr, startH, endH, TS_PPH.week, 'week');
      inner += `<button class="wd-add" data-addlesson="${dateStr}">+ занятие</button>`;
      return `<div class="week-daycard">
        <div class="wd-head ${dateStr===todayStr?'today':''}">${DOW[d.getDay()]}, ${d.getDate()}</div>
        <div class="wd-period" style="border-bottom:none;padding:0 0 4px;">
          <div class="wd-ptime"></div>
          <div class="wd-pair" style="font-size:10px;font-weight:700;">
            ${shownKids.map(k=>`<span style="flex:1;color:${k.hex};text-align:center;">${escapeHtml(k.name)}</span>`).join('')}
          </div>
        </div>
        ${inner}
      </div>`;
    }).join('')}</div>`;
  }

  function renderMonthView(){
    const first = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
    const gridStart = mondayOf(first);
    const todayStr = iso(startOfDay(new Date()));
    const cells = [];
    for(let i=0;i<42;i++) cells.push(addDays(gridStart,i));
    while(cells.length>35 && cells[cells.length-7].getMonth()!==state.date.getMonth()){
      cells.splice(cells.length-7,7);
    }
    const dow = DOW.slice(1).concat(DOW[0]).map(d=>`<div class="month-dow">${d}</div>`).join('');
    const body = cells.map(d=>{
      const dateStr = iso(d);
      const inMonth = d.getMonth()===state.date.getMonth();
      const hol = KIDS.some(k=>isInHoliday(k.id,dateStr));
      const rems = remindersData.filter(r=>remOccursOn(r,dateStr));
      const olymp = rems.some(r=>r.type==='olympiad');
      const remind = rems.some(r=>r.type!=='olympiad');
      const calOcc = calOccurrencesForDate(dateStr);
      const calByCal = {};
      calOcc.forEach(o=>{ (calByCal[o.calendarId]=calByCal[o.calendarId]||[]).push(o); });
      let cls='month-cell';
      if(!inMonth) cls+=' other';
      if(dateStr===todayStr) cls+=' today';
      if(hol) cls+=' holiday';
      return `<div class="${cls}" data-day="${dateStr}">
        <div class="mc-flags">${olymp?'🏆':''}${remind?'🚩':''}</div>
        <div class="mc-date">${d.getDate()}</div>
        ${KIDS.map(k=>{ const n=(lessonsByKidDate[k.id][dateStr]||[]).length+customLessonsFor(k.id,dateStr).length; return n?`<div class="mc-line ${k.id}"><span class="kid-badge ${k.id}" style="width:13px;height:13px;font-size:8px;">${k.initial}</span>${n}${dayHasPendingHw(k.id,dateStr)?' 📝':''}</div>`:''; }).join('')}
        ${Object.keys(calByCal).map(cid=>{
          const cal = calendarsData.find(c=>c.id===cid);
          return `<div class="mc-line" style="color:${cal?cal.color:'#888'}"><span class="cal-swatch" style="width:9px;height:9px;background:${cal?cal.color:'#888'}"></span>${calByCal[cid].length} ${escapeHtml(cal?cal.name:'')}</div>`;
        }).join('')}
      </div>`;
    }).join('');
    return `<div class="day-card"><div class="month-grid">${dow}${body}</div></div>`;
  }

  // ---- schedule settings tab (calendars + recurring lesson rules) ----
  function renderCalSettingsTab(){
    let out = `<div class="section-title">Календари</div>
    <div class="reminder-form">
      <div class="field" style="flex:1;"><label>Название календаря</label><input type="text" id="cal-name" placeholder="Например: Доп.занятия_Петя"></div>
      <div class="field"><label>Цвет</label><input type="color" id="cal-color" value="#2e5a88" style="width:52px;padding:2px;height:36px;"></div>
      <div class="field"><label>Кому</label><select id="cal-kid">
        ${KIDS.map(k=>`<option value="${k.id}">${k.name}</option>`).join('')}
        <option value="both">Обоим</option>
      </select></div>
      <div class="field"><label>Окончание периодичности по умолчанию</label><input type="date" id="cal-defuntil"></div>
      <button class="btn" id="cal-add">Добавить календарь</button>
      <div class="spacer"></div>
      <button class="btn secondary" id="cal-reset-all" style="color:#a33;">Удалить все календари и уроки</button>
    </div>`;

    if(calendarsData.length===0){
      out += `<div class="empty-state">Календарей пока нет. Добавьте первый, например «Лицей_Петя».</div>`;
    } else {

  // ---- grades tab ----
  function encSubj(s){ return encodeURIComponent(s); }
  function decSubj(s){ return decodeURIComponent(s); }

  function renderGradesTab(){
    const allSubjects = subjectsForKid(gradesKid);
    const excluded = excludedSubjectsData[gradesKid] || [];
    const subjects = allSubjects.filter(s=>!excluded.includes(s));
    let out = `<div class="grades-toolbar">

`;
