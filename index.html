<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник — Петя и Федя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#f7f2e6;
    --paper-line:#ded2b4;
    --margin:#b6483f;
    --ink:#26313d;
    --ink-soft:#647184;
    --card:#fffdf8;
    --petya:#2e5a88;
    --petya-soft:#e4edf6;
    --fedya:#3f7a4c;
    --fedya-soft:#e8f2e9;
    --warn:#b6483f;
    --warn-soft:#f7e6e3;
    --done:#4b8b5b;
    --done-soft:#e6f1e8;
    --gold:#a9761e;
    --gold-soft:#f6ecd8;
    --radius:10px;
    --shadow:0 1px 2px rgba(38,49,61,.08), 0 4px 14px rgba(38,49,61,.06);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 30px, var(--paper-line) 30px 31px);
    color:var(--ink);
    font-family:'PT Sans', system-ui, sans-serif;
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
    overflow-x:hidden;
    padding-left:26px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    top:0; bottom:0; left:22px;
    width:2px;
    background:var(--margin);
    opacity:.55;
  }
  h1,h2,h3,.kid-name,.day-name{font-family:'PT Serif', Georgia, serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  header.top h1{font-size:26px;margin:0;font-weight:700;color:var(--ink);}
  header.top .subtitle{color:var(--ink-soft);font-size:13.5px;}

  nav.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--paper-line);}
  nav.tabs button{
    font-family:'PT Serif', serif;
    font-size:15px;
    background:transparent;
    border:none;
    padding:9px 18px 10px;
    cursor:pointer;
    color:var(--ink-soft);
    border-radius:8px 8px 0 0;
    position:relative;
    top:2px;
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    font-weight:700;
    border:2px solid var(--paper-line);
    border-bottom:2px solid var(--card);
  }

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .seg{display:flex;background:var(--card);border:1px solid var(--paper-line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .seg button{border:none;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--ink-soft);font-family:inherit;}
  .seg button.active{background:var(--ink);color:var(--paper);}
  .navbtns{display:flex;align-items:center;gap:4px;}
  .navbtns button{border:1px solid var(--paper-line);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--ink);box-shadow:var(--shadow);}
  .navbtns .today{width:auto;padding:0 14px;font-family:'PT Sans';font-size:13.5px;}
  .range-label{font-family:'PT Serif',serif;font-size:17px;font-weight:700;margin-left:4px;}
  .spacer{flex:1;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;padding:8px 12px;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;}
  .legend .litem{display:flex;align-items:center;gap:5px;}
  .kid-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;flex:none;}
  .kid-badge.petya{background:var(--petya);}
  .kid-badge.fedya{background:var(--fedya);}

  .banners-row{display:flex;gap:14px;align-items:stretch;margin-bottom:14px;}
  .banners-row .olympiad-banner, .banners-row .reminder-banner{flex:1;min-width:0;margin-bottom:0;}
  .olympiad-banner{background:var(--gold-soft);border:1px solid var(--gold);color:#7a5613;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;}
  .olympiad-banner .ob-row{display:flex;gap:8px;align-items:center;}
  .reminder-banner{background:#fdece4;border:1px solid #e08a5e;color:#8a3f14;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;}
  .reminder-banner .rb-row{display:flex;gap:8px;align-items:center;}
  .warn-banner{background:#fff3cd;border:1px solid #e0c46c;color:#6b5215;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  /* homework file attachments */
  .m-files-list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px;}
  .m-file-chip{display:flex;align-items:center;gap:5px;background:#f3f3ec;border:1px solid var(--paper-line);border-radius:6px;padding:3px 6px;font-size:11px;max-width:170px;}
  .m-file-chip img{width:20px;height:20px;object-fit:cover;border-radius:3px;flex:none;}
  .m-file-chip .m-file-icon{font-size:14px;}
  .m-file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px;}
  .m-file-del{border:none;background:none;cursor:pointer;color:#a33;font-size:12px;padding:0;line-height:1;}
  .m-file-attach-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--paper-line);border-radius:7px;padding:6px 10px;margin-bottom:8px;}
  .m-lib-pick{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
  .m-lib-pick select{flex:1;min-width:0;font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--paper-line);border-radius:7px;background:#fff;color:var(--ink);}

  /* library tab */
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:8px;}
  .lib-card{position:relative;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;padding:8px;box-shadow:var(--shadow);}
  .lib-preview{display:block;text-decoration:none;color:inherit;}
  .lib-preview img{width:100%;height:90px;object-fit:cover;border-radius:6px;display:block;}
  .lib-file-icon{width:100%;height:90px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#f3f3ec;border-radius:6px;}
  .lib-name{font-size:11.5px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-sub{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .lib-card .rdel{position:absolute;top:4px;right:4px;}

  .banner{background:var(--warn-soft);color:var(--margin);border:1px dashed var(--margin);border-radius:8px;padding:7px 11px;font-size:13px;margin-bottom:8px;}
  .banner.holiday{background:#eef2e4;color:#5c6b3f;border-color:#8a9a5b;}
  .banner.olympiad{background:var(--gold-soft);color:#7a5613;border-color:var(--gold);}

  /* day table (merged Petya/Fedya by period) */
  .day-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;}
  .day-card .dc-head{font-size:17px;font-weight:700;margin-bottom:2px;}
  .day-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .day-table th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--paper-line);}
  .day-table th.col-petya{color:var(--petya);}
  .day-table th.col-fedya{color:var(--fedya);}
  .day-table td{padding:5px 8px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  .day-table td.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;width:88px;}
  .cell-lesson{cursor:pointer;border-radius:7px;padding:6px 9px;border:1px solid transparent;}
  .cell-lesson:hover{background:rgba(0,0,0,.035);}
  .cell-lesson.petya{border-left:3px solid var(--petya);}
  .cell-lesson.fedya{border-left:3px solid var(--fedya);}
  .cell-empty{color:var(--paper-line);font-size:12px;padding-left:9px;}
  .cell-subject{font-size:13.5px;}
  .cell-hw{float:right;font-size:13px;}

  /* week view: 5 mini day-cards in a row */
  .week-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .week-daycard{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;flex:0 0 230px;min-width:230px;}
  .week-daycard .wd-head{font-size:13px;font-weight:700;text-align:center;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--paper-line);}
  .week-daycard .wd-head.today{color:var(--margin);}
  .wd-period{display:flex;gap:6px;align-items:stretch;padding:5px 0;border-bottom:1px dotted var(--paper-line);}
  .wd-period:last-of-type{border-bottom:none;}
  .wd-ptime{flex:0 0 32px;font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:4px;}
  .wd-pair{display:flex;gap:5px;flex:1;min-width:0;}
  .wd-cell{flex:1;min-width:0;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:11.5px;line-height:1.28;white-space:normal;word-break:break-word;box-sizing:border-box;}
  .wd-cell:last-child{margin-bottom:0;}
  .wd-cell.petya{background:var(--petya-soft);color:var(--petya);}
  .wd-cell.fedya{background:var(--fedya-soft);color:var(--fedya);}
  .wd-cell.empty{background:transparent;color:var(--paper-line);cursor:default;font-size:12px;padding:4px 6px;}
  .wd-flags{font-size:11px;margin-top:4px;color:var(--gold);word-break:break-word;}
  .wd-add{display:block;width:100%;text-align:center;background:none;border:1px dashed var(--paper-line);color:var(--ink-soft);border-radius:6px;font-size:11px;padding:5px 0;margin-top:8px;cursor:pointer;font-family:inherit;}
  .wd-add:hover{border-color:var(--ink-soft);color:var(--ink);}

  /* month grid (merged) */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-dow{font-size:11px;text-align:center;color:var(--ink-soft);padding-bottom:4px;}
  .month-cell{min-height:72px;border:1px solid var(--paper-line);border-radius:7px;padding:6px 7px;cursor:pointer;background:#fff;position:relative;}
  .month-cell.other{opacity:.35;}
  .month-cell.today{border-color:var(--margin);border-width:2px;}
  .month-cell.holiday{background:#eef2e4;}
  .month-cell .mc-date{font-size:12px;font-weight:700;}
  .month-cell .mc-line{font-size:10.5px;margin-top:3px;display:flex;align-items:center;gap:3px;}
  .month-cell .mc-line.petya{color:var(--petya);}
  .month-cell .mc-line.fedya{color:var(--fedya);}
  .month-cell .mc-flags{position:absolute;top:4px;right:5px;font-size:11px;display:flex;gap:2px;}

  /* homework tab */
  .filters{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .hw-list{display:flex;flex-direction:column;gap:8px;}
  .hw-item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow);}
  .hw-item.overdue{border-left:4px solid var(--warn);}
  .hw-item.done{opacity:.6;}
  .hw-check{width:20px;height:20px;flex:none;margin-top:2px;cursor:pointer;accent-color:var(--done);}
  .hw-main{flex:1;cursor:pointer;}
  .hw-top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:3px;}
  .kid-tag{font-weight:700;padding:1px 8px;border-radius:999px;font-size:11.5px;}
  .hw-subject{font-weight:700;color:var(--ink);}
  .hw-text{font-size:13.5px;white-space:pre-wrap;}
  .hw-text.done-text{text-decoration:line-through;}
  .empty-state{color:var(--ink-soft);font-style:italic;padding:30px 10px;text-align:center;}

  /* reminders / olympiads tab */
  .section-title{font-size:18px;font-weight:700;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .reminder-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-soft);}
  .field input, .field select{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--paper-line);border-radius:7px;background:#fff;color:var(--ink);}
  .field input[type=text]{min-width:220px;}
  .btn{font-family:'PT Sans';font-size:13.5px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);}
  .btn.secondary{background:transparent;border:1px solid var(--paper-line);color:var(--ink);}
  .btn.danger{background:var(--warn);color:#fff;}
  .btn.gold{background:var(--gold);color:#fff;}

  .reminder-list{display:flex;flex-direction:column;gap:8px;}
  .reminder-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);}
  .reminder-item.past{opacity:.5;}
  .reminder-item.olympiad{border-left:4px solid var(--gold);}
  .reminder-date{font-family:'PT Serif',serif;font-weight:700;font-size:14px;width:110px;flex:none;}
  .reminder-item .rtext{flex:1;font-size:13.5px;}
  .reminder-item .rdel{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:2px 6px;}

  /* grades tab */
  .grades-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .grades-table{width:100%;border-collapse:collapse;}
  .grades-table th{text-align:left;font-family:'PT Serif',serif;font-weight:700;font-size:12.5px;color:var(--ink-soft);padding:0 10px 8px;border-bottom:2px solid var(--paper-line);}
  .grades-table td{padding:9px 10px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  .grades-table tr:last-child td{border-bottom:none;}
  .gt-subject{font-family:'PT Serif',serif;font-weight:700;font-size:14px;white-space:nowrap;}
  .gt-grades{width:100%;}
  .gt-avg{text-align:center;white-space:nowrap;}
  .gt-avg b{font-family:'PT Serif',serif;font-size:16px;color:var(--ink);}
  .gt-need{white-space:nowrap;}
  .gs-need{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:#7a5613;}
  .gs-need.ok{background:var(--done-soft);color:var(--done);}
  .gs-need.none{background:transparent;color:var(--ink-soft);padding:2px 0;}
  .gs-grades{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;}
  /* a single grade shown as "value" with weight as a small superscript exponent, e.g. 4² */
  .gs-grade{position:relative;display:inline-flex;align-items:flex-start;padding:2px 9px 2px 4px;border-radius:6px;}
  .gs-grade:hover{background:var(--paper);}
  .gs-grade input[type=number]{font-family:inherit;border:none;background:transparent;color:var(--ink);padding:0;text-align:center;-moz-appearance:textfield;}
  .gs-grade input[type=number]::-webkit-outer-spin-button,
  .gs-grade input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .gs-grade .gs-val{width:16px;font-weight:700;font-size:16px;border-bottom:1px dotted var(--paper-line);}
  .gs-grade .gs-val:focus{outline:none;border-bottom:1px solid var(--ink);}
  .gs-grade .gs-weight{width:15px;font-size:10px;color:var(--ink-soft);position:relative;top:-5px;margin-left:1px;}
  .gs-grade .gs-weight:focus{outline:none;color:var(--ink);}
  .gs-grade .gs-del{position:absolute;top:-6px;right:-2px;background:var(--ink);color:var(--paper);border:none;border-radius:50%;width:13px;height:13px;line-height:13px;font-size:9px;cursor:pointer;padding:0;opacity:0;transition:opacity .15s;}
  .gs-grade:hover .gs-del{opacity:1;}
  .gs-add-inline{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--paper-line);border-radius:6px;padding:2px 6px;margin-left:2px;}
  .gs-add-inline input[type=number]{font-family:inherit;font-size:13px;border:none;background:transparent;color:var(--ink);padding:0;text-align:center;-moz-appearance:textfield;}
  .gs-add-inline input[type=number]::-webkit-outer-spin-button,
  .gs-add-inline input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .gs-add-inline .gs-add-val{width:18px;font-weight:700;}
  .gs-add-inline .gs-add-x{color:var(--ink-soft);font-size:11px;}
  .gs-add-inline .gs-add-w{width:14px;font-size:11px;color:var(--ink-soft);}
  .gs-add-inline button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;}
  .gs-add-inline button:hover{color:var(--ink);}
  .gs-hint{font-size:11px;color:var(--ink-soft);margin:2px 0 14px;}
  .gt-subdel{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:2px 4px;opacity:.55;}
  .gt-subdel:hover{opacity:1;color:var(--warn);}
  .gs-hidden-subjects{margin-top:14px;padding-top:10px;border-top:1px dashed var(--paper-line);font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .gs-hidden-label{margin-right:2px;}
  .gs-hidden-chip{background:var(--paper);border:1px solid var(--paper-line);border-radius:999px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px;}
  .gs-hidden-chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0;}
  .gs-hidden-chip button:hover{color:var(--ink);}
  .bulk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12.5px;}
  .bulk-bar input[type=date]{font-family:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--paper-line);border-radius:6px;}
  .bulk-count{font-weight:700;}
  .reminder-item .cr-select{margin-right:2px;}
  .overlap-warning{background:#fdecec;border:1px solid #e6b3b3;color:#8a2e2e;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12.5px;}
  .reminder-item.rule-overlap{background:#fdecec;border:1px solid #e6b3b3;border-radius:8px;}
  .dup-warning{background:#fff8ec;border:1px solid #e6cfa3;border-radius:10px;padding:12px 14px;margin-bottom:16px;}
  .dup-warning-title{font-family:'PT Serif',serif;font-weight:700;color:#8a5a13;margin-bottom:4px;}
  .dup-warning-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .dup-pair{background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .dup-pair:last-child{margin-bottom:0;}
  .dup-pair-head{font-weight:700;font-size:13px;margin-bottom:8px;}
  .dup-options{display:flex;gap:10px;flex-wrap:wrap;}
  .dup-option{flex:1 1 240px;background:var(--paper);border:1px solid var(--paper-line);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;}
  .dup-option-text{font-size:13px;}
  .flag-icon{color:var(--margin);}
  .countdown{font-size:11.5px;color:var(--gold);font-weight:700;}

  /* calendars (schedule settings) */
  .cal-swatch{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;vertical-align:middle;}
  .cal-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .cal-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);flex-wrap:wrap;}
  .weekday-picker{display:flex;gap:6px;flex-wrap:wrap;}
  .weekday-picker label{font-size:12px;display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--paper-line);border-radius:6px;padding:3px 7px;cursor:pointer;}
  .cal-toggle-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;margin-bottom:14px;padding:8px 12px;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;}
  .cal-toggle-row label{display:flex;align-items:center;gap:6px;cursor:pointer;}

  /* modal */

  /* week: one outer table, 7 day-cells, no border on the wrapper itself */

  #print-area table.p-week-outer > tbody > tr > td{border:none;padding:0 3px;vertical-align:top;width:14.28%;}

  #print-area table.p-week-outer table th,
  #print-area table.p-week-outer table td{font-size:8.7px;padding:2px 3px;}

  /* unified schedule table: fixed 1–8 lyceum rows + gap + fixed 16:00–21:00 rows,
     identical structure for every day and kid so nothing ends up lopsided */

  #print-area table.p-unified td.p-time{white-space:nowrap;font-variant-numeric:tabular-nums;color:#444;}
  #print-area table.p-unified td.p-empty{color:#bbb;text-align:center;}
  #print-area table.p-unified tr.p-gap td{border:none;padding:3px 0;}
  #print-area .p-subj{font-weight:600;}
  #print-area .p-time-sub{display:block;font-size:9px;color:#777;font-weight:400;}

  @media print{
    @page{ size: landscape; margin: 12mm; }

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:480px;}

    /* tabs: horizontal swipe strip instead of wrapping/overflowing off-screen */
    nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -10px 14px;padding:0 10px 4px;}
    nav.tabs::-webkit-scrollbar{height:0;}

    .toolbar{gap:8px;margin-bottom:10px;}

    .navbtns .today{padding:0 12px;}
    .range-label{font-size:14.5px;width:100%;order:3;margin:2px 0 0;}
    #print-schedule{width:100%;order:4;}

    /* month grid: keep 7 columns but tighten everything and truncate long lines */

    .month-cell .mc-date{font-size:11px;}

    /* forms: one field per row, full width inputs */

    .field{width:100%;}
    .field input[type=text],.field input[type=date],.field select,.field input[type=number]{width:100%;min-width:0;}
    .m-lib-pick{flex-wrap:wrap;}

    /* grades: table scrolls sideways instead of squeezing illegibly */

<body>
<div class="wrap" id="app">
  <div class="loading">Загрузка дневника…</div>
</div>
<div id="print-area"></div>

<script id="schedule-data" type="application/json">{"petya":{"lessons":[],"allday":[]},"fedya":{"lessons":[],"allday":[]}}</script>
<script>
(function(){
  "use strict";
  const RAW = JSON.parse(document.getElementById('schedule-data').textContent);
  const KIDS = [
    {id:'petya', name:'Петя', initial:'П', hex:'#2e5a88', soft:'#e4edf6'},
    {id:'fedya', name:'Федя', initial:'Ф', hex:'#3f7a4c', soft:'#e8f2e9'}
  ];
  const OLYMPIAD_LEAD_DAYS = 14;
  const REMINDER_LEAD_DAYS = 7;

  // ---------- index data ----------
  const lessonsByKidDate = {petya:{}, fedya:{}};
  const alldayByKid = {petya:[], fedya:[]};
  KIDS.forEach(k=>{
    RAW[k.id].lessons.forEach(([date,start,end,subject])=>{
      (lessonsByKidDate[k.id][date] = lessonsByKidDate[k.id][date] || []).push({start,end,subject});
    });
    RAW[k.id].allday.forEach(([start,end,summary])=>{
      alldayByKid[k.id].push({start,end,summary});
    });
  });

  // ---------- state ----------
  let state = {tab:'schedule', view:'week', date: startOfDay(new Date())};
  let homeworkData = {};
  let remindersData = []; // {id,type:'reminder'|'olympiad', date, kid:'both'|'petya'|'fedya', text}
  let overridesData = {}; // key -> {subject}  (a single date only)
  let recurringOverridesData = []; // {id, kid, weekday(0-6), start, subject, fromDate} — applies from fromDate onward, every week
  let vacationsData = []; // {id, start, end (inclusive), kid:'both'|'petya'|'fedya', text}
  let customLessonsData = []; // {id, kid, date, start, end, subject}
  let calendarsData = []; // {id, name, color, hidden}
  let calRulesData = []; // {id, calendarId, subject, date, start, end, repeat:'none'|'daily'|'weekly'|'weekdays', weekdays:[0-6], until}
  let calSelectedId = null; // which calendar is expanded in settings tab
  let calRuleEditId = null; // rule currently being edited in settings tab
  let gradesData = {}; // gradesData[kid][subject][trimester] = [{id,value,weight}]
  let gradesKid = 'petya';
  let gradesTri = 1;
  let documentsData = []; // {id,title,category,note,files:[],createdAt}
  let docFilterCat = 'all';
  let docDraft = {files:[]}; // staged files for the "add document" form
  let linksData = []; // {id,title,url,note,createdAt}
  let excludedSubjectsData = {petya:[], fedya:[]}; // subjects hidden from grading per kid
  let fileLibraryData = []; // persistent registry of every uploaded homework file, independent of which homework entry currently references it
  let selectedRuleIds = new Set(); // multi-selected calendar rule ids in "Настройка расписания" for bulk edits
  let storageReady = false;

  // ---------- helpers ----------
  function startOfDay(d){const n=new Date(d);n.setHours(0,0,0,0);return n;}
  function pad2(n){return String(n).padStart(2,'0');}
  function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
  function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
  function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}
  function mondayOf(d){const r=new Date(d);const day=r.getDay();const diff=(day===0?-6:1-day);r.setDate(r.getDate()+diff);return r;}
  function daysBetween(a,b){return Math.round((startOfDay(new Date(b)) - startOfDay(new Date(a)))/86400000);}
  const DOW = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const LESSON_TIMES = [
    {n:1, start:'08:30', end:'09:10'},
    {n:2, start:'09:20', end:'10:00'},
    {n:3, start:'10:15', end:'10:55'},
    {n:4, start:'11:10', end:'11:50'},
    {n:5, start:'12:00', end:'12:40'},
    {n:6, start:'13:00', end:'13:40'},
    {n:7, start:'14:00', end:'14:40'},
    {n:8, start:'15:00', end:'15:40'}
  ];
  const DOW_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  function keyOf(kid,date,start){return kid+'|'+date+'|'+start;}
  function customLessonsFor(kid,date){
    return customLessonsData.filter(c=>c.kid===kid && c.date===date);
  }
  function findCustomLesson(kid,date,start){
    return customLessonsData.find(c=>c.kid===kid && c.date===date && c.start===start);
  }
  function origSubject(kid,date,start){
    const l = (lessonsByKidDate[kid][date]||[]).find(x=>x.start===start);
    return l ? l.subject : null;
  }
  function dowOf(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y,m-1,d).getDay();
  }
  function recurringOverrideFor(kid,dateStr,start){
    const dow = dowOf(dateStr);
    const candidates = recurringOverridesData.filter(r=> r.kid===kid && r.weekday===dow && r.start===start && r.fromDate<=dateStr);
    if(candidates.length===0) return null;
    candidates.sort((a,b)=> b.fromDate.localeCompare(a.fromDate));
    return candidates[0];
  }
  function resolvedSubject(kid,date,start){
    const c = findCustomLesson(kid,date,start);
    if(c) return c.subject;
    const ov = overridesData[keyOf(kid,date,start)];
    if(ov && ov.subject) return ov.subject;
    const rec = recurringOverrideFor(kid,date,start);
    if(rec) return rec.subject;
    return origSubject(kid,date,start) || '';
  }
  function isRealHolidaySummary(s){ return /каникул/i.test(s||''); }
  function icsHolidayFor(kid, dateStr){
    return alldayByKid[kid].find(a=> isRealHolidaySummary(a.summary) && dateStr>=a.start && dateStr<a.end);
  }
  function icsInfoEventsFor(kid, dateStr){
    return alldayByKid[kid].filter(a=> !isRealHolidaySummary(a.summary) && dateStr>=a.start && dateStr<a.end);
  }
  function customVacationFor(kid, dateStr){
    const v = vacationsData.find(v=> (v.kid==='both'||v.kid===kid) && dateStr>=v.start && dateStr<=v.end);
    return v ? {summary: v.text || 'Каникулы'} : null;
  }
  function isInHoliday(kid, dateStr){
    return icsHolidayFor(kid,dateStr) || customVacationFor(kid,dateStr);
  }
  function remOccursOn(r, dateStr){
    if(!(dateStr>=r.date && dateStr<=(r.dateEnd||r.date))) return false;
    // keep the schedule view consistent with the Reminders tab: a completed olympiad
    // hides once its date has passed, and a reminder hides only once it's both
    // overdue AND checked off as done (an unfinished overdue reminder keeps showing,
    // since it may still need doing)
    const todayStr = iso(startOfDay(new Date()));
    if(r.type==='olympiad') return (r.dateEnd||r.date) >= todayStr;
    const past = (r.dateEnd||r.date) < todayStr;
    return !(past && r.done);
  }
  function remindersFor(kid, dateStr, type){
    return remindersData.filter(r=> remOccursOn(r,dateStr) && (type?r.type===type:true) && (r.kid==='both'||r.kid===kid));
  }
  function upcomingOlympiads(){
    const todayStr = iso(startOfDay(new Date()));
    return remindersData
      .filter(r=>r.type==='olympiad' && ((r.date>=todayStr && daysBetween(todayStr,r.date)<=OLYMPIAD_LEAD_DAYS) || remOccursOn(r,todayStr)))
      .sort((a,b)=>a.date.localeCompare(b.date));
  }
  function upcomingReminders(){
    const todayStr = iso(startOfDay(new Date()));
    return remindersData
      .filter(r=>r.type!=='olympiad' && ((r.date>=todayStr && daysBetween(todayStr,r.date)<=REMINDER_LEAD_DAYS) || remOccursOn(r,todayStr)))
      .sort((a,b)=>a.date.localeCompare(b.date));
  }
  // ---------- calendars / recurring rules ----------
  function calRuleMatchesDate(rule, dateStr){
    if(dateStr < rule.date) return false;
    if(rule.until && dateStr > rule.until) return false;
    const dow = dowOf(dateStr);
    if(rule.repeat==='none') return dateStr===rule.date;
    if(rule.repeat==='daily') return true;
    if(rule.repeat==='weekly') return dow===dowOf(rule.date);
    if(rule.repeat==='weekdays') return (rule.weekdays||[]).includes(dow);
    return false;
  }
  function addDaysStr(dateStr, n){ return iso(addDays(new Date(dateStr+'T00:00:00'), n)); }
  // two rules "overlap" if there is at least one real calendar date where BOTH of them
  // would generate a lesson at the same time — this is how a subject ends up saved
  // under two different homework records that look like duplicates of each other.
  function rulesOverlap(r1, r2){
    if(r1.id===r2.id || r1.calendarId!==r2.calendarId || r1.start!==r2.start) return false;
    const FAR = '9999-12-31';
    const r1End = r1.until || FAR, r2End = r2.until || FAR;
    if(r1.date > r2End || r2.date > r1End) return false;
    const rangeStart = r1.date > r2.date ? r1.date : r2.date;
    let rangeEnd = r1End < r2End ? r1End : r2End;
    if(rangeEnd===FAR) rangeEnd = addDaysStr(rangeStart, 60); // bounded scan for open-ended rules
    let d = rangeStart, guard = 0;
    while(d <= rangeEnd && guard < 400){
      if(calRuleMatchesDate(r1,d) && calRuleMatchesDate(r2,d)) return true;
      d = addDaysStr(d,1);
      guard++;
    }
    return false;
  }
  function overlappingRuleIdsForCalendar(calendarId){
    const rules = calRulesData.filter(r=>r.calendarId===calendarId);
    const bad = new Set();
    for(let i=0;i<rules.length;i++){
      for(let j=i+1;j<rules.length;j++){
        if(rulesOverlap(rules[i], rules[j])){ bad.add(rules[i].id); bad.add(rules[j].id); }
      }
    }
    return bad;
  }
  function calOccurrencesForDate(dateStr){
    const out = [];
    calRulesData.forEach(rule=>{
      const cal = calendarsData.find(c=>c.id===rule.calendarId);
      if(!cal || cal.hidden) return;
      if(!calRuleMatchesDate(rule, dateStr)) return;
      out.push({ruleId:rule.id, calendarId:cal.id, calName:cal.name, color:cal.color, kid: cal.kid||'both', subject:rule.subject, start:rule.start, end:rule.end});
    });
    out.sort((a,b)=> a.start.localeCompare(b.start));
    return out;
  }
  function calRowsForDate(dateStr){
    const occ = calOccurrencesForDate(dateStr);
    const map = {};
    occ.forEach(o=>{
      if(!map[o.start]) map[o.start] = {petya:[], fedya:[]};
      if(o.kid==='petya' || o.kid==='both') map[o.start].petya.push(o);
      if(o.kid==='fedya' || o.kid==='both') map[o.start].fedya.push(o);
    });
    return Object.keys(map).sort().map(start=>({start, petya:map[start].petya, fedya:map[start].fedya}));
  }
  function combinedRowsForDate(dateStr){
    const oldRows = dayRows(dateStr);
    const calRows = calRowsForDate(dateStr);
    const map = {};
    oldRows.forEach(r=>{
      if(!map[r.time]) map[r.time] = {petyaOld:null, fedyaOld:null, petyaCal:[], fedyaCal:[]};
      map[r.time].petyaOld = r.petya || null;
      map[r.time].fedyaOld = r.fedya || null;
    });
    calRows.forEach(r=>{
      if(!map[r.start]) map[r.start] = {petyaOld:null, fedyaOld:null, petyaCal:[], fedyaCal:[]};
      map[r.start].petyaCal = r.petya;
      map[r.start].fedyaCal = r.fedya;
    });
    return Object.keys(map).sort().map(time=>({time, ...map[time]}));
  }
  function calHwKey(calendarId, ruleId, dateStr, start){
    // include the specific rule id so a truncated/replaced rule can never leak its old
    // homework into a different rule that later reuses the same calendar/day/time slot.
    // falls back to the legacy (pre-fix) key shape when no rule id is known, so existing
    // saved data keeps resolving correctly until it's next edited and re-saved.
    return ruleId ? ('cal|'+calendarId+'|'+ruleId+'|'+dateStr+'|'+start) : ('cal|'+calendarId+'|'+dateStr+'|'+start);
  }
  // resolves the actual homeworkData key for an existing entry, checking the modern
  // (rule-id-aware) key first and falling back to the legacy key shape — needed because
  // data saved before the rule-id fix has no rule id in its key, but a rule may still be
  // found for it by other means (e.g. it currently matches the date), which would
  // otherwise cause toggle/delete actions to silently miss the entry.
  function resolveHwKey(calendarId, ruleId, dateStr, start){
    const preferred = calHwKey(calendarId, ruleId, dateStr, start);
    if(homeworkData[preferred] !== undefined) return preferred;
    const legacy = calHwKey(calendarId, null, dateStr, start);
    if(homeworkData[legacy] !== undefined) return legacy;
    return preferred;
  }
  // finds leftover duplicate pairs from BEFORE the rule-id key fix: a legacy-format key
  // (cal|calendarId|date|start) and a modern-format key (cal|calendarId|ruleId|date|start)
  // that both exist for the exact same calendar/date/time. These are true duplicates —
  // same lesson, split into two separate stored homework entries — and won't merge
  // themselves; they need a one-time manual resolution.
  function findDuplicateHomeworkPairs(){
    const keys = Object.keys(homeworkData);
    const pairs = [];
    keys.forEach(k=>{
      const parts = k.split('|');
      if(parts[0]!=='cal' || parts.length!==4) return; // legacy shape only
      const [, calendarId, date, start] = parts;
      const modernSuffix = '|'+date+'|'+start;
      const modernMatch = keys.find(k2=> k2!==k && k2.startsWith('cal|'+calendarId+'|') && k2.split('|').length===5 && k2.endsWith(modernSuffix));
      if(modernMatch) pairs.push({legacyKey:k, modernKey:modernMatch, calendarId, date, start});
    });
    return pairs;
  }
  function fmtDate(dateStr){
    const [y,m,d] = dateStr.split('-');
    return d+' '+MONTHS_GEN[parseInt(m,10)-1]+' '+y;
  }
  function repeatLabel(rule){
    if(rule.repeat==='none') return 'без повтора';
    if(rule.repeat==='daily') return 'каждый день';
    if(rule.repeat==='weekly') return 'каждую неделю по '+DOW_FULL[dowOf(rule.date)].toLowerCase()+'ам';
    if(rule.repeat==='weekdays') return 'по дням: '+(rule.weekdays||[]).slice().sort().map(d=>DOW[d]).join(', ');
    return '';
  }
  function untilLabel(rule){
    return rule.until ? ('до '+fmtDate(rule.until)) : 'бессрочно';
  }
  function ruleTimeLabel(rule){
    if(rule.timeMode==='lesson' && rule.lessonNumber){
      return rule.lessonNumber+' урок ('+rule.start+'–'+rule.end+')';
    }
    return rule.start+(rule.end?'–'+rule.end:'');
  }

  function hwHasContent(hw){
    return !!(hw && (hw.text || (hw.files && hw.files.length)));
  }

  function dayHasPendingHw(kid, dateStr){
    const lessons = (lessonsByKidDate[kid][dateStr]||[]).concat(customLessonsFor(kid,dateStr));
    return lessons.some(l=>{
      const hw = homeworkData[keyOf(kid,dateStr,l.start)];
      return hwHasContent(hw) && !hw.done;
    });
  }

  function dayRows(dateStr){
    const p = (lessonsByKidDate.petya[dateStr]||[]).concat(customLessonsFor('petya',dateStr));
    const f = (lessonsByKidDate.fedya[dateStr]||[]).concat(customLessonsFor('fedya',dateStr));
    const times = Array.from(new Set([...p.map(l=>l.start), ...f.map(l=>l.start)])).sort();
    return times.map(t=>({
      time:t,
      petya: p.find(l=>l.start===t)||null,

    }));
  }

  // ---------- grades ----------
  // Only the main "lyceum" calendar per kid counts for grades — extra-activity
  // calendars, custom one-off lessons and legacy ICS overrides are excluded.
  function normCalName(s){ return (s||'').toLowerCase().replace(/[^a-zа-яё0-9]+/gi,''); }
  function isLyceumCalendarForKid(cal, kid){
    if(!cal || !cal.name) return false;
    const n = normCalName(cal.name);
    const kidName = kid==='petya' ? 'петя' : 'федя';
    return n.includes('лицей') && n.includes(kidName);
  }
  function subjectsForKid(kid){
    const set = new Set();
    calRulesData.forEach(rule=>{
      const cal = calendarsData.find(c=>c.id===rule.calendarId);
      if(!isLyceumCalendarForKid(cal, kid)) return;
      if(rule.subject && rule.subject.trim()) set.add(rule.subject.trim());
    });
    return Array.from(set).sort((a,b)=>a.localeCompare(b,'ru'));
  }
  function gradesFor(kid,subject,tri){
    return (((gradesData[kid]||{})[subject]||{})[tri]) || [];
  }
  function ensureGradesSlot(kid,subject,tri){
    if(!gradesData[kid]) gradesData[kid] = {};
    if(!gradesData[kid][subject]) gradesData[kid][subject] = {};
    if(!gradesData[kid][subject][tri]) gradesData[kid][subject][tri] = [];
    return gradesData[kid][subject][tri];
  }
  function trimesterStats(kid,subject,tri){
    const list = gradesFor(kid,subject,tri);
    let sumW=0, sumWV=0;
    list.forEach(g=>{
      const v = Number(g.value); const w = Number(g.weight)||1;
      if(!isFinite(v)) return;
      sumW += w; sumWV += v*w;
    });
    if(sumW<=0) return {avg:null, sumW:0, sumWV:0, neededFives:null};
    const avg = sumWV/sumW;
    // how many more grades of "5" (weight 1) are needed so the average is STRICTLY
    // greater than 4.5 (matches the school's rounding rule: 4.5 itself still rounds to 4)
    let neededFives;
    if(avg>4.5+1e-9) neededFives = 0;
    else neededFives = Math.max(0, Math.floor(9*sumW - 2*sumWV + 1e-9) + 1);
    return {avg, sumW, sumWV, neededFives};
  }

      const olymp = rems.some(r=>r.type==='olympiad');
      const remind = rems.some(r=>r.type!=='olympiad');
      const pendP = dayHasPendingHw('petya',dateStr), pendF = dayHasPendingHw('fedya',dateStr);
      const calOcc = calOccurrencesForDate(dateStr);
      const calByCal = {};
      calOcc.forEach(o=>{ (calByCal[o.calendarId]=calByCal[o.calendarId]||[]).push(o); });
      let cls='month-cell';
      if(!inMonth) cls+=' other';
      if(dateStr===todayStr) cls+=' today';
      if(hol) cls+=' holiday';
      return `<div class="${cls}" data-day="${dateStr}">
        <div class="mc-flags">${olymp?'🏆':''}${remind?'🚩':''}</div>
        <div class="mc-date">${d.getDate()}</div>
        ${pCount?`<div class="mc-line petya"><span class="kid-badge petya" style="width:13px;height:13px;font-size:8px;">П</span>${pCount}${pendP?' 📝':''}</div>`:''}
        ${fCount?`<div class="mc-line fedya"><span class="kid-badge fedya" style="width:13px;height:13px;font-size:8px;">Ф</span>${fCount}${pendF?' 📝':''}</div>`:''}
        ${Object.keys(calByCal).map(cid=>{
          const cal = calendarsData.find(c=>c.id===cid);
          return `<div class="mc-line" style="color:${cal?cal.color:'#888'}"><span class="cal-swatch" style="width:9px;height:9px;background:${cal?cal.color:'#888'}"></span>${calByCal[cid].length} ${escapeHtml(cal?cal.name:'')}</div>`;
        }).join('')}
      </div>`;
    }).join('');
    return `<div class="day-card"><div class="month-grid">${dow}${body}</div></div>`;
  }

  // ---- grades tab ----
  function encSubj(s){ return encodeURIComponent(s); }
  function decSubj(s){ return decodeURIComponent(s); }

  function renderGradesTab(){
    const allSubjects = subjectsForKid(gradesKid);
    const excluded = excludedSubjectsData[gradesKid] || [];
    const subjects = allSubjects.filter(s=>!excluded.includes(s));
    let out = `<div class="grades-toolbar">
      <div class="seg">${KIDS.map(k=>`<button data-gradekid="${k.id}" class="${gradesKid===k.id?'active':''}">${k.name}</button>`).join('')}</div>
      <div class="seg">${[1,2,3].map(t=>`<button data-gradetri="${t}" class="${gradesTri===t?'active':''}">${t}-й триместр</button>`).join('')}</div>
    </div>
    <div class="gs-hint">Оценка показана числом, вес — маленькой цифрой сверху (например 4² = оценка 4 с весом 2). Оценку и вес можно менять прямо на месте. Средний балл считается с учётом веса. «Нужно 5-ок» — сколько дополнительных пятёрок (вес 1) нужно получить, чтобы средний балл стал строго больше 4,5. Кнопкой 🗑 у предмета можно убрать его из оценивания, если по нему оценки не ставятся.</div>`;

    if(subjects.length===0 && excluded.length===0){
      out += `<div class="empty-state">Предметов не найдено. Оценки собираются только из календарей «Петя_Лицей» и «Федя_Лицей» — добавьте туда уроки на вкладке «Настройка расписания».</div>`;
      return out;
    }

    if(subjects.length===0){
      out += `<div class="empty-state">Все предметы убраны из оценивания. Верните нужные ниже.</div>`;
    } else {
      out += `<div class="table-scroll"><table class="grades-table"><thead><tr>
        <th>Предмет</th><th>Оценки</th><th>Средний балл</th><th>Нужно 5</th><th></th>
      </tr></thead><tbody>${subjects.map(subject=>{
        const list = gradesFor(gradesKid, subject, gradesTri);
        const stats = trimesterStats(gradesKid, subject, gradesTri);
        const es = encSubj(subject);
        let needHtml;
        if(stats.avg===null){
          needHtml = `<span class="gs-need none">—</span>`;
        } else if(stats.neededFives===0){
          needHtml = `<span class="gs-need ok">уже 5</span>`;
        } else {
          needHtml = `<span class="gs-need">ещё ${stats.neededFives} ${pluralFive(stats.neededFives)}</span>`;
        }
        return `<tr>
          <td class="gt-subject">${escapeHtml(subject)}</td>
          <td class="gt-grades"><div class="gs-grades">
            ${list.map(g=>`<span class="gs-grade">
              <input type="number" class="gs-val" min="1" max="5" step="1" value="${escAttr(String(g.value))}" data-gradeval="${gradesKid}|${es}|${gradesTri}|${g.id}" title="Оценка">
              <input type="number" class="gs-weight" min="1" step="1" value="${escAttr(String(g.weight))}" data-gradeweight="${gradesKid}|${es}|${gradesTri}|${g.id}" title="Вес оценки">
              <button class="gs-del" data-gradedel="${gradesKid}|${es}|${gradesTri}|${g.id}" title="Удалить оценку">✕</button>
            </span>`).join('')}
            <span class="gs-add-inline" title="Добавить оценку">
              <input type="number" class="gs-add-val" min="1" max="5" step="1" placeholder="•" id="ga-val-${es}-${gradesTri}">
              <span class="gs-add-x">×</span>
            <input type="number" class="gs-add-w" min="1" step="1" value="1" id="ga-w-${es}-${gradesTri}">
            <button data-gradeadd="${gradesKid}|${es}|${gradesTri}">+</button>
          </span>
        </div></td>
        <td class="gt-avg"><b>${stats.avg===null?'—':stats.avg.toFixed(2)}</b></td>
        <td class="gt-need">${needHtml}</td>
        <td><button class="gt-subdel" data-subjdel="${gradesKid}|${es}" title="Убрать предмет из оценивания">🗑</button></td>
      </tr>`;
      }).join('')}</tbody></table></div>`;
    }

    if(excluded.length>0){
      out += `<div class="gs-hidden-subjects">
        <span class="gs-hidden-label">Убраны из оценивания:</span>
        ${excluded.map(s=>`<span class="gs-hidden-chip">${escapeHtml(s)} <button data-subjrestore="${gradesKid}|${encSubj(s)}" title="Вернуть предмет">↺</button></span>`).join('')}
      </div>`;
    }
    return out;
  }

  function pluralFive(n){
    const n10 = n%10, n100 = n%100;
    if(n100>=11 && n100<=14) return 'пятёрок';
    if(n10===1) return 'пятёрку';
    if(n10>=2 && n10<=4) return 'пятёрки';
    return 'пятёрок';
  }

  // ---- homework tab ----
  let hwFilterSource = 'all'; // 'all' | kid id

  let hwFilterStatus = 'pending';

  // one-time cleanup UI for leftover duplicate homework entries left behind by the
  // pre-fix key format bug — shows both versions of each affected lesson so the
  // person can pick which text/files to keep instead of us silently guessing
  function renderDuplicateHomeworkWarning(){
    const pairs = findDuplicateHomeworkPairs();
    if(pairs.length===0) return '';
    return `<div class="dup-warning">
      <div class="dup-warning-title">⚠ Найдено задвоенных записей домашнего задания: ${pairs.length}</div>
      <div class="dup-warning-sub">Это старые записи, оставшиеся от одного и того же урока, который до недавнего исправления сохранялся под двумя разными записями. Выберите для каждой пары, какую версию оставить — вторая будет удалена (файлы всё равно останутся в библиотеке).</div>
      ${pairs.map((p,i)=>{
        const a = homeworkData[p.legacyKey] || {text:'',done:false,files:[]};
        const b = homeworkData[p.modernKey] || {text:'',done:false,files:[]};
        const cal = calendarsData.find(c=>c.id===p.calendarId);
        return `<div class="dup-pair">
          <div class="dup-pair-head">${escapeHtml(cal?cal.name:'Календарь')} · ${fmtDate(p.date)} · ${p.start}</div>
          <div class="dup-options">
            <div class="dup-option">
              <div class="dup-option-text">${a.text?escapeHtml(a.text):'<i>(пусто)</i>'}${a.done?' · <b>выполнено</b>':''}${a.files&&a.files.length?' · файлов: '+a.files.length:''}</div>
              <button class="btn secondary" data-dupkeep="${p.legacyKey}::${p.modernKey}::keepa::${p.calendarId}::${p.date}::${p.start}">Оставить эту версию</button>
            </div>
            <div class="dup-option">
              <div class="dup-option-text">${b.text?escapeHtml(b.text):'<i>(пусто)</i>'}${b.done?' · <b>выполнено</b>':''}${b.files&&b.files.length?' · файлов: '+b.files.length:''}</div>
              <button class="btn secondary" data-dupkeep="${p.legacyKey}::${p.modernKey}::keepb::${p.calendarId}::${p.date}::${p.start}">Оставить эту версию</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  function renderHomeworkTab(){
    const todayStr = iso(startOfDay(new Date()));
    let entries = collectHomework().filter(e=>!e.orphaned);
    entries.sort((a,b)=> (a.date+a.start).localeCompare(b.date+b.start));
    let filtered = entries;
    if(hwFilterSource!=='all'){
      filtered = filtered.filter(e=> e.kid===hwFilterSource || e.kid==='both');
    }
    if(hwFilterStatus==='pending') filtered = filtered.filter(e=>!e.done);
    if(hwFilterStatus==='done') filtered = filtered.filter(e=>e.done);

    let out = migrationBannerHtml();
    out += renderDuplicateHomeworkWarning();
    out += `<div class="filters">
      <div class="seg">
        <button data-hwsrc="all" class="${hwFilterSource==='all'?'active':''}">Все</button>
        ${KIDS.map(k=>`<button data-hwsrc="${k.id}" class="${hwFilterSource===k.id?'active':''}">${k.name}</button>`).join('')}
      </div>
      <div class="seg">
        <button data-hwstatus="all" class="${hwFilterStatus==='all'?'active':''}">Все</button>
        <button data-hwstatus="pending" class="${hwFilterStatus==='pending'?'active':''}">Не сделано</button>
        <button data-hwstatus="done" class="${hwFilterStatus==='done'?'active':''}">Сделано</button>

      <button class="btn secondary" id="print-hw-petya">🖨 Печать — Петя</button>
      <button class="btn secondary" id="print-hw-fedya">🖨 Печать — Федя</button>
    </div>`;

    if(filtered.length===0){
      out += `<div class="empty-state">Ничего не найдено. Нажмите на урок в расписании, чтобы добавить домашнее задание.</div>`;
      out += renderOrphanedHomeworkSection();
      return out;
    }

    out += `<div class="hw-list">${filtered.map(e=>{
      const overdue = !e.done && e.date < todayStr;
      const [y,m,d] = e.date.split('-');
      const dateLabel = d+' '+MONTHS_GEN[parseInt(m,10)-1];
      if(e.isCal){
        const cal = calendarsData.find(c=>c.id===e.calendarId);
        const col = cal?cal.color:'#555';
        const owner = e.kid==='both' ? {name:'Оба', soft:'#eee', hex:'#555'} : KIDS.find(k=>k.id===e.kid);
        return `<div class="hw-item ${overdue?'overdue':''} ${e.done?'done':''}">
          <input type="checkbox" class="hw-check" ${e.done?'checked':''} data-hwtoggle-cal="${e.calendarId}|${e.ruleId||''}|${e.date}|${e.start}">
          <div class="hw-main" data-hwedit-cal="${e.calendarId}|${e.date}|${e.start}|${e.end||''}">
            <div class="hw-top-row">
              ${owner?`<span class="kid-tag" style="background:${owner.soft};color:${owner.hex};">${escapeHtml(owner.name)}</span>`:''}
              <span class="kid-tag" style="background:${col}22;color:${col};">${escapeHtml(e.calName)}</span>
              <span>${dateLabel}${overdue?' · просрочено':''}</span>
              <span class="hw-subject">${escapeHtml(e.subject)}</span>
            </div>
            <div class="hw-text ${e.done?'done-text':''}">${escapeHtml(e.text)}</div>
            ${hwFilesPreviewHtml(e.files)}
          </div>
        </div>`;
      }
      const kid = KIDS.find(k=>k.id===e.kid);
      return `<div class="hw-item ${overdue?'overdue':''} ${e.done?'done':''}">
        <input type="checkbox" class="hw-check" ${e.done?'checked':''} data-hwtoggle="${e.kid}|${e.date}|${e.start}">
        <div class="hw-main" data-hwedit="${e.kid}|${e.date}|${e.start}">
          <div class="hw-top-row">
            <span class="kid-tag" style="background:${kid.soft};color:${kid.hex};">${kid.name}</span>
            <span>${dateLabel}${overdue?' · просрочено':''}</span>
            <span class="hw-subject">${escapeHtml(e.subject)}</span>
          </div>
          <div class="hw-text ${e.done?'done-text':''}">${escapeHtml(e.text)}</div>
          ${hwFilesPreviewHtml(e.files)}
        </div>
      </div>`;
    }).join('')}</div>`;
    out += renderOrphanedHomeworkSection();
    return out;
  }

  // homework entries whose calendar rule was shortened/replaced/deleted after the
  // homework was saved — they no longer belong to any currently-scheduled lesson,
  // so they're kept visible here instead of silently vanishing or leaking into
  // whatever new lesson now occupies that date/time slot.
  function renderOrphanedHomeworkSection(){

  function collectHomework(){
    let entries = [];
    Object.keys(homeworkData).forEach(key=>{
      const hw = homeworkData[key];
      if(!hwHasContent(hw)) return;
      const parts = key.split('|');
      if(parts[0]==='cal'){
        let calendarId, ruleId, date, start;
        if(parts.length>=5){
          [, calendarId, ruleId, date, start] = parts;
        } else {
          // legacy key format (pre rule-id fix) — best effort, will self-migrate to the new format on next save
          [, calendarId, date, start] = parts;
          ruleId = null;
        }
        const cal = calendarsData.find(c=>c.id===calendarId);
        const rule = ruleId
          ? calRulesData.find(r=>r.id===ruleId)
          : calRulesData.find(r=>r.calendarId===calendarId && r.start===start && calRuleMatchesDate(r,date));
        const active = !!(cal && !cal.hidden && rule && calRuleMatchesDate(rule, date));
        const kid = cal ? (cal.kid || 'both') : 'both';
        entries.push({isCal:true, calendarId, ruleId: rule?rule.id:ruleId, calName: cal?cal.name:'Календарь (удалён)', kid, date, start, text:hw.text||'', done:!!hw.done, subject: hw.subject || (rule?rule.subject:'') || 'Без предмета', files: hw.files||[], orphaned: !active});
      } else {
        const [kid,date,start] = parts;
        entries.push({kid,date,start,text:hw.text||'',done:!!hw.done,subject:resolvedSubject(kid,date,start),files:hw.files||[],orphaned:false});
      }
    });
    return entries;
  }

  function wireDocFileAttach(){
    const listEl = document.getElementById('doc-files-list');
    const inputEl = document.getElementById('doc-file-input');
    if(!listEl || !inputEl) return;
    function refresh(){
      listEl.innerHTML = filesListInnerHtml(docDraft.files);
      listEl.querySelectorAll('.m-file-del').forEach(btn=>{
        btn.onclick = ()=>{
          const removed = docDraft.files.find(f=>f.id===btn.dataset.fid);
          docDraft.files = docDraft.files.filter(f=>f.id!==btn.dataset.fid);
          refresh();
          if(removed) removeFileFromStorage(removed);
        };
      });
    }
    refresh();
    inputEl.onchange = async ()=>{
      const chosen = Array.from(inputEl.files||[]);
      if(chosen.length===0) return;
      inputEl.disabled = true;
      for(const file of chosen){
        if(file.size > MAX_FILE_SIZE){ alert('Файл «'+file.name+'» слишком большой (макс. 100 МБ).'); continue; }
        const tempId = 'up-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        docDraft.files.push({id:tempId, name:file.name, type:file.type||'', size:file.size, uploading:true});
        refresh();
        try{
          const meta = await uploadFileToStorage(file);
          const idx = docDraft.files.findIndex(f=>f.id===tempId);
          if(idx>-1) docDraft.files[idx] = meta;
        } catch(err){
          const idx = docDraft.files.findIndex(f=>f.id===tempId);
          if(idx>-1) docDraft.files.splice(idx,1);
          alert('Не удалось загрузить файл «'+file.name+'»: '+(err&&err.message?err.message:'ошибка загрузки'));
        }
        refresh();
      }
      inputEl.disabled = false;
      inputEl.value = '';
    };
  }

  function fileAttachSectionHtml(files, kidHint){
    const attachedIds = new Set((files||[]).map(f=>f.id));
    const libOptions = fileLibraryData
      .filter(f=> !attachedIds.has(f.id))

    const libPicker = libOptions.length ? `

      <label class="m-file-attach-label">📎 Прикрепить новый файл<input type="file" id="m-file-input" multiple style="display:none;"></label>

  function filesListInnerHtml(files){
    if(!files || !files.length) return `<div style="font-size:11.5px;color:var(--ink-soft);">Файлов нет</div>`;
    return files.map(f=>{
      if(f.uploading){
        return `<div class="m-file-chip"><span class="m-file-icon">⏳</span><span class="m-file-name">${escapeHtml(f.name)}</span></div>`;
      }
      const url = fileUrl(f);
      const isImg = f.type && f.type.startsWith('image/');
      const preview = `${isImg?`<img src="${url}">`:`<span class="m-file-icon">📄</span>`}<span class="m-file-name" title="${escAttr(f.name)}">${escapeHtml(f.name)}</span>`;
      const body = url
        ? `<a href="${url}" download="${escAttr(f.name)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:5px;min-width:0;">${preview}</a>`
        : `<span style="display:flex;align-items:center;gap:5px;min-width:0;color:var(--ink-soft);" title="Файл повреждён, удалите и загрузите заново">${preview}</span>`;
      return `<div class="m-file-chip">
        ${body}
        <button type="button" class="m-file-del" data-fid="${f.id}">✕</button>
      </div>`;
    }).join('');
  }

  async function uploadFileToStorage(file){
    if(sb && storageBackend==='supabase'){
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80);
      const path = Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safeName;
      const {error} = await sb.storage.from(FILES_BUCKET).upload(path, file, {cacheControl:'3600', upsert:false});
      if(error) throw error;
      const {data} = sb.storage.from(FILES_BUCKET).getPublicUrl(path);
      return {id: Date.now()+'-'+Math.random().toString(36).slice(2,7), name:file.name, type:file.type||'', size:file.size, url:data.publicUrl, path, storage:'supabase'};
    }
    // no Supabase configured — fall back to embedding small files directly in the saved JSON
    if(file.size > INLINE_FALLBACK_MAX){
      throw new Error('Без облачного хранилища можно прикладывать файлы не больше 8 МБ.');
    }
    return await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), name:file.name, type:file.type||'', size:file.size, dataUrl:reader.result, storage:'inline'});
      reader.onerror = ()=> reject(new Error('Не удалось прочитать файл'));
      reader.readAsDataURL(file);
    });
  }

  function removeFileFromStorage(f){
    if(f && f.storage==='supabase' && f.path && sb){
      sb.storage.from(FILES_BUCKET).remove([f.path]).catch(()=>{});
    }
  }

  // permanent, independent record of every uploaded homework file — kept even after
  // the homework entry that first attached it is edited, moved, or deleted, so files
  // stay available in the Library and can be re-attached to another (e.g. rescheduled) lesson
  function registerFileInLibrary(f, meta){
    if(!f || f.uploading || !fileUrl(f)) return;
    if(fileLibraryData.some(x=>x.id===f.id)) return;
    fileLibraryData.push({
      id:f.id, name:f.name, type:f.type||'', size:f.size,
      url:f.url||null, path:f.path||null, dataUrl:f.dataUrl||null, storage:f.storage||'',
      kid: (meta&&meta.kid)||'', subject: (meta&&meta.subject)||'', calName: (meta&&meta.calName)||null,
      date: (meta&&meta.date)||'', start: (meta&&meta.start)||'', addedAt: Date.now()
    });
  }
  function registerFilesInLibrary(files, meta){
    (files||[]).forEach(f=>registerFileInLibrary(f, meta));
  }

  function dataUrlToBlob(dataUrl){
    const [header, base64] = dataUrl.split(',');
    const mimeMatch = header.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    const binary = atob(base64);
    const arr = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) arr[i] = binary.charCodeAt(i);
    return new Blob([arr], {type: mime});
  }

  function countInlineFiles(){
    let n = 0;
    Object.values(homeworkData).forEach(hw=>{
      if(hw && hw.files) hw.files.forEach(f=>{ if(f.dataUrl && !f.url) n++; });
    });
    return n;
  }

  async function migrateInlineFilesToCloud(){
    if(!(sb && storageBackend==='supabase')){
      alert('Supabase не настроен — перенос недоступен.');
      return;
    }
    const keys = Object.keys(homeworkData).filter(k=> homeworkData[k] && homeworkData[k].files && homeworkData[k].files.some(f=>f.dataUrl && !f.url));
    if(keys.length===0){ alert('Файлов для переноса не найдено.'); return; }
    if(!confirm('Перенести файлы ('+keys.length+' запис(ей) с ДЗ) в облачное хранилище? Это ускорит работу приложения. Может занять некоторое время.')) return;
    let migrated = 0, failed = 0;
    for(const key of keys){
      const hw = homeworkData[key];
      const newFiles = [];
      for(const f of hw.files){
        if(f.url || !f.dataUrl){ newFiles.push(f); continue; }
        try{
          const blob = dataUrlToBlob(f.dataUrl);
          const safeName = (f.name||'file').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80);
          const path = Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safeName;
          const {error} = await sb.storage.from(FILES_BUCKET).upload(path, blob, {cacheControl:'3600', upsert:false, contentType: f.type||undefined});
          if(error) throw error;
          const {data} = sb.storage.from(FILES_BUCKET).getPublicUrl(path);
          newFiles.push({id:f.id, name:f.name, type:f.type||'', size:f.size, url:data.publicUrl, path, storage:'supabase'});
          migrated++;
        } catch(err){
          newFiles.push(f);
          failed++;
        }
      }
      hw.files = newFiles;
    }
    await persistAll();
    render();
    alert('Готово. Перенесено файлов: '+migrated+(failed?('. Не удалось перенести: '+failed+' (оставлены как были).'):'.'));
  }

  function migrationBannerHtml(){
    const n = countInlineFiles();
    if(n===0) return '';
    return `<div class="warn-banner">⚠️ Найдено файлов (${n}), сохранённых старым способом внутри общего состояния — это может замедлять работу.
      <button class="btn secondary" id="migrate-files-btn">☁️ Перенести в облако</button>
    </div>`;
  }

  function wireFileAttach(fileState){
    const listEl = document.getElementById('m-files-list');
    const inputEl = document.getElementById('m-file-input');
    if(!listEl || !inputEl) return;
    function refresh(){
      listEl.innerHTML = filesListInnerHtml(fileState.files);
      listEl.querySelectorAll('.m-file-del').forEach(btn=>{
        btn.onclick = ()=>{
          const removed = fileState.files.find(f=>f.id===btn.dataset.fid);
          fileState.files = fileState.files.filter(f=>f.id!==btn.dataset.fid);
          refresh();
          // a file already registered in the permanent Library is only detached from
          // this homework entry (it stays available in the Library / other lessons);
          // only a brand-new upload from this same editing session (never saved anywhere
          // yet) is actually deleted from storage when removed.
          if(removed && !fileLibraryData.some(x=>x.id===removed.id)) removeFileFromStorage(removed);
        };
      });
      const libAddBtn = document.getElementById('m-lib-add');
      const libSelect = document.getElementById('m-lib-select');
      if(libAddBtn && libSelect){
        libAddBtn.onclick = ()=>{
          const id = libSelect.value;
          if(!id) return;
          const entry = fileLibraryData.find(f=>f.id===id);
          if(!entry || fileState.files.some(f=>f.id===id)) return;
          fileState.files.push({id:entry.id, name:entry.name, type:entry.type, size:entry.size, url:entry.url, path:entry.path, dataUrl:entry.dataUrl, storage:entry.storage});
          refresh();
        };
      }
    }
    refresh();
    inputEl.onchange = async ()=>{
      const chosen = Array.from(inputEl.files||[]);
      if(chosen.length===0) return;
      inputEl.disabled = true;
      const modalEl = inputEl.closest('.modal');
      const saveButtons = modalEl ? Array.from(modalEl.querySelectorAll('button[id^="m-save"]')) : [];
      saveButtons.forEach(b=>b.disabled = true);
      for(const file of chosen){
        if(file.size > MAX_FILE_SIZE){
          alert('Файл «'+file.name+'» слишком большой (макс. 100 МБ).');
          continue;
        }
        const tempId = 'up-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        fileState.files.push({id:tempId, name:file.name, type:file.type||'', size:file.size, uploading:true});
        refresh();
        try{
          const meta = await uploadFileToStorage(file);
          const idx = fileState.files.findIndex(f=>f.id===tempId);
          if(idx>-1) fileState.files[idx] = meta;
        } catch(err){
          const idx = fileState.files.findIndex(f=>f.id===tempId);
          if(idx>-1) fileState.files.splice(idx,1);
          alert('Не удалось загрузить файл «'+file.name+'»: '+(err&&err.message?err.message:'ошибка загрузки'));
        }
        refresh();
      }
      inputEl.disabled = false;
      saveButtons.forEach(b=>b.disabled = false);
      inputEl.value = '';
    };
  }

  // closes a modal and cleans up any files that were uploaded to Storage during
  // this modal session but never actually got saved (user hit "Закрыть"/cancel)
  function closeModalCleaningUpFiles(fileState, originalFiles){
    const originalIds = new Set((originalFiles||[]).map(f=>f.id));
    const orphaned = (fileState.files||[]).filter(f=> f.storage==='supabase' && !originalIds.has(f.id) && !fileLibraryData.some(x=>x.id===f.id));
    closeModal();
    orphaned.forEach(removeFileFromStorage);
  }

    function readForm(){
      return {
        newSubject: document.getElementById('m-subject').value.trim(),
        text: document.getElementById('m-text').value.trim(),
        done: document.getElementById('m-done').checked
      };
    }
    async function saveCustom(){
      const {newSubject, text, done} = readForm();
      const newStart = document.getElementById('m-start').value || custom.start;
      const newEnd = document.getElementById('m-end').value || custom.end;
      const movedKey = keyOf(kid,date,newStart);

      custom.start = newStart;
      custom.end = newEnd;
      if(movedKey!==key){
        if(homeworkData[key]) { homeworkData[movedKey]=homeworkData[key]; delete homeworkData[key]; }
      }
      const cleanFiles = fileState.files.filter(f=>!f.uploading);
      registerFilesInLibrary(cleanFiles, {kid, subject:custom.subject, date, start:newStart});
      if(text || cleanFiles.length){ homeworkData[movedKey] = {text, done, subject:custom.subject, files:cleanFiles}; }
      else { delete homeworkData[movedKey]; }
      await persistAll();

      render();

    async function saveIcsLesson(applyToAllWeeks){
      const {newSubject, text, done} = readForm();
      const orig = origSubject(kid,date,start) || '';
      if(applyToAllWeeks){
        recurringOverridesData = recurringOverridesData.filter(r=>!(r.kid===kid && r.weekday===dowOf(date) && r.start===start));
        if(newSubject && newSubject!==orig){

      const cleanFiles = fileState.files.filter(f=>!f.uploading);
      registerFilesInLibrary(cleanFiles, {kid, subject:newSubject||orig, date, start});
      if(text || cleanFiles.length){ homeworkData[key] = {text, done, subject:newSubject||orig, files:cleanFiles}; }
      else { delete homeworkData[key]; }
      await persistAll();
      closeModal();
      render();
    }
    function resolvedSubjectIgnoringDateOverride(){
      const rec = recurringOverrideFor(kid,date,start);
      return rec ? rec.subject : (origSubject(kid,date,start)||'');
    }

    if(custom){
      document.getElementById('m-save').onclick = saveCustom;

      document.getElementById('m-save-week').onclick = ()=>saveIcsLesson(false);
      document.getElementById('m-save-all').onclick = ()=>saveIcsLesson(true);

      customLessonsData = customLessonsData.filter(c=>c.id!==custom.id);
      delete homeworkData[key];
      await persistAll();
      closeModal();
      render();
    };

  // ---- utils ----
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escAttr(s){ return escapeHtml(s); }

  // ---------- print ----------
  function doPrint(html, title){
