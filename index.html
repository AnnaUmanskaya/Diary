  // ============================================================
  // Excel export of the weekly schedule template — three sheets:
  // "Расписание" (combined, colour-coded per kid), "Петя", "Федя".
  // Only PERIODIC (recurring) lessons/activities are shown — no
  // dates, no reminders/olympiads, no homework marks, no one-off
  // entries (custom one-off lessons or rules with repeat:'none').
  // ============================================================
  const EXTRA_BLOCKS = [
    {start:'16:00', end:'17:00'},
    {start:'17:00', end:'18:00'},
    {start:'18:00', end:'19:00'},
    {start:'19:00', end:'20:00'},
    {start:'20:00', end:'21:00'}
  ];
  function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
  function hexToARGB(hex){ return 'FF'+hex.replace('#','').toUpperCase(); }

  // 8-slot array (one per lyceum period) for a kid on a given date, keeping only
  // periodic sources: the standing ICS lyceum timetable, and lyceum-calendar rules
  // whose repeat is NOT 'none'. One-off custom lessons / one-off rule overrides are
  // intentionally skipped — they are not part of the recurring weekly template.
  function lyceumPeriodsForWeekdayFiltered(kid, dateStr){
    const arr = new Array(LESSON_TIMES.length).fill(null);
    (lessonsByKidDate[kid][dateStr]||[]).forEach(l=>{
      const idx = LESSON_TIMES.findIndex(p=>p.start===l.start);
      if(idx>=0) arr[idx] = {subject: resolvedSubject(kid,dateStr,l.start)};
    });
    calOccurrencesForDate(dateStr).forEach(o=>{
      if(!(o.kid===kid || o.kid==='both')) return;
      const cal = calendarsData.find(c=>c.id===o.calendarId);
      if(!isLyceumCalendarForKid(cal,kid)) return;
      const rule = calRulesData.find(r=>r.id===o.ruleId);
      if(rule && rule.repeat==='none') return;
      const idx = LESSON_TIMES.findIndex(p=>p.start===o.start);
      if(idx>=0) arr[idx] = {subject: o.subject};
    });
    return arr;
  }

  // extra ("доп.") activities for a kid on a given date, periodic sources only,
  // overlapping the 16:00–21:00 window
  function extraActivitiesForWeekdayFiltered(kid, dateStr){
    const list = [];
    calOccurrencesForDate(dateStr).forEach(o=>{
      if(!(o.kid===kid || o.kid==='both')) return;
      const cal = calendarsData.find(c=>c.id===o.calendarId);
      if(isLyceumCalendarForKid(cal,kid)) return;
      const rule = calRulesData.find(r=>r.id===o.ruleId);
      if(rule && rule.repeat==='none') return;
      list.push({start:o.start, end:o.end||o.start, subject:o.subject});
    });
    return list
      .filter(a=> a.start < '21:00' && (a.end||a.start) > '16:00')
      .sort((a,b)=> a.start.localeCompare(b.start));
  }

  // Computes the shared 16:00–21:00 row grid for the whole extra-activities section
  // of a sheet at once (across every day column and every kid column together),
  // since they all live in the same physical Excel rows. A row is only split where
  // some column's activity genuinely starts/ends off an hour boundary; an activity
  // cell then spans (merges) down through any further whole-hour rows it covers.
  function computeExtraSectionGrid(days, kidsToShow){
    const rangeStart = toMin('16:00'), rangeEnd = toMin('21:00');
    const actsByCol = {};
    days.forEach((d,dayIdx)=>{
      actsByCol[dayIdx] = {};
      kidsToShow.forEach(k=>{ actsByCol[dayIdx][k] = extraActivitiesForWeekdayFiltered(k, d.date); });
    });
    const bpSet = new Set([16,17,18,19,20,21].map(h=>h*60));
    days.forEach((d,dayIdx)=>{
      kidsToShow.forEach(k=>{
        actsByCol[dayIdx][k].forEach(a=>{
          const s = Math.max(rangeStart, toMin(a.start));
          const e = Math.min(rangeEnd, toMin(a.end||a.start));
          if(s>rangeStart && s<rangeEnd) bpSet.add(s);
          if(e>rangeStart && e<rangeEnd) bpSet.add(e);
        });
      });
    });
    const bps = Array.from(bpSet).sort((a,b)=>a-b);
    const segments = [];
    for(let i=0;i<bps.length-1;i++) segments.push({start:bps[i], end:bps[i+1], hour: Math.floor((bps[i]-rangeStart)/60)});
    const hourGroupSize = [0,0,0,0,0];
    segments.forEach(s=> hourGroupSize[s.hour]++);

    function activityForSegment(dayIdx,kid,seg){
      return actsByCol[dayIdx][kid].find(a=>{
        const s = Math.max(rangeStart, toMin(a.start)), e = Math.min(rangeEnd, toMin(a.end||a.start));
        return s<=seg.start && e>=seg.end;
      }) || null;
    }

    const colSeg = {}, colRowspan = {};
    days.forEach((d,dayIdx)=>{
      colSeg[dayIdx]={}; colRowspan[dayIdx]={};
      kidsToShow.forEach(k=>{
        const segArr = segments.map(seg=>activityForSegment(dayIdx,k,seg));
        colSeg[dayIdx][k] = segArr;
        const rs = new Array(segments.length).fill(1);
        let i=0;
        while(i<segments.length){
          const cur = segArr[i];
          let j=i+1;
          while(j<segments.length){
            const nxt = segArr[j];
            // same activity object merges across hour boundaries; two "empty" segments
            // only merge if they belong to the same hour block, so the 5 named
            // hour-rows stay visually distinct wherever nothing needs splitting
            const same = cur ? (nxt===cur) : (nxt===null && segments[j].hour===segments[i].hour);
            if(!same) break;
            j++;
          }
          rs[i]=j-i;
          for(let x=i+1;x<j;x++) rs[x]=0;
          i=j;
        }
        colRowspan[dayIdx][k]=rs;
      });
    });
    return {hourGroupSize, colSeg, colRowspan};
  }

  function writePeriodRows(ws, startRow, days, kidsToShow, colsPerDay){
    const cache = {};
    days.forEach((d,dayIdx)=>{ cache[dayIdx]={}; kidsToShow.forEach(k=> cache[dayIdx][k]=lyceumPeriodsForWeekdayFiltered(k,d.date)); });
    LESSON_TIMES.forEach((p,idx)=>{
      const r = startRow+idx;
      ws.getCell(r,1).value = p.n+' урок\n'+p.start+' - '+p.end;
      days.forEach((d,dayIdx)=>{
        kidsToShow.forEach((k,kIdx)=>{
          const col = 2+dayIdx*colsPerDay+kIdx;
          const cell = cache[dayIdx][k][idx];
          if(cell && cell.subject) ws.getCell(r,col).value = cell.subject;
        });
      });
    });
    return startRow+LESSON_TIMES.length;
  }

  function writeExtraSection(ws, startRow, days, kidsToShow, colsPerDay){
    const {hourGroupSize, colSeg, colRowspan} = computeExtraSectionGrid(days, kidsToShow);
    let rowNum = startRow, segIdx = 0;
    for(let h=0; h<5; h++){
      const size = hourGroupSize[h] || 0;
      for(let s=0; s<size; s++){
        const excelRow = rowNum;
        if(s===0){
          ws.getCell(excelRow,1).value = EXTRA_BLOCKS[h].start+' - '+EXTRA_BLOCKS[h].end;
          if(size>1) ws.mergeCells(excelRow,1,excelRow+size-1,1);
        }
        days.forEach((d,dayIdx)=>{
          kidsToShow.forEach((k,kIdx)=>{
            const col = 2+dayIdx*colsPerDay+kIdx;
            const rs = colRowspan[dayIdx][k][segIdx];
            if(rs>0){
              const act = colSeg[dayIdx][k][segIdx];
              if(act) ws.getCell(excelRow,col).value = act.subject+'\n'+act.start+' - '+act.end;
              if(rs>1) ws.mergeCells(excelRow,col,excelRow+rs-1,col);
            }
          });
        });
        segIdx++; rowNum++;
      }
    }
    return rowNum;
  }

  // builds one worksheet: fixed 1–8 lyceum-period rows + blank spacer + fixed
  // 16:00–21:00 extra-activity rows, one column block per weekday, for the given
  // kid(s). withFill colours each kid's column with their soft theme colour.
  function buildScheduleSheet(wb, sheetName, days, kidsToShow, withFill){
    const ws = wb.addWorksheet(sheetName, {
      pageSetup: {orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:1, paperSize:9, margins:{left:0.3,right:0.3,top:0.3,bottom:0.3,header:0,footer:0}}
    });
    const colsPerDay = kidsToShow.length;
    const totalCols = 1 + 7*colsPerDay;
    ws.getColumn(1).width = 13;
    for(let c=2;c<=totalCols;c++) ws.getColumn(c).width = colsPerDay>1 ? 13 : 15;

    let headerRows;
    if(colsPerDay>1){
      ws.mergeCells(1,1,2,1);
      days.forEach((d,dayIdx)=>{
        const c0 = 2+dayIdx*2;
        ws.mergeCells(1,c0,1,c0+1);
        ws.getCell(1,c0).value = DOW_FULL[d.weekday];
        kidsToShow.forEach((k,kIdx)=>{ ws.getCell(2,c0+kIdx).value = KIDS.find(x=>x.id===k).name; });
      });
      headerRows = 2;
    } else {
      days.forEach((d,dayIdx)=>{ ws.getCell(1,2+dayIdx).value = DOW_FULL[d.weekday]; });
      headerRows = 1;
    }

    let nextRow = headerRows+1;
    nextRow = writePeriodRows(ws, nextRow, days, kidsToShow, colsPerDay);
    const gapRow = nextRow; nextRow++; // left completely blank as a visual spacer
    ws.getRow(gapRow).height = 6;
    nextRow = writeExtraSection(ws, nextRow, days, kidsToShow, colsPerDay);
    const lastRow = nextRow-1;

    for(let r=1;r<=lastRow;r++){
      if(r===gapRow) continue;
      for(let c=1;c<=totalCols;c++){
        const cell = ws.getCell(r,c);
        cell.border = {top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
        cell.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
        if(r<=headerRows) cell.font = {bold:true};
      }
    }
    if(withFill){
      for(let dayIdx=0; dayIdx<7; dayIdx++){
        kidsToShow.forEach((k,kIdx)=>{
          const col = 2+dayIdx*colsPerDay+kIdx;
          const argb = hexToARGB(KIDS.find(x=>x.id===k).soft);
          for(let r=2;r<=lastRow;r++){
            if(r===gapRow) continue;
            ws.getCell(r,col).fill = {type:'pattern', pattern:'solid', fgColor:{argb}};
          }
        });
      }
    }
    ws.views = [{state:'frozen', ySplit: headerRows}];
  }

  async function exportScheduleExcel(){
    if(typeof ExcelJS==='undefined'){
      alert('Не удалось загрузить библиотеку для Excel — проверьте подключение к интернету и попробуйте ещё раз.');
      return;
    }
    const mon = mondayOf(state.date);
    const days = [0,1,2,3,4,5,6].map(i=>{ const d=addDays(mon,i); return {date: iso(d), weekday: d.getDay()}; });
    const wb = new ExcelJS.Workbook();
    buildScheduleSheet(wb, 'Расписание', days, ['petya','fedya'], true);
    buildScheduleSheet(wb, 'Петя', days, ['petya'], false);
    buildScheduleSheet(wb, 'Федя', days, ['fedya'], false);
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Расписание.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }

  function printHomework(kidId){
    const kid = KIDS.find(k=>k.id===kidId);
    const genDate = new Date().toLocaleDateString('ru-RU');
    let entries = collectHomework().filter(e=> (e.kid===kidId || e.kid==='both') && !e.done && !e.orphaned);
    entries.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
    let html = `<h1>Домашние задания — ${kid.name}</h1>
      <div class="p-sub">сформировано ${genDate} · только невыполненные</div>`;
    if(entries.length===0){
      html += `<p>Невыполненных домашних заданий нет.</p>`;
    } else {
      html += `<table><thead><tr><th>Дата</th><th>Предмет</th><th>Задание</th></tr></thead><tbody>${entries.map(e=>{
        const [y,m,d]=e.date.split('-');
        const subjLabel = e.isCal ? escapeHtml(e.subject)+' <span style="opacity:.6;">('+escapeHtml(e.calName)+')</span>' : escapeHtml(e.subject);
        return `<tr><td>${d}.${m}.${y}</td><td>${subjLabel}</td><td>${escapeHtml(e.text)}</td></tr>`;
      }).join('')}</tbody></table>`;
    }
    doPrint(html, 'Домашние задания — '+kid.name);
  }

  // ---------- event handling ----------
  function attachHandlers(){
    app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab; render();});
    app.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view; render();});
    app.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{
      const dir = el.dataset.nav;
      if(dir==='today') state.date = startOfDay(new Date());
      else {
        const mult = dir==='prev' ? -1 : 1;
        if(state.view==='day') state.date = addDays(state.date, mult*1);
        else if(state.view==='week') state.date = addDays(state.date, mult*7);
        else state.date = addMonths(state.date, mult*1);
      }
      render();
    });
    app.querySelectorAll('[data-lesson]').forEach(el=>el.onclick=()=>{
      const [kid,date,start,end] = el.dataset.lesson.split('|');
      modalState = {kid,date,start,end,isNew:false};
      render();
    });
    app.querySelectorAll('[data-addlesson]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      modalState = {kid:'petya', date:el.dataset.addlesson, isNew:true};
      render();
    });
    app.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{
      state.view='day';
      const [y,m,d] = el.dataset.day.split('-').map(Number);
      state.date = new Date(y,m-1,d);
      render();
    });
    app.querySelectorAll('[data-callesson]').forEach(el=>el.onclick=()=>{
      const [calendarId,date,start,end] = el.dataset.callesson.split('|');
      modalState = {calType:'cal', calendarId, date, start, end};
      render();
    });
    app.querySelectorAll('[data-caltoggle]').forEach(el=>el.onchange=async ()=>{
      const cal = calendarsData.find(c=>c.id===el.dataset.caltoggle);
      if(cal){ cal.hidden = !el.checked; await persistAll(); render(); }
    });
    app.querySelectorAll('[data-hwsrc]').forEach(el=>el.onclick=()=>{hwFilterSource=el.dataset.hwsrc; render();});
    app.querySelectorAll('[data-hwstatus]').forEach(el=>el.onclick=()=>{hwFilterStatus=el.dataset.hwstatus; render();});
    const migrateBtn = document.getElementById('migrate-files-btn');
    if(migrateBtn) migrateBtn.onclick = migrateInlineFilesToCloud;
    app.querySelectorAll('[data-libkid]').forEach(el=>el.onclick=()=>{libFilterKid=el.dataset.libkid; render();});
    app.querySelectorAll('[data-libdel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить этот файл из библиотеки навсегда? Он также будет убран из всех домашних заданий, где сейчас прикреплён.')) return;
      const id = el.dataset.libdel;
      const removed = fileLibraryData.find(f=>f.id===id);
      fileLibraryData = fileLibraryData.filter(f=>f.id!==id);
      Object.values(homeworkData).forEach(hw=>{
        if(hw && hw.files && hw.files.length){
          hw.files = hw.files.filter(f=>f.id!==id);
        }
      });
      Object.keys(homeworkData).forEach(k=>{ if(!hwHasContent(homeworkData[k])) delete homeworkData[k]; });
      await persistAll();
      render();
      if(removed) removeFileFromStorage(removed);
    });
    app.querySelectorAll('[data-hwtoggle]').forEach(el=>el.onclick=async (e)=>{
      e.stopPropagation();
      const [kid,date,start] = el.dataset.hwtoggle.split('|');
      const key = keyOf(kid,date,start);
      if(homeworkData[key]){
        homeworkData[key].done = !homeworkData[key].done;
        await persistAll();
        render();
      }
    });
    app.querySelectorAll('[data-hwedit]').forEach(el=>el.onclick=()=>{
      const [kid,date,start] = el.dataset.hwedit.split('|');
      const lesson = (lessonsByKidDate[kid][date]||[]).find(l=>l.start===start);
      modalState = {kid,date,start,end: lesson?lesson.end:''};
      render();
    });
    app.querySelectorAll('[data-hwtoggle-cal]').forEach(el=>el.onclick=async (e)=>{
      e.stopPropagation();
      const [calendarId,ruleId,date,start] = el.dataset.hwtoggleCal.split('|');
      const key = resolveHwKey(calendarId,ruleId||null,date,start);
      if(homeworkData[key]){
        homeworkData[key].done = !homeworkData[key].done;
        await persistAll();
        render();
      }
    });
    app.querySelectorAll('[data-hwedit-cal]').forEach(el=>el.onclick=()=>{
      const [calendarId,date,start,end] = el.dataset.hweditCal.split('|');
      modalState = {calType:'cal', calendarId, date, start, end};
      render();
    });
    app.querySelectorAll('[data-hworphandel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить эту запись домашнего задания? Файлы останутся в библиотеке.')) return;
      const [calendarId,ruleId,date,start] = el.dataset.hworphandel.split('|');
      const key = resolveHwKey(calendarId,ruleId||null,date,start);
      delete homeworkData[key];
      await persistAll();
      render();
    });
    app.querySelectorAll('[data-dupkeep]').forEach(el=>el.onclick=async ()=>{
      const [legacyKey, modernKey, which, calendarId, date, start] = el.dataset.dupkeep.split('::');
      const keepKey = which==='keepa' ? legacyKey : modernKey;
      if(!confirm('Удалить вторую версию этой записи? Файлы из неё останутся в библиотеке, но перестанут быть прикреплены к домашнему заданию.')) return;
      const kept = homeworkData[keepKey];
      delete homeworkData[legacyKey];
      delete homeworkData[modernKey];
      if(kept){
        // always store the resolved version under the current, correct key going forward
        const rule = calRulesData.find(r=>r.calendarId===calendarId && r.start===start && calRuleMatchesDate(r,date));
        const finalKey = calHwKey(calendarId, rule?rule.id:null, date, start);
        homeworkData[finalKey] = kept;
      }
      await persistAll();
      render();
    });
    // ---- schedule settings tab handlers ----
    const calAdd = document.getElementById('cal-add');
    if(calAdd) calAdd.onclick = async ()=>{
      const name = document.getElementById('cal-name').value.trim();
      const color = document.getElementById('cal-color').value || '#2e5a88';
      const kid = document.getElementById('cal-kid').value || 'both';
      const defaultUntil = document.getElementById('cal-defuntil').value || null;
      if(!name) return;
      const id = 'c'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
      calendarsData.push({id,name,color,kid,defaultUntil,hidden:false});
      calSelectedId = id;
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-calkid]').forEach(el=>el.onchange=async ()=>{
      const cal = calendarsData.find(c=>c.id===el.dataset.calkid);
      if(cal){ cal.kid = el.value; await persistAll(); render(); }
    });
    app.querySelectorAll('[data-calcolor]').forEach(el=>el.onchange=async ()=>{
      const cal = calendarsData.find(c=>c.id===el.dataset.calcolor);
      if(cal){ cal.color = el.value; await persistAll(); render(); }
    });
    app.querySelectorAll('[data-caldefuntil]').forEach(el=>el.onchange=async ()=>{
      const cal = calendarsData.find(c=>c.id===el.dataset.caldefuntil);
      if(cal){ cal.defaultUntil = el.value || null; await persistAll(); render(); }
    });
    const calResetAll = document.getElementById('cal-reset-all');
    if(calResetAll) calResetAll.onclick = async ()=>{
      if(!confirm('Удалить ВСЕ календари и все их уроки? Связанные домашние задания тоже будут удалены (прикреплённые файлы останутся в библиотеке). Действие необратимо.')) return;
      calendarsData = [];
      calRulesData = [];
      calSelectedId = null;
      calRuleEditId = null;
      selectedRuleIds = new Set();
      Object.keys(homeworkData).forEach(key=>{
        if(key.startsWith('cal|')) delete homeworkData[key];
      });
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-calselect]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.calselect;
      calSelectedId = (calSelectedId===id) ? null : id;
      calRuleEditId = null;
      selectedRuleIds = new Set();
      render();
    });
    app.querySelectorAll('[data-caldel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить календарь и все его уроки?')) return;
      const id = el.dataset.caldel;
      calendarsData = calendarsData.filter(c=>c.id!==id);
      calRulesData = calRulesData.filter(r=>r.calendarId!==id);
      if(calSelectedId===id) calSelectedId = null;
      await persistAll();
      render();
    });
    const crTimeMode = document.getElementById('cr-timemode');
    if(crTimeMode){
      const toggleTimeFields = ()=>{
        const lessonField = document.getElementById('cr-lesson-field');
        const timeField = document.getElementById('cr-time-field');
        const timeFieldEnd = document.getElementById('cr-time-field-end');
        const isLesson = crTimeMode.value==='lesson';
        if(lessonField) lessonField.style.display = isLesson ? '' : 'none';
        if(timeField) timeField.style.display = isLesson ? 'none' : '';
        if(timeFieldEnd) timeFieldEnd.style.display = isLesson ? 'none' : '';
      };
      crTimeMode.onchange = toggleTimeFields;
      toggleTimeFields();
    }
    const crSave = document.getElementById('cr-save');
    if(crSave) crSave.onclick = async ()=>{
      const subject = document.getElementById('cr-subject').value.trim();
      const date = document.getElementById('cr-date').value;
      const timeMode = document.getElementById('cr-timemode').value;
      let start, end, lessonNumber = null;
      if(timeMode==='lesson'){
        lessonNumber = parseInt(document.getElementById('cr-lessonnum').value,10);
        const lt = LESSON_TIMES.find(l=>l.n===lessonNumber);
        start = lt.start; end = lt.end;
      } else {
        start = document.getElementById('cr-start').value;
        end = document.getElementById('cr-end').value;
      }
      const repeat = document.getElementById('cr-repeat').value;
      const until = document.getElementById('cr-until').value || null;
      const weekdays = Array.from(app.querySelectorAll('.cr-wd:checked')).map(el=>parseInt(el.value,10));
      if(!subject || !date || !start){ alert('Укажите предмет, дату и время начала.'); return; }
      if(calRuleEditId){
        const r = calRulesData.find(x=>x.id===calRuleEditId);
        if(r) Object.assign(r, {subject,date,start,end:end||start,repeat,weekdays,until,timeMode,lessonNumber});
        calRuleEditId = null;
      } else {
        calRulesData.push({id:'r'+Date.now()+'-'+Math.random().toString(36).slice(2,7), calendarId:calSelectedId, subject, date, start, end:end||start, repeat, weekdays, until, timeMode, lessonNumber});
      }
      await persistAll();
      render();
    };
    const crCancel = document.getElementById('cr-cancel');
    if(crCancel) crCancel.onclick = ()=>{ calRuleEditId = null; render(); };
    app.querySelectorAll('[data-credit]').forEach(el=>el.onclick=()=>{ calRuleEditId = el.dataset.credit; render(); });
    app.querySelectorAll('[data-crdel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить этот урок из расписания?')) return;
      calRulesData = calRulesData.filter(r=>r.id!==el.dataset.crdel);
      if(calRuleEditId===el.dataset.crdel) calRuleEditId = null;
      selectedRuleIds.delete(el.dataset.crdel);
      await persistAll();
      render();
    });
    // ---- multi-select bulk editing of calendar rules ----
    app.querySelectorAll('[data-ruleselect]').forEach(el=>el.onchange=()=>{
      const id = el.dataset.ruleselect;
      if(el.checked) selectedRuleIds.add(id); else selectedRuleIds.delete(id);
      render();
    });
    const crSelectAll = document.getElementById('cr-selectall');
    if(crSelectAll) crSelectAll.onchange = ()=>{
      const rules = calRulesData.filter(r=>r.calendarId===calSelectedId);
      if(crSelectAll.checked) rules.forEach(r=>selectedRuleIds.add(r.id));
      else rules.forEach(r=>selectedRuleIds.delete(r.id));
      render();
    };
    const crBulkClear = document.getElementById('cr-bulk-clear');
    if(crBulkClear) crBulkClear.onclick = ()=>{ selectedRuleIds = new Set(); render(); };
    const crBulkApply = document.getElementById('cr-bulk-apply');
    if(crBulkApply) crBulkApply.onclick = async ()=>{
      const until = document.getElementById('cr-bulk-until').value;
      if(!until){ alert('Укажите дату окончания периодичности.'); return; }
      const ids = Array.from(selectedRuleIds);
      if(!confirm('Установить окончание периодичности «'+fmtDate(until)+'» для выбранных уроков ('+ids.length+')?')) return;
      calRulesData.forEach(r=>{ if(selectedRuleIds.has(r.id)) r.until = until; });
      await persistAll();
      render();
    };
    const crBulkDelete = document.getElementById('cr-bulk-delete');
    if(crBulkDelete) crBulkDelete.onclick = async ()=>{
      const ids = Array.from(selectedRuleIds);
      if(!confirm('Удалить выбранные уроки ('+ids.length+') из расписания?')) return;
      calRulesData = calRulesData.filter(r=>!selectedRuleIds.has(r.id));
      selectedRuleIds = new Set();
      await persistAll();
      render();
    };
    const remPeriod = document.getElementById('rem-period');
    if(remPeriod){
      const toggleRemEnd = ()=>{
        const f = document.getElementById('rem-end-field');
        if(f) f.style.display = remPeriod.checked ? '' : 'none';
      };
      remPeriod.onchange = toggleRemEnd;
      toggleRemEnd();
    }
    const olPeriod = document.getElementById('ol-period');
    if(olPeriod){
      const toggleOlEnd = ()=>{
        const f = document.getElementById('ol-end-field');
        if(f) f.style.display = olPeriod.checked ? '' : 'none';
      };
      olPeriod.onchange = toggleOlEnd;
      toggleOlEnd();
    }
    const remAdd = document.getElementById('rem-add');
    if(remAdd) remAdd.onclick = async ()=>{
      const date = document.getElementById('rem-date').value;
      const isPeriod = document.getElementById('rem-period').checked;
      let dateEnd = isPeriod ? document.getElementById('rem-end').value : null;
      if(dateEnd && dateEnd<date) dateEnd = date;
      const kid = document.getElementById('rem-kid').value;
      const text = document.getElementById('rem-text').value.trim();
      if(!date || !text) return;
      remindersData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type:'reminder', date, dateEnd, kid, text});
      await persistAll();
      render();
    };
    const olAdd = document.getElementById('ol-add');
    if(olAdd) olAdd.onclick = async ()=>{
      const date = document.getElementById('ol-date').value;
      const isPeriod = document.getElementById('ol-period').checked;
      let dateEnd = isPeriod ? document.getElementById('ol-end').value : null;
      if(dateEnd && dateEnd<date) dateEnd = date;
      const kid = document.getElementById('ol-kid').value;
      const text = document.getElementById('ol-text').value.trim();
      if(!date || !text) return;
      remindersData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), type:'olympiad', date, dateEnd, kid, text});
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-remdel]').forEach(el=>el.onclick=async ()=>{
      const id = el.dataset.remdel;
      const rec = remindersData.find(r=>r.id===id);
      const label = rec && rec.type==='olympiad' ? 'олимпиаду' : 'напоминание';
      if(!confirm('Удалить '+label+'?')) return;
      remindersData = remindersData.filter(r=>r.id!==id);
      await persistAll();
      render();
    });
    app.querySelectorAll('[data-remdone]').forEach(el=>el.onchange=async ()=>{
      const rec = remindersData.find(r=>r.id===el.dataset.remdone);
      if(rec){ rec.done = el.checked; await persistAll(); }
      render();
    });
    const vacAdd = document.getElementById('vac-add');
    if(vacAdd) vacAdd.onclick = async ()=>{
      const start = document.getElementById('vac-start').value;
      let end = document.getElementById('vac-end').value;
      const kid = document.getElementById('vac-kid').value;
      const text = document.getElementById('vac-text').value.trim();
      if(!start) return;
      if(!end || end<start) end = start;
      vacationsData.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), start, end, kid, text});
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-vacdel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить запись о каникулах?')) return;
      vacationsData = vacationsData.filter(v=>v.id!==el.dataset.vacdel);
      await persistAll();
      render();
    });
    // ---- grades tab handlers ----
    app.querySelectorAll('[data-gradekid]').forEach(el=>el.onclick=()=>{ gradesKid = el.dataset.gradekid; render(); });
    app.querySelectorAll('[data-gradetri]').forEach(el=>el.onclick=()=>{ gradesTri = parseInt(el.dataset.gradetri,10); render(); });
    app.querySelectorAll('[data-gradeadd]').forEach(el=>el.onclick=async ()=>{
      const [kid, es, triStr] = el.dataset.gradeadd.split('|');
      const subject = decSubj(es);
      const tri = parseInt(triStr,10);
      const valEl = document.getElementById('ga-val-'+es+'-'+tri);
      const wEl = document.getElementById('ga-w-'+es+'-'+tri);
      const value = parseFloat(valEl.value);
      const weight = parseFloat(wEl.value) || 1;
      if(!isFinite(value) || value<1 || value>5){ alert('Введите оценку от 1 до 5.'); return; }
      const list = ensureGradesSlot(kid, subject, tri);
      list.push({id:'g'+Date.now()+'-'+Math.random().toString(36).slice(2,7), value, weight});
      await persistAll();
      render();
    });
    app.querySelectorAll('[data-gradeval]').forEach(el=>el.onchange=async ()=>{
      const [kid, es, triStr, id] = el.dataset.gradeval.split('|');
      const subject = decSubj(es);
      const tri = parseInt(triStr,10);
      const list = gradesFor(kid, subject, tri);
      const g = list.find(x=>x.id===id);
      const value = parseFloat(el.value);
      if(g && isFinite(value)){ g.value = Math.min(5, Math.max(1, value)); await persistAll(); }
      render();
    });
    app.querySelectorAll('[data-gradeweight]').forEach(el=>el.onchange=async ()=>{
      const [kid, es, triStr, id] = el.dataset.gradeweight.split('|');
      const subject = decSubj(es);
      const tri = parseInt(triStr,10);
      const list = gradesFor(kid, subject, tri);
      const g = list.find(x=>x.id===id);
      const weight = parseFloat(el.value);
      if(g){ g.weight = (isFinite(weight) && weight>0) ? weight : 1; await persistAll(); }
      render();
    });
    app.querySelectorAll('[data-gradedel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить эту оценку?')) return;
      const [kid, es, triStr, id] = el.dataset.gradedel.split('|');
      const subject = decSubj(es);
      const tri = parseInt(triStr,10);
      const list = gradesFor(kid, subject, tri);
      const idx = list.findIndex(x=>x.id===id);
      if(idx>=0) list.splice(idx,1);
      await persistAll();
      render();
    });
    app.querySelectorAll('[data-subjdel]').forEach(el=>el.onclick=async ()=>{
      const [kid, es] = el.dataset.subjdel.split('|');
      const subject = decSubj(es);
      if(!confirm('Убрать предмет «'+subject+'» из оценивания? Уже выставленные оценки не удаляются и сохранятся, предмет можно будет вернуть позже.')) return;
      if(!excludedSubjectsData[kid]) excludedSubjectsData[kid] = [];
      if(!excludedSubjectsData[kid].includes(subject)) excludedSubjectsData[kid].push(subject);
      await persistAll();
      render();
    });
    app.querySelectorAll('[data-subjrestore]').forEach(el=>el.onclick=async ()=>{
      const [kid, es] = el.dataset.subjrestore.split('|');
      const subject = decSubj(es);
      excludedSubjectsData[kid] = (excludedSubjectsData[kid]||[]).filter(s=>s!==subject);
      await persistAll();
      render();
    });

    // ---- documents tab handlers ----
    wireDocFileAttach();
    app.querySelectorAll('[data-doccat]').forEach(el=>el.onclick=()=>{ docFilterCat = el.dataset.doccat; render(); });
    const docAdd = document.getElementById('doc-add');
    if(docAdd) docAdd.onclick = async ()=>{
      const title = (document.getElementById('doc-title').value||'').trim();
      const category = document.getElementById('doc-category').value || 'other';
      const note = (document.getElementById('doc-note').value||'').trim();
      const files = docDraft.files.filter(f=>!f.uploading);
      if(!title && files.length===0){ alert('Укажите название или прикрепите файл.'); return; }
      documentsData.push({id:'doc'+Date.now()+'-'+Math.random().toString(36).slice(2,7), title, category, note, files, createdAt:Date.now()});
      docDraft.files = [];
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-docdel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить документ вместе с прикреплёнными файлами?')) return;
      const id = el.dataset.docdel;
      const doc = documentsData.find(d=>d.id===id);
      documentsData = documentsData.filter(d=>d.id!==id);
      await persistAll();
      render();
      if(doc) (doc.files||[]).forEach(removeFileFromStorage);
    });
    app.querySelectorAll('[data-docfiledel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить этот файл?')) return;
      const [docId, fileId] = el.dataset.docfiledel.split('|');
      const doc = documentsData.find(d=>d.id===docId);
      if(doc){
        const removed = (doc.files||[]).find(f=>f.id===fileId);
        doc.files = (doc.files||[]).filter(f=>f.id!==fileId);
        await persistAll();
        render();
        if(removed) removeFileFromStorage(removed);
      }
    });
    const linkAdd = document.getElementById('link-add');
    if(linkAdd) linkAdd.onclick = async ()=>{
      const title = (document.getElementById('link-title').value||'').trim();
      const url = normalizeUrl(document.getElementById('link-url').value);
      const note = (document.getElementById('link-note').value||'').trim();
      if(!url){ alert('Укажите ссылку.'); return; }
      linksData.push({id:'lnk'+Date.now()+'-'+Math.random().toString(36).slice(2,7), title, url, note, createdAt:Date.now()});
      await persistAll();
      render();
    };
    app.querySelectorAll('[data-linkdel]').forEach(el=>el.onclick=async ()=>{
      if(!confirm('Удалить эту ссылку?')) return;
      linksData = linksData.filter(l=>l.id!==el.dataset.linkdel);
      await persistAll();
      render();
    });

    const ps = document.getElementById('print-schedule');
    if(ps) ps.onclick = exportScheduleExcel;
    const phP = document.getElementById('print-hw-petya');
    if(phP) phP.onclick = ()=>printHomework('petya');
    const phF = document.getElementById('print-hw-fedya');
    if(phF) phF.onclick = ()=>printHomework('fedya');
  }

  loadStorage();
})();
</script>
</body>
</html>
